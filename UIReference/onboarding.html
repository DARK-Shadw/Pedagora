<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding &amp; Goal Setting | Pedagora</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d968b",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .technical-label {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Navigation Header -->
<header class="flex items-center justify-between border-b border-primary/10 px-6 md:px-20 py-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
<div class="flex items-center gap-2">
<div class="text-primary">
<span class="material-symbols-outlined text-3xl">architecture</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">Pedagora</h2>
</div>
<div class="flex items-center gap-6">
<span class="technical-label text-[10px] uppercase tracking-widest text-slate-500">System: Active</span>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-6 bg-primary text-white text-sm font-bold transition-all hover:bg-primary/90">
                        Log in
                    </button>
</div>
</header>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-12">
<div class="max-w-[640px] w-full flex flex-col gap-10">
<!-- Progress Section -->
<div class="flex flex-col gap-4 w-full">
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="technical-label text-[10px] uppercase tracking-widest text-primary font-bold">Step 02</span>
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium">Onboarding Progress</p>
</div>
<p class="technical-label text-xs text-slate-500">40% Complete</p>
</div>
<div class="h-1.5 w-full rounded-full bg-primary/10 overflow-hidden">
<div class="h-full rounded-full bg-primary transition-all duration-500" style="width: 40%;"></div>
</div>
</div>
<!-- Hero Question -->
<div class="text-center space-y-4">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl md:text-5xl font-bold tracking-tight leading-tight">
                            What do you want to master?
                        </h1>
<p class="text-slate-500 dark:text-slate-400 text-lg">
                            Describe your learning goal in a few words.
                        </p>
</div>
<!-- Goal Input -->
<div class="w-full">
<label class="block group">
<textarea class="w-full min-h-[160px] p-6 text-xl bg-white dark:bg-slate-900 border border-primary/20 rounded-xl shadow-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-300 dark:placeholder:text-slate-700 resize-none font-display" placeholder="e.g. The fundamentals of Quantum Physics, or Building modern web apps with Python..."></textarea>
</label>
</div>
<!-- Preference Selection -->
<div class="space-y-6">
<div class="flex items-center justify-between">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold">Learning Preference</h3>
<span class="technical-label text-[10px] uppercase text-slate-400">Personalization Engine</span>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Visual Card -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="preference" type="radio"/>
<div class="h-full p-5 flex flex-col gap-3 rounded-xl border border-primary/10 bg-white dark:bg-slate-900 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary transition-all hover:bg-slate-50 dark:hover:bg-slate-800/50">
<span class="material-symbols-outlined text-primary">visibility</span>
<div>
<p class="font-bold text-slate-900 dark:text-slate-100">Visual</p>
<p class="text-xs text-slate-500 mt-1 leading-relaxed">Diagrams, maps, and visual storytelling.</p>
</div>
</div>
</label>
<!-- Depth-first Card -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="preference" type="radio"/>
<div class="h-full p-5 flex flex-col gap-3 rounded-xl border border-primary/10 bg-white dark:bg-slate-900 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary transition-all hover:bg-slate-50 dark:hover:bg-slate-800/50">
<span class="material-symbols-outlined text-primary">layers</span>
<div>
<p class="font-bold text-slate-900 dark:text-slate-100">Depth-first</p>
<p class="text-xs text-slate-500 mt-1 leading-relaxed">Deep dives into first principles first.</p>
</div>
</div>
</label>
<!-- Fast-paced Card -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="preference" type="radio"/>
<div class="h-full p-5 flex flex-col gap-3 rounded-xl border border-primary/10 bg-white dark:bg-slate-900 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary transition-all hover:bg-slate-50 dark:hover:bg-slate-800/50">
<span class="material-symbols-outlined text-primary">bolt</span>
<div>
<p class="font-bold text-slate-900 dark:text-slate-100">Fast-paced</p>
<p class="text-xs text-slate-500 mt-1 leading-relaxed">Concise summaries and rapid testing.</p>
</div>
</div>
</label>
</div>
</div>
<!-- Footer Action -->
<div class="flex flex-col gap-4 pt-6 border-t border-primary/5">
<button class="w-full py-4 bg-primary hover:bg-primary/90 text-white rounded-xl font-bold text-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                            Continue
                            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<button class="w-full py-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors text-sm font-medium">
                            I'm not sure yet, skip for now
                        </button>
</div>
</div>
</main>
<!-- Decorative Elements -->
<div class="fixed bottom-0 left-0 w-full h-1/2 pointer-events-none z-[-1] opacity-20 dark:opacity-10">
<div class="absolute inset-0 bg-gradient-to-t from-primary/20 to-transparent" data-alt="Soft green gradient background pattern"></div>
</div>
</div>
</div>
</body></html>
