<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A roadmap timeline showing the student's learning journey. P</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
// === SETUP ===
const container = document.getElementById('canvas-container');
container.style.overflow = 'hidden';
container.style.background = '#0d1117';
container.style.fontFamily = "'Inter', 'Segoe UI', sans-serif";

const W = container.offsetWidth || window.innerWidth;
const H = container.offsetHeight || window.innerHeight;

// ─── DATA ───────────────────────────────────────────────────────────────────
const PAST_NODE = {
  id: 'past',
  label: "Probability &\nDistributions",
  subtitle: "TODAY'S LESSON ✓",
  icons: [
    { sym: 'G', name: 'Gaussian', color: '#3B82F6' },
    { sym: 'KL', name: 'KL Div', color: '#8B5CF6' },
    { sym: 'B', name: 'Bayes', color: '#F59E0B' },
    { sym: 'MC', name: 'Monte Carlo', color: '#22C55E' }
  ]
};

const FUTURE_NODES = [
  { id: 'la',   label: 'Linear Algebra\nfor Transformations',   note: null,                                color: '#3B82F6' },
  { id: 'nn',   label: 'Neural Network\nFoundations',           note: null,                                color: '#3B82F6' },
  { id: 'vae',  label: 'Autoencoders\n& VAEs',                  note: 'KL divergence +\nGaussian sampling', color: '#8B5CF6' },
  { id: 'diff', label: 'Diffusion\nModels',                     note: 'Conditional prob +\nMonte Carlo',    color: '#8B5CF6' },
  { id: 'temp', label: 'Temporal Modeling\n(Video)',            note: null,                                color: '#8B5CF6' },
  { id: 'build',label: 'BUILD:\nVideo Generation',             note: 'ALL of the above',                  color: '#F59E0B' }
];

// ─── LAYOUT ─────────────────────────────────────────────────────────────────
const TITLE_H    = 72;
const FOOTER_H   = 56;
const USABLE_H   = H - TITLE_H - FOOTER_H;
const ROAD_Y     = TITLE_H + USABLE_H / 2;
const PAST_X     = W * 0.10;
const FUTURE_START_X = W * 0.24;
const FUTURE_END_X   = W * 0.94;
const STEP = (FUTURE_END_X - FUTURE_START_X) / (FUTURE_NODES.length - 1);

function futureX(i) { return FUTURE_START_X + i * STEP; }

// ─── DOM HELPERS ─────────────────────────────────────────────────────────────
function el(tag, css = {}, parent = container) {
  const e = document.createElement(tag);
  Object.assign(e.style, css);
  parent.appendChild(e);
  return e;
}

// ─── TITLE ───────────────────────────────────────────────────────────────────
const titleEl = el('div', {
  position: 'absolute', top: '0', left: '0', width: '100%', height: TITLE_H + 'px',
  display: 'flex', alignItems: 'center', justifyContent: 'center',
  fontSize: '22px', fontWeight: '700', color: '#c9d1d9', letterSpacing: '0.04em',
  opacity: '0', zIndex: '10'
});
titleEl.textContent = 'Your Learning Roadmap';

// ─── SVG LAYER (road line, connectors, node circles) ─────────────────────────
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('width', W);
svg.setAttribute('height', H);
svg.style.position = 'absolute';
svg.style.top = '0';
svg.style.left = '0';
svg.style.zIndex = '1';
container.appendChild(svg);

function svgEl(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  parent.appendChild(e);
  return e;
}

// Defs: glows
const defs = svgEl('defs');

function makeGlow(id, color) {
  const f = svgEl('filter', { id, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  const g = svgEl('feGaussianBlur', { stdDeviation: '6', result: 'blur' }, f);
  const c = svgEl('feFlood', { 'flood-color': color, 'flood-opacity': '0.7', result: 'col' }, f);
  svgEl('feComposite', { in: 'col', in2: 'blur', operator: 'in', result: 'glow' }, f);
  const merge = svgEl('feMerge', {}, f);
  svgEl('feMergeNode', { in: 'glow' }, merge);
  svgEl('feMergeNode', { in: 'SourceGraphic' }, merge);
}
makeGlow('glow-blue',   '#3B82F6');
makeGlow('glow-purple', '#8B5CF6');
makeGlow('glow-yellow', '#F59E0B');
makeGlow('glow-green',  '#22C55E');

// Main road line (dashed extension for future)
const roadLinePast = svgEl('line', {
  x1: PAST_X, y1: ROAD_Y, x2: FUTURE_END_X, y2: ROAD_Y,
  stroke: '#1e293b', 'stroke-width': '3'
});
const roadLineActive = svgEl('line', {
  x1: PAST_X, y1: ROAD_Y, x2: PAST_X, y2: ROAD_Y,
  stroke: '#3B82F6', 'stroke-width': '3',
  opacity: '0'
});

// ─── PAST NODE ───────────────────────────────────────────────────────────────
const PAST_R = 46;

// Completed ring
const pastRing = svgEl('circle', {
  cx: PAST_X, cy: ROAD_Y, r: PAST_R + 6,
  fill: 'none', stroke: '#22C55E', 'stroke-width': '2.5',
  'stroke-dasharray': '4 3', opacity: '0', filter: 'url(#glow-green)'
});
const pastCircle = svgEl('circle', {
  cx: PAST_X, cy: ROAD_Y, r: PAST_R,
  fill: '#0f1f14', stroke: '#22C55E', 'stroke-width': '3', opacity: '0'
});
const pastCheck = svgEl('text', {
  x: PAST_X, y: ROAD_Y - 6,
  'text-anchor': 'middle', 'dominant-baseline': 'middle',
  fill: '#22C55E', 'font-size': '24', 'font-weight': '700', opacity: '0'
});
pastCheck.textContent = '✓';

const pastLabel1 = svgEl('text', {
  x: PAST_X, y: ROAD_Y + PAST_R + 22,
  'text-anchor': 'middle', fill: '#c9d1d9', 'font-size': '12', 'font-weight': '700', opacity: '0'
});
pastLabel1.textContent = 'Probability &';
const pastLabel2 = svgEl('text', {
  x: PAST_X, y: ROAD_Y + PAST_R + 37,
  'text-anchor': 'middle', fill: '#c9d1d9', 'font-size': '12', 'font-weight': '700', opacity: '0'
});
pastLabel2.textContent = 'Distributions';
const pastSub = svgEl('text', {
  x: PAST_X, y: ROAD_Y + PAST_R + 54,
  'text-anchor': 'middle', fill: '#22C55E', 'font-size': '10', 'font-weight': '600', opacity: '0'
});
pastSub.textContent = "TODAY'S LESSON ✓";

// Past icons (mini badges above)
const ICON_COLORS = { G: '#3B82F6', KL: '#8B5CF6', B: '#F59E0B', MC: '#22C55E' };
const pastIconEls = [];
PAST_NODE.icons.forEach((ic, i) => {
  const ix = PAST_X - 34 + i * 23;
  const iy = ROAD_Y - PAST_R - 22;
  const g = svgEl('g', { opacity: '0', class: 'past-icon-' + i });
  svgEl('circle', { cx: ix, cy: iy, r: 10, fill: ic.color + '33', stroke: ic.color, 'stroke-width': '1.5' }, g);
  const t = svgEl('text', { x: ix, y: iy, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: ic.color, 'font-size': ic.sym.length > 1 ? '6' : '9', 'font-weight': '700' }, g);
  t.textContent = ic.sym;
  svg.appendChild(g);
  pastIconEls.push(g);
});

// ─── FUTURE NODES ────────────────────────────────────────────────────────────
const NODE_R = 32;
const futureNodeEls = FUTURE_NODES.map((n, i) => {
  const cx = futureX(i);
  const isBuild = n.id === 'build';
  const r = isBuild ? NODE_R + 8 : NODE_R;

  const group = svgEl('g', { opacity: '0', class: 'future-node-' + i });

  // glow ring for upcoming
  const glowF = n.color === '#F59E0B' ? 'url(#glow-yellow)' : (n.color === '#8B5CF6' ? 'url(#glow-purple)' : 'url(#glow-blue)');
  svgEl('circle', { cx, cy: ROAD_Y, r: r + 10, fill: 'none', stroke: n.color, 'stroke-width': '1', opacity: '0.3', filter: glowF, class: 'glow-ring-' + i }, group);
  svgEl('circle', { cx, cy: ROAD_Y, r, fill: isBuild ? '#1a1200' : '#0d1117', stroke: n.color, 'stroke-width': isBuild ? '3' : '2' }, group);

  // number
  const numEl = svgEl('text', { x: cx, y: ROAD_Y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: n.color, 'font-size': isBuild ? '16' : '14', 'font-weight': '700' }, group);
  numEl.textContent = isBuild ? '★' : String(i + 1);

  // label (above for even, below for odd)
  const above = i % 2 === 0;
  const ly = above ? ROAD_Y - r - 40 : ROAD_Y + r + 18;
  n.label.split('\n').forEach((line, li) => {
    const lt = svgEl('text', { x: cx, y: ly + li * 16, 'text-anchor': 'middle', fill: '#c9d1d9', 'font-size': '11', 'font-weight': '600' }, group);
    lt.textContent = line;
  });

  // note badge (if any)
  if (n.note) {
    const noteY = above ? ROAD_Y + r + 18 : ROAD_Y - r - 42;
    n.note.split('\n').forEach((line, li) => {
      const nt = svgEl('text', { x: cx, y: noteY + li * 14, 'text-anchor': 'middle', fill: n.color, 'font-size': '9.5', 'font-style': 'italic' }, group);
      nt.textContent = '← ' + line;
    });
  }

  svg.appendChild(group);
  return group;
});

// ─── FOOTER ──────────────────────────────────────────────────────────────────
const footerEl = el('div', {
  position: 'absolute', bottom: '0', left: '0', width: '100%', height: FOOTER_H + 'px',
  display: 'flex', alignItems: 'center', justifyContent: 'center',
  fontSize: '15px', fontWeight: '600', color: '#F59E0B',
  letterSpacing: '0.03em', opacity: '0', zIndex: '10',
  textShadow: '0 0 20px #F59E0B66'
});
footerEl.textContent = 'Every concept today was chosen because your end goal demands it.';

// ─── CONNECTOR LINES (past → future[0] already in road line) ────────────────
const connectors = FUTURE_NODES.slice(0, -1).map((_, i) => {
  const x1 = futureX(i) + NODE_R;
  const x2 = futureX(i + 1) - NODE_R;
  const ln = svgEl('line', {
    x1, y1: ROAD_Y, x2: x1, y2: ROAD_Y,
    stroke: '#334155', 'stroke-width': '2', 'stroke-dasharray': '6 3', opacity: '0'
  });
  return ln;
});

// Also connector from past to future[0]
const connPastFuture = svgEl('line', {
  x1: PAST_X + PAST_R, y1: ROAD_Y,
  x2: PAST_X + PAST_R, y2: ROAD_Y,
  stroke: '#334155', 'stroke-width': '2', 'stroke-dasharray': '6 3', opacity: '0'
});

// ─── ANIMATION TIMELINE ──────────────────────────────────────────────────────

// ── STEP 1: Intro + Past Node ─────────────────────────────────────────────
tl.addLabel('intro');

tl.to(titleEl, { opacity: 1, duration: 1.2, ease: 'power2.out' }, 'intro');
tl.to(roadLinePast, { opacity: 1, duration: 0 }, 'intro');

// Past circle appears
tl.to(pastCircle, { opacity: 1, duration: 0.8, ease: 'back.out(1.5)' }, 'intro+=1.0');
tl.to(pastRing,   { opacity: 1, duration: 0.6 }, 'intro+=1.2');
tl.to(pastCheck,  { opacity: 1, duration: 0.5 }, 'intro+=1.5');
tl.to(pastLabel1, { opacity: 1, duration: 0.5 }, 'intro+=1.7');
tl.to(pastLabel2, { opacity: 1, duration: 0.5 }, 'intro+=1.85');
tl.to(pastSub,    { opacity: 1, duration: 0.5 }, 'intro+=2.0');

// Icons pop in one by one
pastIconEls.forEach((ic, i) => {
  tl.to(ic, { opacity: 1, duration: 0.4, ease: 'back.out(2)' }, `intro+=${2.3 + i * 0.25}`);
});

// Spin ring slowly
gsap.to(pastRing, { rotation: 360, transformOrigin: `${PAST_X}px ${ROAD_Y}px`, duration: 14, repeat: -1, ease: 'none' });

// ── STEP 2: Road + Future Nodes Reveal ────────────────────────────────────
tl.addLabel('roadmap', 'intro+=4.5');

// Connector past→future[0]
tl.to(connPastFuture, {
  opacity: 1,
  attr: { x2: futureX(0) - NODE_R },
  duration: 1.0, ease: 'power1.inOut'
}, 'roadmap');

// Reveal future nodes and connectors left-to-right
FUTURE_NODES.forEach((_, i) => {
  const t = `roadmap+=${i * 1.6}`;

  // Node fades/scales in
  tl.fromTo(futureNodeEls[i],
    { opacity: 0, scale: 0.4, transformOrigin: `${futureX(i)}px ${ROAD_Y}px` },
    { opacity: 1, scale: 1,   duration: 0.7, ease: 'back.out(1.4)' },
    t
  );

  // Glow ring pulse
  const glowRing = futureNodeEls[i].querySelector('.glow-ring-' + i) || futureNodeEls[i].firstChild;
  gsap.to(glowRing, { opacity: 0.6, scale: 1.15, transformOrigin: `${futureX(i)}px ${ROAD_Y}px`, duration: 1.4, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: i * 0.3 });

  // Connector to next
  if (i < FUTURE_NODES.length - 1) {
    tl.to(connectors[i], {
      opacity: 1,
      attr: { x2: futureX(i + 1) - NODE_R },
      duration: 1.0, ease: 'power1.inOut'
    }, `roadmap+=${i * 1.6 + 0.6}`);
  }
});

// ── STEP 3: BUILD pulse + context notes + footer ─────────────────────────
tl.addLabel('climax', `roadmap+=${FUTURE_NODES.length * 1.6 + 0.5}`);

// BUILD node extra pulse
const buildEl = futureNodeEls[FUTURE_NODES.length - 1];
const buildX = futureX(FUTURE_NODES.length - 1);
tl.to(buildEl, {
  filter: 'drop-shadow(0 0 24px #F59E0B)',
  duration: 0
}, 'climax');

// Repeating scale pulse for BUILD (starts on climax)
gsap.to(buildEl, {
  scale: 1.12, transformOrigin: `${buildX}px ${ROAD_Y}px`,
  duration: 0.9, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: tl.duration() * 0.85
});

// Highlight connection notes — tint them
tl.to([futureNodeEls[3], futureNodeEls[4]], { // VAE and Diffusion have notes
  filter: 'drop-shadow(0 0 10px #8B5CF6)',
  duration: 0.6
}, 'climax+=0.5');

// Road line lights up blue left to right
tl.to(roadLineActive, {
  opacity: 1,
  attr: { x2: FUTURE_END_X },
  duration: 2.5, ease: 'power2.inOut'
}, 'climax+=0.8');

// Footer
tl.to(footerEl, { opacity: 1, duration: 1.0, ease: 'power2.out' }, 'climax+=2.0');

// Gentle footer glow pulse
gsap.to(footerEl, { textShadow: '0 0 40px #F59E0Baa', duration: 1.8, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: tl.duration() });

// ── STEP 4: Zoom-out breathe (hold) ──────────────────────────────────────
tl.addLabel('hold', `climax+=4.0`);
tl.to(container, { scale: 1.02, transformOrigin: '50% 50%', duration: 4, ease: 'sine.inOut' }, 'hold');
tl.to(container, { scale: 1.0,  transformOrigin: '50% 50%', duration: 4, ease: 'sine.inOut' }, 'hold+=4');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
