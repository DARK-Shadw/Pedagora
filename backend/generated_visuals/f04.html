<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A centered bell curve with mu = 0, sigma = 1 drawn on a coor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
// === SETUP ===
const container = document.getElementById('canvas-container');
container.style.cssText = 'position:relative;width:100vw;height:100vh;background:#0d1117;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;';

// State
let mu = 0, sigma = 1;
let ghostMu = null, ghostSigma = null;

// Dimensions
const W = Math.min(window.innerWidth * 0.85, 900);
const H = Math.min(window.innerHeight * 0.55, 420);
const margin = { top: 30, right: 40, bottom: 50, left: 55 };
const innerW = W - margin.left - margin.right;
const innerH = H - margin.top - margin.bottom;

// === FORMULA DIV ===
const formulaDiv = document.createElement('div');
formulaDiv.id = 'formula-box';
formulaDiv.style.cssText = 'opacity:0;margin-bottom:18px;font-size:1.45rem;color:#c9d1d9;display:flex;align-items:center;gap:6px;';
container.appendChild(formulaDiv);

function renderFormula(highlightMu, highlightSigma) {
  formulaDiv.innerHTML = '';
  const prefix = document.createElement('span');
  prefix.style.color = '#c9d1d9';
  prefix.textContent = 'N(x ∣ ';
  formulaDiv.appendChild(prefix);

  const muEl = document.createElement('span');
  muEl.id = 'formula-mu';
  muEl.style.cssText = `font-weight:bold;transition:color 0.3s;color:${highlightMu ? '#F59E0B' : '#c9d1d9'};`;
  muEl.textContent = 'μ';
  formulaDiv.appendChild(muEl);

  const comma = document.createElement('span');
  comma.style.color = '#c9d1d9';
  comma.textContent = ', ';
  formulaDiv.appendChild(comma);

  const sigmaEl = document.createElement('span');
  sigmaEl.id = 'formula-sigma';
  sigmaEl.style.cssText = `font-weight:bold;transition:color 0.3s;color:${highlightSigma ? '#8B5CF6' : '#c9d1d9'};`;
  sigmaEl.textContent = 'σ²';
  formulaDiv.appendChild(sigmaEl);

  const suffix = document.createElement('span');
  suffix.style.color = '#c9d1d9';
  suffix.textContent = ') = ';
  formulaDiv.appendChild(suffix);

  const eqEl = document.createElement('span');
  eqEl.style.cssText = 'font-size:1.1rem;color:#c9d1d9;font-family:monospace;';
  eqEl.textContent = '1/(σ√(2π)) · exp(−(x−μ)²/(2σ²))';
  formulaDiv.appendChild(eqEl);
}
renderFormula(false, false);

// === SVG ===
const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svgEl.setAttribute('width', W);
svgEl.setAttribute('height', H);
svgEl.style.cssText = 'opacity:0;display:block;';
container.appendChild(svgEl);

const svg = d3.select(svgEl);
const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

// Scales
const xDomain = [-5, 8];
const xScale = d3.scaleLinear().domain(xDomain).range([0, innerW]);
const yScale = d3.scaleLinear().domain([0, 1.1]).range([innerH, 0]);

// Axes
const xAxisG = g.append('g').attr('transform', `translate(0,${innerH})`).attr('class','x-axis');
const yAxisG = g.append('g').attr('class','y-axis');

function styleAxis(axisG) {
  axisG.selectAll('line,path').style('stroke','#444');
  axisG.selectAll('text').style('fill','#888').style('font-size','12px');
}

xAxisG.call(d3.axisBottom(xScale).ticks(10).tickSize(-innerH)).call(styleAxis);
yAxisG.call(d3.axisLeft(yScale).ticks(6)).call(styleAxis);

// Grid lines style
xAxisG.selectAll('.tick line').style('stroke','#222').style('stroke-dasharray','3,3');

// Axis labels
g.append('text').attr('x', innerW/2).attr('y', innerH + 42).attr('text-anchor','middle')
  .style('fill','#666').style('font-size','13px').text('x');
g.append('text').attr('transform','rotate(-90)').attr('x',-innerH/2).attr('y',-42)
  .attr('text-anchor','middle').style('fill','#666').style('font-size','13px').text('Probability density');

// Gaussian PDF
function gaussPDF(x, m, s) {
  return (1 / (s * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - m) / s) ** 2);
}

function makeCurvePath(m, s) {
  const pts = d3.range(xDomain[0], xDomain[1], 0.05).map(x => [xScale(x), yScale(gaussPDF(x, m, s))]);
  return d3.line()(pts);
}

function makeAreaPath(m, s, sigmaFactor) {
  const lo = m - sigmaFactor * s;
  const hi = m + sigmaFactor * s;
  const pts = d3.range(lo, hi, 0.02).map(x => [xScale(x), yScale(gaussPDF(x, m, s))]);
  pts.unshift([xScale(lo), yScale(0)]);
  pts.push([xScale(hi), yScale(0)]);
  return d3.line()(pts);
}

// Shaded regions group (behind curve)
const shadedG = g.append('g').attr('class','shaded-regions').style('opacity',0);

const regionColors = ['#F59E0B', '#22C55E', '#3B82F6'];
const regionSigmas = [3, 2, 1];
const regionLabels = ['99.7%', '95%', '68%'];
const regionPaths = [];
const regionLabelEls = [];

regionSigmas.forEach((sf, i) => {
  const p = shadedG.append('path')
    .attr('fill', regionColors[i])
    .attr('fill-opacity', 0.22)
    .attr('stroke', regionColors[i])
    .attr('stroke-width', 1)
    .attr('stroke-dasharray', '4,3')
    .attr('d', makeAreaPath(mu, sigma, sf));
  regionPaths.push(p);

  const lbl = shadedG.append('text')
    .attr('text-anchor','middle')
    .style('fill', regionColors[i])
    .style('font-size','12px')
    .style('font-weight','bold')
    .text(regionLabels[i]);
  regionLabelEls.push(lbl);
});

function updateRegionLabels(m, s) {
  regionSigmas.forEach((sf, i) => {
    const yTop = gaussPDF(m, m, s);
    const lx = xScale(m);
    const ly = yScale(yTop * (sf === 3 ? 0.08 : sf === 2 ? 0.15 : 0.22));
    regionLabelEls[i].attr('x', lx).attr('y', ly + (sf === 3 ? 0 : sf === 2 ? -20 : -40));
  });
}

// Ghost curve
const ghostPath = g.append('path')
  .attr('class','ghost-curve')
  .attr('fill','none')
  .attr('stroke','#3B82F6')
  .attr('stroke-width', 1.5)
  .attr('stroke-dasharray','6,4')
  .attr('opacity', 0);

// Main curve
const mainPath = g.append('path')
  .attr('class','main-curve')
  .attr('fill','none')
  .attr('stroke','#3B82F6')
  .attr('stroke-width', 3)
  .attr('filter','drop-shadow(0 0 6px #3B82F6aa)')
  .attr('d', makeCurvePath(mu, sigma));

// Mean indicator line
const meanLine = g.append('line')
  .attr('stroke','#F59E0B')
  .attr('stroke-width', 1.5)
  .attr('stroke-dasharray','5,3')
  .attr('opacity',0);

// Sigma bracket
const sigmaBracketG = g.append('g').attr('class','sigma-bracket').style('opacity',0);
sigmaBracketG.append('line').attr('class','sb-left').attr('stroke','#8B5CF6').attr('stroke-width',2);
sigmaBracketG.append('line').attr('class','sb-right').attr('stroke','#8B5CF6').attr('stroke-width',2);
sigmaBracketG.append('line').attr('class','sb-top').attr('stroke','#8B5CF6').attr('stroke-width',1.5).attr('stroke-dasharray','4,3');
sigmaBracketG.append('text').attr('class','sb-label').attr('text-anchor','middle')
  .style('fill','#8B5CF6').style('font-size','13px').style('font-weight','bold');

function updateSigmaBracket(m, s) {
  const halfH = gaussPDF(m, m, s) * 0.607;
  const bY = yScale(halfH);
  const lX = xScale(m - s);
  const rX = xScale(m + s);
  const tickH = 8;
  sigmaBracketG.select('.sb-left').attr('x1',lX).attr('y1',bY-tickH).attr('x2',lX).attr('y2',bY+tickH);
  sigmaBracketG.select('.sb-right').attr('x1',rX).attr('y1',bY-tickH).attr('x2',rX).attr('y2',bY+tickH);
  sigmaBracketG.select('.sb-top').attr('x1',lX).attr('y1',bY).attr('x2',rX).attr('y2',bY);
  sigmaBracketG.select('.sb-label').attr('x',(lX+rX)/2).attr('y',bY-14).text('1σ');
}
updateSigmaBracket(mu, sigma);

function updateMeanLine(m, s) {
  const yTop = yScale(gaussPDF(m, m, s));
  meanLine.attr('x1',xScale(m)).attr('y1',yTop).attr('x2',xScale(m)).attr('y2',yScale(0));
}
updateMeanLine(mu, sigma);

// === SLIDERS ===
const slidersDiv = document.createElement('div');
slidersDiv.style.cssText = 'opacity:0;display:flex;gap:48px;margin-top:16px;align-items:flex-start;';
container.appendChild(slidersDiv);

function makeSlider(label, color, min, max, step, initial, onChange) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;';

  const lbl = document.createElement('div');
  lbl.style.cssText = `font-family:monospace;font-size:1rem;font-weight:bold;color:${color};`;
  lbl.textContent = `${label} = ${initial.toFixed(2)}`;
  wrap.appendChild(lbl);

  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step; inp.value = initial;
  inp.style.cssText = `width:220px;accent-color:${color};cursor:pointer;`;
  inp.addEventListener('input', () => {
    lbl.textContent = `${label} = ${parseFloat(inp.value).toFixed(2)}`;
    onChange(parseFloat(inp.value));
  });
  wrap.appendChild(inp);
  return { wrap, lbl, inp };
}

const { wrap: muWrap, lbl: muLabel, inp: muInput } = makeSlider('μ', '#F59E0B', -2, 5, 0.1, 0, val => {
  if (ghostMu === null) {
    ghostMu = mu; ghostSigma = sigma;
    ghostPath.attr('d', makeCurvePath(ghostMu, ghostSigma)).attr('opacity', 0.45);
  }
  mu = val;
  mainPath.attr('d', makeCurvePath(mu, sigma));
  updateRegions();
  updateMeanLine(mu, sigma);
  updateSigmaBracket(mu, sigma);
  const muEl = document.getElementById('formula-mu');
  if (muEl) { muEl.style.color = '#F59E0B'; setTimeout(() => { if (muEl) muEl.style.color = '#c9d1d9'; }, 600); }
});

const { wrap: sigWrap, lbl: sigLabel, inp: sigInput } = makeSlider('σ', '#8B5CF6', 0.3, 3, 0.05, 1, val => {
  sigma = val;
  mainPath.attr('d', makeCurvePath(mu, sigma));
  updateRegions();
  updateMeanLine(mu, sigma);
  updateSigmaBracket(mu, sigma);
  const sigEl = document.getElementById('formula-sigma');
  if (sigEl) { sigEl.style.color = '#8B5CF6'; setTimeout(() => { if (sigEl) sigEl.style.color = '#c9d1d9'; }, 600); }
});

slidersDiv.appendChild(muWrap);
slidersDiv.appendChild(sigWrap);

function updateRegions() {
  regionSigmas.forEach((sf, i) => {
    regionPaths[i].attr('d', makeAreaPath(mu, sigma, sf));
  });
  updateRegionLabels(mu, sigma);
}

// === STATS BADGE ===
const statsDiv = document.createElement('div');
statsDiv.style.cssText = 'opacity:0;display:flex;gap:20px;margin-top:10px;';
container.appendChild(statsDiv);

const badges = [
  { label:'68% within 1σ', color:'#3B82F6' },
  { label:'95% within 2σ', color:'#22C55E' },
  { label:'99.7% within 3σ', color:'#F59E0B' },
];
badges.forEach(b => {
  const div = document.createElement('div');
  div.style.cssText = `font-size:0.78rem;padding:4px 10px;border-radius:4px;border:1px solid ${b.color};color:${b.color};font-weight:bold;`;
  div.textContent = b.label;
  statsDiv.appendChild(div);
});

// === STEP TITLE ===
const stepTitle = document.createElement('div');
stepTitle.style.cssText = 'position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:1rem;color:#555;letter-spacing:0.08em;text-transform:uppercase;opacity:0;';
container.appendChild(stepTitle);

function setTitle(text) {
  gsap.to(stepTitle, { opacity: 0, duration: 0.3, onComplete: () => {
    stepTitle.textContent = text;
    gsap.to(stepTitle, { opacity: 1, duration: 0.4 });
  }});
}

// === GSAP TIMELINE ===

// Step 1: Intro — show axes + curve + formula
tl.addLabel('intro');
tl.to(svgEl, { opacity: 1, duration: 0.8, ease: 'power2.inOut' });
tl.to(formulaDiv, { opacity: 1, duration: 0.7, ease: 'power2.inOut' }, '<0.3');
tl.call(() => { stepTitle.textContent = 'The Normal Distribution'; gsap.to(stepTitle, { opacity: 1, duration: 0.5 }); });

// Animate curve drawing via stroke-dasharray trick
tl.call(() => {
  const pathEl = mainPath.node();
  const len = pathEl.getTotalLength();
  gsap.set(pathEl, { strokeDasharray: len, strokeDashoffset: len });
  gsap.to(pathEl, { strokeDashoffset: 0, duration: 2.2, ease: 'power2.inOut' });
});
tl.to({}, { duration: 2.4 });

// Fade in mean line
tl.to(meanLine.node(), { opacity: 0.7, duration: 0.6 });
tl.to(sigmaBracketG.node(), { opacity: 1, duration: 0.5 }, '<');

// Step 2: Show shaded 68/95/99.7 regions
tl.addLabel('empirical-rule');
tl.call(() => setTitle('Empirical Rule: 68 — 95 — 99.7'));
tl.to(shadedG.node(), { opacity: 1, duration: 0.8, ease: 'power2.inOut' });
tl.call(() => updateRegionLabels(mu, sigma));
tl.to(statsDiv, { opacity: 1, duration: 0.7, ease: 'power2.inOut' }, '<0.3');
tl.to({}, { duration: 3.5 });

// Step 3: Show sliders, demo mu animation
tl.addLabel('mu-demo');
tl.call(() => setTitle('Shifting the Mean μ'));
tl.to(slidersDiv, { opacity: 1, duration: 0.6, ease: 'power2.inOut' });
tl.to({}, { duration: 0.8 });

// Animate mu from 0 to 3 via proxy object
const muProxy = { val: 0 };
tl.to(muProxy, {
  val: 3,
  duration: 5,
  ease: 'power1.inOut',
  onUpdate: function() {
    const v = +muProxy.val.toFixed(2);
    mu = v;
    muInput.value = v;
    muLabel.textContent = `μ = ${v.toFixed(2)}`;
    if (ghostMu === null) {
      ghostMu = 0; ghostSigma = 1;
      ghostPath.attr('d', makeCurvePath(0, 1)).attr('opacity', 0.4);
    }
    mainPath.attr('d', makeCurvePath(mu, sigma));
    updateRegions();
    updateMeanLine(mu, sigma);
    updateSigmaBracket(mu, sigma);
    const muEl = document.getElementById('formula-mu');
    if (muEl) muEl.style.color = '#F59E0B';
  },
  onComplete: () => {
    const muEl = document.getElementById('formula-mu');
    if (muEl) gsap.to(muEl, { color: '#c9d1d9', duration: 1, delay: 0.5 });
  }
});
tl.to({}, { duration: 2 });

// Reset mu back to 0
const muProxy2 = { val: 3 };
tl.to(muProxy2, {
  val: 0,
  duration: 2.5,
  ease: 'power2.inOut',
  onUpdate: function() {
    const v = +muProxy2.val.toFixed(2);
    mu = v;
    muInput.value = v;
    muLabel.textContent = `μ = ${v.toFixed(2)}`;
    mainPath.attr('d', makeCurvePath(mu, sigma));
    updateRegions();
    updateMeanLine(mu, sigma);
    updateSigmaBracket(mu, sigma);
  },
  onComplete: () => { ghostMu = null; ghostPath.attr('opacity', 0); }
});
tl.to({}, { duration: 1 });

// Step 4: Sigma demo — flattening and spiking
tl.addLabel('sigma-demo');
tl.call(() => setTitle('Changing the Spread σ'));

// Widen: sigma 1 → 3
const sigProxy1 = { val: 1 };
tl.to(sigProxy1, {
  val: 3,
  duration: 4,
  ease: 'power1.inOut',
  onUpdate: function() {
    const v = +sigProxy1.val.toFixed(2);
    sigma = v;
    sigInput.value = v;
    sigLabel.textContent = `σ = ${v.toFixed(2)}`;
    mainPath.attr('d', makeCurvePath(mu, sigma));
    updateRegions();
    updateMeanLine(mu, sigma);
    updateSigmaBracket(mu, sigma);
    const sigEl = document.getElementById('formula-sigma');
    if (sigEl) sigEl.style.color = '#8B5CF6';
  }
});
tl.to({}, { duration: 1.5 });

// Narrow: sigma 3 → 0.3 (spike)
const sigProxy2 = { val: 3 };
tl.to(sigProxy2, {
  val: 0.3,
  duration: 4.5,
  ease: 'power1.inOut',
  onUpdate: function() {
    const v = +sigProxy2.val.toFixed(2);
    sigma = v;
    sigInput.value = v;
    sigLabel.textContent = `σ = ${v.toFixed(2)}`;
    mainPath.attr('d', makeCurvePath(mu, sigma));
    updateRegions();
    updateMeanLine(mu, sigma);
    updateSigmaBracket(mu, sigma);
  }
});
tl.to({}, { duration: 1.5 });

// Return to normal: sigma 0.3 → 1
const sigProxy3 = { val: 0.3 };
tl.to(sigProxy3, {
  val: 1,
  duration: 2.5,
  ease: 'power2.inOut',
  onUpdate: function() {
    const v = +sigProxy3.val.toFixed(2);
    sigma = v;
    sigInput.value = v;
    sigLabel.textContent = `σ = ${v.toFixed(2)}`;
    mainPath.attr('d', makeCurvePath(mu, sigma));
    updateRegions();
    updateMeanLine(mu, sigma);
    updateSigmaBracket(mu, sigma);
    const sigEl = document.getElementById('formula-sigma');
    if (sigEl) gsap.to(sigEl, { color: '#c9d1d9', duration: 0.3 });
  }
});

// Final hold
tl.to({}, { duration: 3 });
tl.addLabel('end');
tl.call(() => setTitle('Normal Distribution — Interactive'));

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
