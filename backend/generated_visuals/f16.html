<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A grand unified pipeline diagram animates step by step. Step</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.position = 'relative';
container.style.overflow = 'hidden';
container.style.background = '#0d1117';
container.style.fontFamily = "'Inter', 'Segoe UI', sans-serif";

// ── SVG scaffold ──────────────────────────────────────────────────────────────
const W = container.clientWidth || window.innerWidth;
const H = container.clientHeight || window.innerHeight;

const svg = d3.select(container).append('svg')
  .attr('width', W).attr('height', H)
  .style('position', 'absolute').style('top', 0).style('left', 0);

const defs = svg.append('defs');

// Glow filter
const glow = defs.append('filter').attr('id', 'glow').attr('x', '-30%').attr('y', '-30%').attr('width', '160%').attr('height', '160%');
glow.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'blur');
const merge = glow.append('feMerge');
merge.append('feMergeNode').attr('in', 'blur');
merge.append('feMergeNode').attr('in', 'SourceGraphic');

// Arrow marker
function addArrow(id, color) {
  defs.append('marker').attr('id', id).attr('markerWidth', 10).attr('markerHeight', 7)
    .attr('refX', 9).attr('refY', 3.5).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 10 3.5, 0 7').attr('fill', color);
}
addArrow('arrow-blue', '#3B82F6');
addArrow('arrow-green', '#22C55E');
addArrow('arrow-yellow', '#F59E0B');
addArrow('arrow-purple', '#8B5CF6');
addArrow('arrow-white', '#c9d1d9');

// ── Layout constants ───────────────────────────────────────────────────────────
const CX = W / 2;
const CY = H / 2;

// Box positions (pipeline flows left→right across top, loop returns below)
const boxes = {
  encoder: { x: CX - 320, y: CY - 120, w: 130, h: 70, color: '#3B82F6', label: 'Encoder', sub: 'Q(z|x)' },
  prior:   { x: CX - 320, y: CY + 60,  w: 130, h: 70, color: '#8B5CF6', label: 'Prior',   sub: 'P(z) = N(0,I)' },
  kl:      { x: CX - 100, y: CY - 40,  w: 110, h: 60, color: '#EF4444', label: 'KL Loss',  sub: 'KL(Q||P)' },
  decoder: { x: CX + 80,  y: CY - 120, w: 130, h: 70, color: '#22C55E', label: 'Decoder',  sub: 'P(x|z)' },
  recon:   { x: CX + 80,  y: CY + 60,  w: 130, h: 70, color: '#F59E0B', label: 'Recon Loss', sub: 'E[log P(x|z)]' },
  elbo:    { x: CX + 280, y: CY - 40,  w: 120, h: 60, color: '#c9d1d9', label: 'ELBO',      sub: '= Recon − KL' },
};

// ── Helper: rounded rect ───────────────────────────────────────────────────────
function drawBox(g, b, opacity = 0) {
  const grp = g.append('g').attr('opacity', opacity);
  grp.append('rect')
    .attr('x', b.x).attr('y', b.y).attr('width', b.w).attr('height', b.h)
    .attr('rx', 10).attr('ry', 10)
    .attr('fill', b.color + '22')
    .attr('stroke', b.color).attr('stroke-width', 2)
    .attr('filter', 'url(#glow)');
  grp.append('text')
    .attr('x', b.x + b.w / 2).attr('y', b.y + 26)
    .attr('text-anchor', 'middle').attr('fill', b.color)
    .attr('font-size', 14).attr('font-weight', 700)
    .text(b.label);
  grp.append('text')
    .attr('x', b.x + b.w / 2).attr('y', b.y + 46)
    .attr('text-anchor', 'middle').attr('fill', '#c9d1d9')
    .attr('font-size', 11).attr('font-style', 'italic')
    .text(b.sub);
  return grp;
}

const boxGroups = {};
for (const [k, b] of Object.entries(boxes)) boxGroups[k] = drawBox(svg, b);

// ── Gaussian mini-plot inside Prior box ───────────────────────────────────────
const priorB = boxes.prior;
const gaussG = svg.append('g').attr('opacity', 0);
const gxScale = d3.scaleLinear().domain([-3, 3]).range([priorB.x + 8, priorB.x + priorB.w - 8]);
const gyScale = d3.scaleLinear().domain([0, 0.42]).range([priorB.y + priorB.h - 10, priorB.y + 55]);
const gaussData = d3.range(-3, 3.05, 0.1).map(x => ({ x, y: Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI) }));
const gaussLine = d3.line().x(d => gxScale(d.x)).y(d => gyScale(d.y)).curve(d3.curveCatmullRom);
gaussG.append('path').datum(gaussData).attr('d', gaussLine)
  .attr('fill', 'none').attr('stroke', '#8B5CF6').attr('stroke-width', 2);

// Sample dot on prior
const sampleDot = svg.append('circle').attr('cx', gxScale(0.3)).attr('cy', gyScale(0.38)).attr('r', 5)
  .attr('fill', '#F59E0B').attr('opacity', 0).attr('filter', 'url(#glow)');
const sampleLabel = svg.append('text').attr('x', gxScale(0.3) + 10).attr('y', gyScale(0.38) - 6)
  .attr('fill', '#F59E0B').attr('font-size', 11).attr('opacity', 0).text('z ~ P(z)');

// ── Connection arrows ──────────────────────────────────────────────────────────
function midX(b) { return b.x + b.w / 2; }
function midY(b) { return b.y + b.h / 2; }
function rightEdge(b) { return b.x + b.w; }
function leftEdge(b) { return b.x; }
function bottomEdge(b) { return b.y + b.h; }
function topEdge(b) { return b.y; }

const connections = [
  // x → encoder (input image to encoder)
  { id: 'enc-in', x1: boxes.encoder.x - 70, y1: midY(boxes.encoder), x2: leftEdge(boxes.encoder), y2: midY(boxes.encoder), color: '#3B82F6', marker: 'arrow-blue', label: 'x (input)', lx: -5, ly: -8 },
  // encoder → kl
  { id: 'enc-kl', x1: rightEdge(boxes.encoder), y1: midY(boxes.encoder), x2: leftEdge(boxes.kl), y2: midY(boxes.kl), color: '#EF4444', marker: 'arrow-blue', label: 'μ,σ', lx: 5, ly: -8 },
  // prior → kl
  { id: 'pri-kl', x1: midX(boxes.prior), y1: topEdge(boxes.prior), x2: midX(boxes.kl), y2: bottomEdge(boxes.kl), color: '#8B5CF6', marker: 'arrow-purple', label: '', lx: 0, ly: 0 },
  // encoder → decoder (z sampled)
  { id: 'enc-dec', x1: rightEdge(boxes.encoder), y1: boxes.encoder.y + 25, x2: leftEdge(boxes.decoder), y2: boxes.decoder.y + 25, color: '#22C55E', marker: 'arrow-green', label: 'z', lx: 5, ly: -8 },
  // decoder → recon
  { id: 'dec-rec', x1: midX(boxes.decoder), y1: bottomEdge(boxes.decoder), x2: midX(boxes.recon), y2: topEdge(boxes.recon), color: '#F59E0B', marker: 'arrow-yellow', label: 'x̂', lx: 6, ly: -4 },
  // kl → elbo
  { id: 'kl-elbo', x1: rightEdge(boxes.kl), y1: midY(boxes.kl), x2: leftEdge(boxes.elbo), y2: midY(boxes.elbo), color: '#c9d1d9', marker: 'arrow-white', label: '', lx: 0, ly: 0 },
  // recon → elbo
  { id: 'rec-elbo', x1: rightEdge(boxes.recon), y1: midY(boxes.recon), x2: leftEdge(boxes.elbo), y2: midY(boxes.elbo) + 15, color: '#c9d1d9', marker: 'arrow-white', label: '', lx: 0, ly: 0 },
];

const arrowLines = {};
for (const c of connections) {
  const g = svg.append('g').attr('opacity', 0);
  g.append('line')
    .attr('x1', c.x1).attr('y1', c.y1).attr('x2', c.x2).attr('y2', c.y2)
    .attr('stroke', c.color).attr('stroke-width', 2)
    .attr('marker-end', `url(#${c.marker})`);
  if (c.label) {
    g.append('text').attr('x', (c.x1 + c.x2) / 2 + c.lx).attr('y', (c.y1 + c.y2) / 2 + c.ly)
      .attr('fill', c.color).attr('font-size', 11).attr('text-anchor', 'middle').text(c.label);
  }
  arrowLines[c.id] = g;
}

// ── ELBO equation overlay (KaTeX) ─────────────────────────────────────────────
const elboDiv = document.createElement('div');
elboDiv.style.cssText = `position:absolute;bottom:${H * 0.12}px;left:50%;transform:translateX(-50%);
  background:#0d1117cc;border:1px solid #c9d1d933;border-radius:12px;padding:14px 28px;
  text-align:center;opacity:0;pointer-events:none;`;
const elboEqDiv = document.createElement('div');
elboEqDiv.style.cssText = 'font-size:18px;';
katex.render('\\mathcal{L} = \\mathbb{E}_{q}[\\log P(x|z)] - D_{KL}(Q(z|x)\\,\\|\\,P(z))', elboEqDiv, { throwOnError: false, displayMode: true });
const elboCaption = document.createElement('div');
elboCaption.style.cssText = 'color:#c9d1d9;font-size:13px;margin-top:8px;letter-spacing:0.04em;';
elboCaption.textContent = 'Every concept from this lesson lives inside this one equation.';
elboDiv.appendChild(elboEqDiv);
elboDiv.appendChild(elboCaption);
container.appendChild(elboDiv);

// ── Title overlay ─────────────────────────────────────────────────────────────
const titleDiv = document.createElement('div');
titleDiv.style.cssText = `position:absolute;top:${H * 0.05}px;left:50%;transform:translateX(-50%);
  color:#c9d1d9;font-size:22px;font-weight:700;letter-spacing:0.06em;opacity:0;white-space:nowrap;
  text-shadow:0 0 20px #3B82F666;`;
titleDiv.textContent = 'Variational Autoencoder — Unified Pipeline';
container.appendChild(titleDiv);

// ── Loop pulse path (circular arrow at bottom) ────────────────────────────────
const loopPath = svg.append('path')
  .attr('d', `M ${rightEdge(boxes.elbo)} ${midY(boxes.elbo)}
               C ${rightEdge(boxes.elbo)+60} ${midY(boxes.elbo)},
                 ${rightEdge(boxes.elbo)+60} ${CY+160},
                 ${CX} ${CY+160}
               C ${boxes.encoder.x-50} ${CY+160},
                 ${boxes.encoder.x-50} ${midY(boxes.encoder)},
                 ${boxes.encoder.x-70} ${midY(boxes.encoder)}`)
  .attr('fill', 'none').attr('stroke', '#3B82F6').attr('stroke-width', 2)
  .attr('stroke-dasharray', '8 6').attr('opacity', 0)
  .attr('marker-end', 'url(#arrow-blue)');

const loopLabel = svg.append('text')
  .attr('x', CX).attr('y', CY + 185)
  .attr('text-anchor', 'middle').attr('fill', '#3B82F6')
  .attr('font-size', 12).attr('opacity', 0)
  .text('encode → KL loss → decode → recon loss → update weights → repeat');

// ── Step highlight labels ─────────────────────────────────────────────────────
function makeStepBadge(text, x, y, color) {
  const g = svg.append('g').attr('opacity', 0);
  const bg = g.append('rect').attr('rx', 6).attr('ry', 6).attr('fill', color + '33').attr('stroke', color).attr('stroke-width', 1);
  const t = g.append('text').attr('x', x).attr('y', y).attr('fill', color).attr('font-size', 11).attr('font-weight', 600).text(text);
  // size dynamically
  const pad = 8;
  const tw = text.length * 6.5;
  bg.attr('x', x - pad).attr('y', y - 14).attr('width', tw + pad * 2).attr('height', 20);
  return g;
}

const badge1 = makeStepBadge('① Sample z ~ N(0,I)', gxScale(-2.8), priorB.y - 10, '#8B5CF6');
const badge2 = makeStepBadge('② Encode x → Q(z|x)', boxes.encoder.x, boxes.encoder.y - 10, '#3B82F6');
const badge3 = makeStepBadge('③ Decode z → x̂', boxes.decoder.x, boxes.decoder.y - 10, '#22C55E');
const badge4 = makeStepBadge('④ KL Divergence', boxes.kl.x, boxes.kl.y - 10, '#EF4444');
const badge5 = makeStepBadge('⑤ Recon Loss', boxes.recon.x, boxes.recon.y - 10, '#F59E0B');
const badge6 = makeStepBadge('⑥ ELBO = Recon − KL', boxes.elbo.x, boxes.elbo.y - 10, '#c9d1d9');

// ── Particle flow along enc→dec arrow ─────────────────────────────────────────
function spawnParticle(x1, y1, x2, y2, color, delay) {
  const p = svg.append('circle').attr('r', 4).attr('fill', color).attr('opacity', 0)
    .attr('cx', x1).attr('cy', y1).attr('filter', 'url(#glow)');
  tl.to(p.node(), { opacity: 1, duration: 0.2 }, delay)
    .to(p.node(), { attr: { cx: x2, cy: y2 }, duration: 1.2, ease: 'power1.inOut' }, delay + 0.1)
    .to(p.node(), { opacity: 0, duration: 0.3 }, delay + 1.1);
}

// ─────────────────────────────────────────────────────────────────────────────
// TIMELINE
// ─────────────────────────────────────────────────────────────────────────────

tl.addLabel('intro');

// Title fades in
tl.to(titleDiv, { opacity: 1, duration: 1.2, ease: 'power2.out' }, 'intro');

// ── STEP 1: Prior + Gaussian ───────────────────────────────────────────────────
tl.addLabel('step-prior', '+=1');
tl.to(boxGroups.prior.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' }, 'step-prior')
  .to(gaussG.node(), { opacity: 1, duration: 0.6 }, 'step-prior+=0.5')
  .to(sampleDot.node(), { opacity: 1, duration: 0.4 }, 'step-prior+=1')
  .to(sampleLabel.node(), { opacity: 1, duration: 0.4 }, 'step-prior+=1.2')
  .to(badge1.node(), { opacity: 1, duration: 0.5 }, 'step-prior+=1.3');

// Dart-throw bounce animation on sample dot
tl.fromTo(sampleDot.node(),
  { attr: { cx: gxScale(0), cy: gyScale(0.05) } },
  { attr: { cx: gxScale(0.3), cy: gyScale(0.38) }, duration: 0.8, ease: 'bounce.out' },
  'step-prior+=1.5');

// ── STEP 2: Encoder ────────────────────────────────────────────────────────────
tl.addLabel('step-encoder', '+=2');
tl.to(arrowLines['enc-in'].node(), { opacity: 1, duration: 0.6 }, 'step-encoder')
  .to(boxGroups.encoder.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' }, 'step-encoder+=0.4')
  .to(badge2.node(), { opacity: 1, duration: 0.5 }, 'step-encoder+=1');
// particles: input → encoder
for (let i = 0; i < 3; i++) spawnParticle(boxes.encoder.x - 70, midY(boxes.encoder), leftEdge(boxes.encoder), midY(boxes.encoder), '#3B82F6', tl.duration() + i * 0.4);
tl.to(arrowLines['enc-kl'].node(), { opacity: 1, duration: 0.6 }, 'step-encoder+=1.6');

// ── STEP 3: Decoder + z flow ───────────────────────────────────────────────────
tl.addLabel('step-decoder', '+=2');
tl.to(arrowLines['enc-dec'].node(), { opacity: 1, duration: 0.6 }, 'step-decoder')
  .to(boxGroups.decoder.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' }, 'step-decoder+=0.4')
  .to(badge3.node(), { opacity: 1, duration: 0.5 }, 'step-decoder+=1');
// particles: encoder → decoder
for (let i = 0; i < 3; i++) spawnParticle(rightEdge(boxes.encoder), boxes.encoder.y + 25, leftEdge(boxes.decoder), boxes.decoder.y + 25, '#22C55E', tl.duration() + i * 0.4);
tl.to(arrowLines['dec-rec'].node(), { opacity: 1, duration: 0.6 }, 'step-decoder+=1.8')
  .to(boxGroups.recon.node(), { opacity: 1, duration: 0.8 }, 'step-decoder+=2.2')
  .to(badge5.node(), { opacity: 1, duration: 0.5 }, 'step-decoder+=2.8');

// ── STEP 4: KL Divergence ──────────────────────────────────────────────────────
tl.addLabel('step-kl', '+=2');
tl.to(arrowLines['pri-kl'].node(), { opacity: 1, duration: 0.6 }, 'step-kl')
  .to(boxGroups.kl.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' }, 'step-kl+=0.4')
  .to(badge4.node(), { opacity: 1, duration: 0.5 }, 'step-kl+=1');

// KL pulse: make KL box throb red
tl.to(boxGroups.kl.select('rect').node(), { attr: { 'stroke-width': 4 }, duration: 0.4, yoyo: true, repeat: 3, ease: 'power1.inOut' }, 'step-kl+=1.5');

// ── STEP 5: ELBO assembled ─────────────────────────────────────────────────────
tl.addLabel('step-elbo', '+=2');
tl.to(arrowLines['kl-elbo'].node(), { opacity: 1, duration: 0.5 }, 'step-elbo')
  .to(arrowLines['rec-elbo'].node(), { opacity: 1, duration: 0.5 }, 'step-elbo+=0.2')
  .to(boxGroups.elbo.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' }, 'step-elbo+=0.5')
  .to(badge6.node(), { opacity: 1, duration: 0.5 }, 'step-elbo+=1.2');

// ELBO box glow pulse
tl.to(boxGroups.elbo.select('rect').node(), { attr: { 'stroke-width': 5 }, duration: 0.5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 'step-elbo+=1.5');

// ── STEP 6: ELBO equation reveal ──────────────────────────────────────────────
tl.addLabel('step-equation', '+=2');
tl.to(elboDiv, { opacity: 1, duration: 1, ease: 'power2.out', y: 0 }, 'step-equation');

// All boxes pulse together
const allBoxRects = Object.values(boxGroups).map(g => g.select('rect').node());
tl.to(allBoxRects, { attr: { 'stroke-width': 3 }, duration: 0.6, stagger: 0.12, yoyo: true, repeat: 1 }, 'step-equation+=1');

// ── STEP 7: Loop arrow ─────────────────────────────────────────────────────────
tl.addLabel('step-loop', '+=2');
tl.to(loopPath.node(), { opacity: 1, duration: 1 }, 'step-loop')
  .to(loopLabel.node(), { opacity: 1, duration: 0.8 }, 'step-loop+=0.8');

// Continuous loop particles along the main pipeline
function loopParticles(startTime) {
  const pts = [
    [boxes.encoder.x - 70, midY(boxes.encoder), leftEdge(boxes.encoder), midY(boxes.encoder), '#3B82F6'],
    [rightEdge(boxes.encoder), boxes.encoder.y + 25, leftEdge(boxes.decoder), boxes.decoder.y + 25, '#22C55E'],
    [midX(boxes.decoder), bottomEdge(boxes.decoder), midX(boxes.recon), topEdge(boxes.recon), '#F59E0B'],
    [rightEdge(boxes.kl), midY(boxes.kl), leftEdge(boxes.elbo), midY(boxes.elbo), '#c9d1d9'],
  ];
  for (let wave = 0; wave < 4; wave++) {
    pts.forEach(([x1, y1, x2, y2, c], i) => {
      spawnParticle(x1, y1, x2, y2, c, startTime + wave * 3 + i * 0.5);
    });
  }
}
loopParticles(tl.duration() + 0.5);

// Final all-bright flash
tl.addLabel('finale', '+=8');
tl.to(Object.values(boxGroups).map(g => g.node()), {
  filter: 'url(#glow)', opacity: 1, duration: 1.5, stagger: 0.1, ease: 'power2.inOut'
}, 'finale');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
