<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callback to frame 1's opening visual: pure noise on screen. </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.querySelector('#canvas-container');
container.style.position = 'relative';
container.style.overflow = 'hidden';
container.style.background = '#0d1117';

const W = container.offsetWidth || window.innerWidth;
const H = container.offsetHeight || window.innerHeight;

// ── Noise Canvas ──────────────────────────────────────────────────────────
const noiseCanvas = document.createElement('canvas');
noiseCanvas.width = W; noiseCanvas.height = H;
Object.assign(noiseCanvas.style, {
  position:'absolute', top:'0', left:'0', width:'100%', height:'100%', zIndex:'5'
});
container.appendChild(noiseCanvas);
const nCtx = noiseCanvas.getContext('2d');

let rafId = null;
function drawNoise() {
  const id = nCtx.createImageData(W, H);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  nCtx.putImageData(id, 0, 0);
}
function startNoise() { function loop(){drawNoise();rafId=requestAnimationFrame(loop);}loop(); }
function stopNoise() { if(rafId){cancelAnimationFrame(rafId);rafId=null;} }
startNoise();

// ── Image Layer ───────────────────────────────────────────────────────────
const imgWrapper = document.createElement('div');
Object.assign(imgWrapper.style, {
  position:'absolute', top:'0', left:'0', width:'100%', height:'100%',
  zIndex:'2', overflow:'hidden'
});
container.appendChild(imgWrapper);
gsap.set(imgWrapper, {opacity:0});

const faceImg = document.createElement('img');
faceImg.crossOrigin = 'anonymous';
faceImg.src = 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=800&q=80&fit=crop';
Object.assign(faceImg.style, {width:'100%', height:'100%', objectFit:'cover'});
imgWrapper.appendChild(faceImg);
gsap.set(faceImg, {filter:'blur(30px)'});

// ── Label Layer ───────────────────────────────────────────────────────────
const labelLayer = document.createElement('div');
Object.assign(labelLayer.style, {
  position:'absolute', top:'0', left:'0', width:'100%', height:'100%',
  zIndex:'8', pointerEvents:'none'
});
container.appendChild(labelLayer);

function mkLabel(text, xPct, yPct, isKatex, color, borderColor) {
  const el = document.createElement('div');
  Object.assign(el.style, {
    position:'absolute', left:xPct+'%', top:yPct+'%',
    transform:'translate(-50%,-50%)',
    color: color || '#c9d1d9',
    fontFamily:"'Inter','Helvetica Neue',sans-serif",
    fontSize:'clamp(14px,1.5vw,20px)', fontWeight:'500',
    background:'rgba(13,17,23,0.88)', padding:'10px 22px',
    borderRadius:'8px', border:'1px solid '+(borderColor||'rgba(255,255,255,0.2)'),
    whiteSpace:'nowrap', backdropFilter:'blur(8px)',
    boxShadow:'0 4px 20px rgba(0,0,0,0.6)'
  });
  if (isKatex) katex.render(text, el, {throwOnError:false});
  else el.textContent = text;
  labelLayer.appendChild(el);
  gsap.set(el, {opacity:0});
  return el;
}

const lbNoise = mkLabel('z \\sim \\mathcal{N}(0,\\,I)', 50, 8, true, '#EF4444', 'rgba(239,68,68,0.55)');
const lbCond  = mkLabel('Conditional Generation   P(x | z)', 50, 16, false, '#3B82F6', 'rgba(59,130,246,0.55)');
const lbKL    = mkLabel('Trained by minimizing KL + Reconstruction', 50, 25, false, '#F59E0B', 'rgba(245,158,11,0.55)');
const lbMC    = mkLabel('Each gradient step used Monte Carlo estimation', 50, 34, false, '#22C55E', 'rgba(34,197,94,0.55)');

// ── Film Strip ────────────────────────────────────────────────────────────
const filmStrip = document.createElement('div');
Object.assign(filmStrip.style, {
  position:'absolute', bottom:'80px', left:'50%',
  display:'flex', gap:'10px', zIndex:'12'
});
container.appendChild(filmStrip);
gsap.set(filmStrip, {xPercent:-50, opacity:0});

const PHOTO_IDS = [
  'photo-1507003211169-0a1dd7228f2d',
  'photo-1531746020798-e6953c6e8e04',
  'photo-1507003211169-0a1dd7228f2d',
  'photo-1531746020798-e6953c6e8e04',
  'photo-1507003211169-0a1dd7228f2d',
];

const frameEls = PHOTO_IDS.map(id => {
  const box = document.createElement('div');
  Object.assign(box.style, {
    width:'clamp(80px,10vw,130px)', height:'clamp(56px,7vw,90px)',
    borderRadius:'6px', overflow:'hidden',
    border:'2px solid rgba(59,130,246,0.65)', flexShrink:'0'
  });
  const img = document.createElement('img');
  img.crossOrigin = 'anonymous';
  img.src = `https://images.unsplash.com/${id}?w=300&q=80&fit=crop`;
  Object.assign(img.style, {width:'100%', height:'100%', objectFit:'cover'});
  box.appendChild(img);
  filmStrip.appendChild(box);
  gsap.set(box, {opacity:0, y:28});
  return box;
});

const lbVideo = document.createElement('div');
Object.assign(lbVideo.style, {
  position:'absolute', bottom:'190px', left:'50%',
  color:'#3B82F6', fontFamily:"'Inter',sans-serif",
  fontSize:'clamp(13px,1.4vw,18px)', fontWeight:'600',
  letterSpacing:'0.06em', background:'rgba(13,17,23,0.88)',
  padding:'7px 20px', borderRadius:'6px',
  border:'1px solid rgba(59,130,246,0.5)', whiteSpace:'nowrap', zIndex:'12'
});
lbVideo.textContent = '\u25b6  GENERATING VIDEO FRAMES...';
container.appendChild(lbVideo);
gsap.set(lbVideo, {xPercent:-50, opacity:0});

// ── Final Overlay ─────────────────────────────────────────────────────────
const finalOverlay = document.createElement('div');
Object.assign(finalOverlay.style, {
  position:'absolute', top:'0', left:'0', width:'100%', height:'100%',
  zIndex:'20', display:'flex', flexDirection:'column',
  alignItems:'center', justifyContent:'center',
  background:'rgba(13,17,23,0.80)', backdropFilter:'blur(14px)'
});
container.appendChild(finalOverlay);
gsap.set(finalOverlay, {opacity:0});

function mkText(text, size, color, extra) {
  const el = document.createElement('div');
  Object.assign(el.style, {
    fontFamily:"'Inter','Helvetica Neue',sans-serif",
    fontSize:size, fontWeight:'700', textAlign:'center',
    color:color||'#c9d1d9', lineHeight:'1.35', ...extra
  });
  el.textContent = text;
  finalOverlay.appendChild(el);
  return el;
}

const ftTitle    = mkText('From noise to video.', 'clamp(28px,4vw,54px)', '#c9d1d9', {marginBottom:'14px'});
const ftSub      = mkText('You now understand WHY this works.', 'clamp(18px,2.5vw,32px)', '#8B5CF6', {fontWeight:'500', marginBottom:'48px'});
const ftPersonal = mkText("Aswin\u2019s video generation model starts here.", 'clamp(15px,2vw,24px)', '#F59E0B', {
  padding:'16px 40px', border:'2px solid rgba(245,158,11,0.7)',
  borderRadius:'12px', letterSpacing:'0.03em'
});

gsap.set(ftTitle,    {opacity:0, y:30});
gsap.set(ftSub,      {opacity:0});
gsap.set(ftPersonal, {opacity:0, scale:0.82});

// ── GSAP Timeline ─────────────────────────────────────────────────────────

// Step 1: Pure Noise (~22s)
tl.addLabel("noise");
tl.to(lbNoise, {opacity:1, duration:1.5, ease:'power2.out'}, "noise+=1");
tl.to({}, {duration:20});

// Step 2: Emergence — noise dissolves into face (~15s)
tl.addLabel("emergence");
tl.to(imgWrapper, {opacity:1, duration:0.5}, "emergence");
tl.to(noiseCanvas, {
  opacity:0, duration:15, ease:'power2.inOut',
  onComplete: stopNoise
}, "emergence");
tl.to(faceImg, {filter:'blur(0px)', duration:15, ease:'power2.inOut'}, "emergence");
tl.to(lbCond, {opacity:1, duration:1.2, ease:'power2.out'}, "emergence+=2.5");
tl.to(lbKL,   {opacity:1, duration:1.2, ease:'power2.out'}, "emergence+=7");
tl.to(lbMC,   {opacity:1, duration:1.2, ease:'power2.out'}, "emergence+=12");

// Step 3: Face Fully Forms — labels linger, then clear (~16s)
tl.addLabel("face-forms");
tl.to({}, {duration:10});
tl.to(imgWrapper, {scale:1.07, transformOrigin:'center center', duration:4, ease:'power2.inOut'}, "face-forms+=1");
tl.to([lbNoise, lbCond, lbKL, lbMC], {opacity:0, duration:2, ease:'power2.in'}, "face-forms+=8");

// Step 4: Video Sequence — frames appear (~17s)
tl.addLabel("video-sequence");
tl.to(imgWrapper, {scale:1.0, duration:2, ease:'power2.inOut'}, "video-sequence");
tl.to(lbVideo,    {opacity:1, duration:0.8, ease:'power2.out'}, "video-sequence+=0.5");
tl.to(filmStrip,  {opacity:1, duration:0.8, ease:'power2.out'}, "video-sequence+=0.8");
frameEls.forEach((f, i) => {
  tl.to(f, {opacity:1, y:0, duration:0.6, ease:'back.out(1.7)'}, `video-sequence+=${1.2 + i * 0.3}`);
});
tl.to({}, {duration:12}, "video-sequence+=5");

// Step 5: Finale (~22s)
tl.addLabel("finale");
tl.to(finalOverlay, {opacity:1, duration:2.5, ease:'power2.inOut'}, "finale");
tl.to(ftTitle,    {opacity:1, y:0, duration:1.5, ease:'power2.out'}, "finale+=1");
tl.to(ftSub,      {opacity:1, duration:1.5, ease:'power2.out'}, "finale+=2.5");
tl.to(ftPersonal, {opacity:1, scale:1, duration:1.8, ease:'back.out(1.5)'}, "finale+=4");
tl.to({}, {duration:18});

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
