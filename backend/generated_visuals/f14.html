<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Left: the formula E[f(x)] = integral of f(x)·p(x) dx with a </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.cssText = 'width:100vw;height:100vh;background:#0d1117;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;';

// Title
const title = document.createElement('div');
title.style.cssText = 'color:#c9d1d9;font-family:sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;margin-bottom:18px;opacity:0;position:relative;z-index:10;';
title.textContent = 'Monte Carlo Estimation';
container.appendChild(title);

// Main row
const row = document.createElement('div');
row.style.cssText = 'display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:28px;width:98vw;';
container.appendChild(row);

// LEFT panel: Exact integral
const leftPanel = document.createElement('div');
leftPanel.style.cssText = 'display:flex;flex-direction:column;align-items:center;background:#161b22;border-radius:12px;padding:18px 20px;min-width:260px;max-width:300px;position:relative;opacity:0;';
row.appendChild(leftPanel);

const leftTitle = document.createElement('div');
leftTitle.style.cssText = 'color:#EF4444;font-family:sans-serif;font-size:14px;font-weight:600;margin-bottom:10px;';
leftTitle.textContent = 'Exact Integral';
leftPanel.appendChild(leftTitle);

const exactEqEl = document.createElement('div');
exactEqEl.style.cssText = 'margin-bottom:12px;';
leftPanel.appendChild(exactEqEl);
katex.render('\\mathbb{E}[f(x)] = \\int f(x)\\,p(x)\\,dx', exactEqEl, {throwOnError:false, displayMode:true});

const hardStamp = document.createElement('div');
hardStamp.style.cssText = 'color:#EF4444;font-family:sans-serif;font-size:28px;font-weight:900;border:4px solid #EF4444;padding:4px 16px;border-radius:6px;letter-spacing:3px;transform:rotate(-12deg);opacity:0;margin-top:6px;';
hardStamp.textContent = 'HARD';
leftPanel.appendChild(hardStamp);

const intractText = document.createElement('div');
intractText.style.cssText = 'color:#888;font-family:sans-serif;font-size:12px;margin-top:10px;text-align:center;line-height:1.5;';
intractText.textContent = 'Intractable for complex distributions';
leftPanel.appendChild(intractText);

// Shimmering integral SVG
const shimSVG = document.createElementNS('http://www.w3.org/2000/svg','svg');
shimSVG.setAttribute('width','120');shimSVG.setAttribute('height','60');
shimSVG.style.cssText = 'margin-top:10px;opacity:0;';
leftPanel.appendChild(shimSVG);
const shimPath = document.createElementNS('http://www.w3.org/2000/svg','text');
shimPath.setAttribute('x','10');shimPath.setAttribute('y','50');
shimPath.setAttribute('font-size','56');shimPath.setAttribute('fill','#EF4444');
shimPath.setAttribute('font-family','serif');shimPath.textContent='∫';
shimSVG.appendChild(shimPath);

// RIGHT panel: Monte Carlo
const rightPanel = document.createElement('div');
rightPanel.style.cssText = 'display:flex;flex-direction:column;align-items:center;background:#161b22;border-radius:12px;padding:18px 20px;min-width:260px;max-width:300px;position:relative;opacity:0;';
row.appendChild(rightPanel);

const rightTitle = document.createElement('div');
rightTitle.style.cssText = 'color:#22C55E;font-family:sans-serif;font-size:14px;font-weight:600;margin-bottom:10px;';
rightTitle.textContent = 'Monte Carlo Approximation';
rightPanel.appendChild(rightTitle);

const mcEqEl = document.createElement('div');
mcEqEl.style.cssText = 'margin-bottom:12px;';
rightPanel.appendChild(mcEqEl);
katex.render('\\mathbb{E}[f(x)] \\approx \\frac{1}{N}\\sum_{i=1}^{N} f(x_i)', mcEqEl, {throwOnError:false, displayMode:true});

const subEq = document.createElement('div');
subEq.style.cssText = 'margin-bottom:8px;';
rightPanel.appendChild(subEq);
katex.render('x_i \\sim p(x)', subEq, {throwOnError:false, displayMode:false});

const easyStamp = document.createElement('div');
easyStamp.style.cssText = 'color:#22C55E;font-family:sans-serif;font-size:28px;font-weight:900;border:4px solid #22C55E;padding:4px 16px;border-radius:6px;letter-spacing:3px;transform:rotate(-12deg);opacity:0;margin-top:6px;';
easyStamp.textContent = 'EASY';
rightPanel.appendChild(easyStamp);

// CENTER: Main demo SVG
const centerPanel = document.createElement('div');
centerPanel.style.cssText = 'display:flex;flex-direction:column;align-items:center;background:#161b22;border-radius:12px;padding:14px 10px;flex:1;min-width:320px;max-width:400px;opacity:0;';
row.appendChild(centerPanel);

const demoTitle = document.createElement('div');
demoTitle.style.cssText = 'color:#c9d1d9;font-family:sans-serif;font-size:13px;font-weight:600;margin-bottom:8px;';
demoTitle.textContent = 'Sampling Demo';
centerPanel.appendChild(demoTitle);

const W = 360, H = 200;
const demoSVG = d3.select(centerPanel).append('svg')
  .attr('width', W).attr('height', H)
  .style('overflow','visible');

const margin = {top:10, right:15, bottom:30, left:35};
const iW = W - margin.left - margin.right;
const iH = H - margin.top - margin.bottom;
const g = demoSVG.append('g').attr('transform',`translate(${margin.left},${margin.top})`);

const xScale = d3.scaleLinear().domain([-4,4]).range([0,iW]);
const yScale = d3.scaleLinear().domain([0,0.55]).range([iH,0]);

// Axes
g.append('g').attr('transform',`translate(0,${iH})`).call(d3.axisBottom(xScale).ticks(5))
  .selectAll('text,line,path').attr('stroke','#444').attr('fill','#888');
g.append('g').call(d3.axisLeft(yScale).ticks(4))
  .selectAll('text,line,path').attr('stroke','#444').attr('fill','#888');

// p(x): Gaussian mixture
function pdfMix(x) {
  const g1 = Math.exp(-0.5*((x-(-1))/0.8)**2)/(0.8*Math.sqrt(2*Math.PI));
  const g2 = Math.exp(-0.5*((x-1.5)/1.0)**2)/(1.0*Math.sqrt(2*Math.PI));
  return 0.5*g1 + 0.5*g2;
}
// f(x): wavy function
function fx(x) { return 0.32 + 0.15*Math.sin(1.8*x) + 0.08*Math.cos(3.5*x); }
// true E[f(x)] via numerical integration
function trapz(fn, a, b, n=500) {
  const dx = (b-a)/n; let s=0;
  for(let i=0;i<=n;i++){const xi=a+i*dx; s+=(i===0||i===n?0.5:1)*fn(xi)*dx;}
  return s;
}
const trueVal = trapz(x => fx(x)*pdfMix(x), -4, 4, 1000);

const xs = d3.range(-4,4.01,0.04);

// Draw p(x) filled area
const pLine = d3.line().x(d=>xScale(d)).y(d=>yScale(pdfMix(d))).curve(d3.curveBasis);
const pArea = d3.area().x(d=>xScale(d)).y0(iH).y1(d=>yScale(pdfMix(d))).curve(d3.curveBasis);
g.append('path').datum(xs).attr('d',pArea(xs))
  .attr('fill','#3B82F6').attr('fill-opacity',0.18).attr('class','pdf-area');
g.append('path').datum(xs).attr('d',pLine(xs))
  .attr('stroke','#3B82F6').attr('stroke-width',2).attr('fill','none').attr('class','pdf-line');

// Draw f(x) wavy
const fLine = d3.line().x(d=>xScale(d)).y(d=>yScale(fx(d))).curve(d3.curveBasis);
const fPath = g.append('path').datum(xs).attr('d',fLine(xs))
  .attr('stroke','#F59E0B').attr('stroke-width',2.5).attr('fill','none')
  .attr('stroke-dasharray','6,4').attr('opacity',0);

// Labels
g.append('text').attr('x',xScale(-3.5)).attr('y',yScale(0.48))
  .attr('fill','#3B82F6').attr('font-size',12).attr('font-family','sans-serif').text('p(x)');
const fLabel = g.append('text').attr('x',xScale(2.5)).attr('y',yScale(0.44))
  .attr('fill','#F59E0B').attr('font-size',12).attr('font-family','sans-serif').attr('opacity',0).text('f(x)');

// True value line
const trueLine = g.append('line')
  .attr('x1',xScale(-4)).attr('y1',yScale(trueVal))
  .attr('x2',xScale(4)).attr('y2',yScale(trueVal))
  .attr('stroke','#22C55E').attr('stroke-width',1.5).attr('stroke-dasharray','8,4').attr('opacity',0);
const trueLabel = g.append('text').attr('x',xScale(2.2)).attr('y',yScale(trueVal)-6)
  .attr('fill','#22C55E').attr('font-size',11).attr('font-family','sans-serif').attr('opacity',0)
  .text('True E[f(x)]');

// Sample dots group
const dotsGroup = g.append('g');
// Error bar group
const errorGroup = g.append('g');

// N label
const nLabelDiv = document.createElement('div');
nLabelDiv.style.cssText = 'color:#c9d1d9;font-family:sans-serif;font-size:13px;margin-top:6px;opacity:0;';
centerPanel.appendChild(nLabelDiv);

// Estimate display
const estDiv = document.createElement('div');
estDiv.style.cssText = 'color:#F59E0B;font-family:monospace;font-size:13px;margin-top:2px;opacity:0;';
centerPanel.appendChild(estDiv);

// BOTTOM: Convergence graph
const convPanel = document.createElement('div');
convPanel.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:98vw;margin-top:16px;background:#161b22;border-radius:12px;padding:12px 10px;opacity:0;';
container.appendChild(convPanel);

const convTitle = document.createElement('div');
convTitle.style.cssText = 'color:#c9d1d9;font-family:sans-serif;font-size:13px;font-weight:600;margin-bottom:6px;';
convTitle.textContent = 'Convergence: Estimate vs N  —  1/√N rate';
convPanel.appendChild(convTitle);

const CW = 560, CH = 110;
const convSVG = d3.select(convPanel).append('svg').attr('width',CW).attr('height',CH).style('overflow','visible');
const cm = {top:8, right:20, bottom:28, left:50};
const cg = convSVG.append('g').attr('transform',`translate(${cm.left},${cm.top})`);
const ciW = CW-cm.left-cm.right, ciH = CH-cm.top-cm.bottom;
const Ns = [5,10,20,50,100,200,500];
const nScale = d3.scaleLog().domain([4,600]).range([0,ciW]);
const estScale = d3.scaleLinear().domain([trueVal-0.12,trueVal+0.12]).range([ciH,0]);

cg.append('g').attr('transform',`translate(0,${ciH})`).call(d3.axisBottom(nScale).ticks(5,'~s'))
  .selectAll('text,line,path').attr('stroke','#444').attr('fill','#888');
cg.append('g').call(d3.axisLeft(estScale).ticks(4).tickFormat(d3.format('.2f')))
  .selectAll('text,line,path').attr('stroke','#444').attr('fill','#888');

// True val horizontal
cg.append('line').attr('x1',0).attr('y1',estScale(trueVal)).attr('x2',ciW).attr('y2',estScale(trueVal))
  .attr('stroke','#22C55E').attr('stroke-width',1.5).attr('stroke-dasharray','8,4');
cg.append('text').attr('x',ciW-44).attr('y',estScale(trueVal)-5)
  .attr('fill','#22C55E').attr('font-size',10).attr('font-family','sans-serif').text('True value');

cg.append('text').attr('x',-36).attr('y',ciH/2)
  .attr('fill','#888').attr('font-size',10).attr('font-family','sans-serif')
  .attr('transform',`rotate(-90,-36,${ciH/2})`).text('Estimate');
cg.append('text').attr('x',ciW/2-8).attr('y',ciH+24)
  .attr('fill','#888').attr('font-size',10).attr('font-family','sans-serif').text('N (samples)');

const convDotsGroup = cg.append('g');
const convLineGroup = cg.append('g');

// Helper: sample from mixture using rejection
function sampleMix() {
  while(true) {
    const x = (Math.random()-0.5)*8;
    const u = Math.random()*0.5;
    if(u < pdfMix(x)) return x;
  }
}

function drawSamples(N) {
  const samples = Array.from({length:N}, sampleMix);
  const est = d3.mean(samples, xi => fx(xi));
  dotsGroup.selectAll('*').remove();
  errorGroup.selectAll('*').remove();
  const std = Math.sqrt(d3.variance(samples, xi => fx(xi))/N);
  // dots
  const show = Math.min(N, 30);
  samples.slice(0,show).forEach(xi => {
    dotsGroup.append('circle')
      .attr('cx', xScale(xi)).attr('cy', yScale(fx(xi)))
      .attr('r', 4).attr('fill','#EF4444').attr('opacity',0.85)
      .attr('stroke','#fff').attr('stroke-width',0.5);
    // vertical tick on x axis
    dotsGroup.append('line')
      .attr('x1',xScale(xi)).attr('y1',iH-6)
      .attr('x2',xScale(xi)).attr('y2',iH+2)
      .attr('stroke','#EF4444').attr('stroke-width',1.5).attr('opacity',0.6);
  });
  // error bar on true line
  const ex = xScale(3.2);
  const ey = yScale(est);
  const ebar = yScale(est-std)-yScale(est+std);
  errorGroup.append('line').attr('x1',ex).attr('y1',yScale(est-std)).attr('x2',ex).attr('y2',yScale(est+std))
    .attr('stroke','#EF4444').attr('stroke-width',3).attr('opacity',0.8);
  errorGroup.append('line').attr('x1',ex-8).attr('y1',yScale(est-std)).attr('x2',ex+8).attr('y2',yScale(est-std))
    .attr('stroke','#EF4444').attr('stroke-width',2);
  errorGroup.append('line').attr('x1',ex-8).attr('y1',yScale(est+std)).attr('x2',ex+8).attr('y2',yScale(est+std))
    .attr('stroke','#EF4444').attr('stroke-width',2);
  errorGroup.append('circle').attr('cx',ex).attr('cy',yScale(est)).attr('r',4).attr('fill','#F59E0B');
  return {est, std};
}

function updateConvGraph(upToIdx, estimatesArr) {
  convDotsGroup.selectAll('*').remove();
  convLineGroup.selectAll('*').remove();
  if(estimatesArr.length < 2) return;
  const pts = estimatesArr.slice(0, upToIdx+1);
  convLineGroup.append('path')
    .datum(pts)
    .attr('d', d3.line().x(d=>nScale(d.N)).y(d=>estScale(d.est)).curve(d3.curveMonotoneX))
    .attr('stroke','#8B5CF6').attr('stroke-width',2).attr('fill','none');
  pts.forEach(d => {
    convDotsGroup.append('circle')
      .attr('cx',nScale(d.N)).attr('cy',estScale(d.est))
      .attr('r',5).attr('fill','#8B5CF6').attr('stroke','#fff').attr('stroke-width',1);
    // error bar
    const ebar_h = estScale(d.est-d.std)-estScale(d.est+d.std);
    convDotsGroup.append('line')
      .attr('x1',nScale(d.N)).attr('y1',estScale(d.est-d.std))
      .attr('x2',nScale(d.N)).attr('y2',estScale(d.est+d.std))
      .attr('stroke','#EF4444').attr('stroke-width',2).attr('opacity',0.7);
  });
}

// Pre-compute convergence estimates
const convEstimates = Ns.map(N => {
  const samples = Array.from({length:N}, sampleMix);
  const est = d3.mean(samples, xi => fx(xi));
  const std = Math.sqrt(d3.variance(samples, xi => fx(xi))/N);
  return {N, est, std};
});

// ===================== GSAP TIMELINE =====================

tl.addLabel('intro');

// Fade in title
tl.to(title, {opacity:1, duration:1, ease:'power2.inOut'}, 'intro');

// Fade in left + right panels
tl.to(leftPanel, {opacity:1, duration:1, ease:'power2.inOut'}, 'intro+=0.5');
tl.to(rightPanel, {opacity:1, duration:1, ease:'power2.inOut'}, 'intro+=0.8');

// Stamp animations
tl.to(hardStamp, {opacity:1, scale:1.2, duration:0.5, ease:'back.out(2)'}, 'intro+=1.8');
tl.to(hardStamp, {scale:1, duration:0.2}, 'intro+=2.3');
tl.to(easyStamp, {opacity:1, scale:1.2, duration:0.5, ease:'back.out(2)'}, 'intro+=2.6');
tl.to(easyStamp, {scale:1, duration:0.2}, 'intro+=3.1');

// Shimmering integral
tl.to(shimSVG, {opacity:1, duration:0.5}, 'intro+=1.8');
tl.to(shimPath, {attr:{fill:'#ff6666'}, duration:0.4, repeat:5, yoyo:true}, 'intro+=2.0');

// Show center panel
tl.addLabel('sampling');
tl.to(centerPanel, {opacity:1, duration:1, ease:'power2.inOut'}, 'sampling');

// Show f(x) line
tl.to(fPath.node(), {opacity:1, duration:1.2, ease:'power2.inOut'}, 'sampling+=0.5');
tl.to(fLabel.node(), {opacity:1, duration:0.8}, 'sampling+=0.8');
// Show true value line
tl.to(trueLine.node(), {opacity:1, duration:1}, 'sampling+=1.5');
tl.to(trueLabel.node(), {opacity:1, duration:0.8}, 'sampling+=2.0');

// Show n label + est div
tl.to(nLabelDiv, {opacity:1, duration:0.5}, 'sampling+=2.5');
tl.to(estDiv, {opacity:1, duration:0.5}, 'sampling+=2.5');

// N=5
tl.addLabel('n5');
tl.add(() => {
  const {est,std} = drawSamples(5);
  nLabelDiv.textContent = 'N = 5 samples';
  estDiv.textContent = `Estimate: ${est.toFixed(4)}  ±${std.toFixed(4)}  (True: ${trueVal.toFixed(4)})`;
  updateConvGraph(0, convEstimates);
}, 'n5');

// N=50
tl.addLabel('n50');
tl.add(() => {
  const {est,std} = drawSamples(50);
  nLabelDiv.textContent = 'N = 50 samples';
  estDiv.textContent = `Estimate: ${est.toFixed(4)}  ±${std.toFixed(4)}  (True: ${trueVal.toFixed(4)})`;
  updateConvGraph(3, convEstimates);
}, 'n50+=35');

// N=500
tl.addLabel('n500');
tl.add(() => {
  const {est,std} = drawSamples(500);
  nLabelDiv.textContent = 'N = 500 samples';
  estDiv.textContent = `Estimate: ${est.toFixed(4)}  ±${std.toFixed(4)}  (True: ${trueVal.toFixed(4)})`;
  updateConvGraph(6, convEstimates);
}, 'n500+=70');

// Show convergence panel
tl.addLabel('convergence');
tl.to(convPanel.node ? convPanel.node() : convPanel, {opacity:1, duration:1, ease:'power2.inOut'}, 'convergence+=105');

// Animate convergence dots one by one
convEstimates.forEach((d, i) => {
  tl.add(() => { updateConvGraph(i, convEstimates); }, `convergence+=${108 + i*3}`);
});

// 1/sqrt(N) annotation
const sqrtLabel = document.createElement('div');
sqrtLabel.style.cssText = 'color:#F59E0B;font-family:sans-serif;font-size:13px;margin-top:6px;opacity:0;font-weight:700;letter-spacing:0.5px;';
convPanel.appendChild(sqrtLabel);
katex.render('\\text{Convergence rate: } \\frac{1}{\\sqrt{N}}', sqrtLabel, {throwOnError:false});
tl.to(sqrtLabel, {opacity:1, duration:1, ease:'power2.inOut'}, 'convergence+=130');

// Final highlight
tl.addLabel('result');
tl.to([leftPanel, rightPanel], {boxShadow:'0 0 0 2px #EF4444', duration:0.5}, 'result+=135');
tl.to(rightPanel, {boxShadow:'0 0 16px 4px #22C55E', duration:0.8, ease:'power2.inOut'}, 'result+=136');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
