<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Left panel: a directed graphical model. A node labeled 'z (l</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.cssText = `
  display: flex; width: 100vw; height: 100vh;
  background: #0d1117; overflow: hidden;
  font-family: Inter, system-ui, sans-serif;
`;

const leftPanel = document.createElement('div');
leftPanel.style.cssText = `
  width: 50%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 30px 20px; border-right: 1px solid #30363d;
  box-sizing: border-box; overflow: hidden;
`;
gsap.set(leftPanel, { opacity: 0 });

const rightPanel = document.createElement('div');
rightPanel.style.cssText = `
  width: 50%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 30px 24px; box-sizing: border-box; overflow-y: auto;
`;
gsap.set(rightPanel, { opacity: 0 });

container.appendChild(leftPanel);
container.appendChild(rightPanel);

// ---- LEFT: Title ----
const leftTitle = document.createElement('div');
leftTitle.textContent = 'Directed Graphical Model';
leftTitle.style.cssText = `
  color: #c9d1d9; font-size: 17px; font-weight: 600;
  margin-bottom: 20px; text-align: center;
`;
gsap.set(leftTitle, { opacity: 0, y: -10 });
leftPanel.appendChild(leftTitle);

// ---- LEFT: SVG graphical model ----
const svgNS = 'http://www.w3.org/2000/svg';
const svgEl = document.createElementNS(svgNS, 'svg');
svgEl.setAttribute('viewBox', '0 0 420 360');
svgEl.setAttribute('width', '100%');
svgEl.setAttribute('height', '68%');
svgEl.style.overflow = 'visible';
leftPanel.appendChild(svgEl);

const svg = d3.select(svgEl);

const defs = svg.append('defs');
[['arrow-blue', '#3B82F6'], ['arrow-red', '#EF4444']].forEach(([id, color]) => {
  defs.append('marker')
    .attr('id', id).attr('markerWidth', 10).attr('markerHeight', 7)
    .attr('refX', 9).attr('refY', 3.5).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 10 3.5, 0 7').attr('fill', color);
});

const zCx = 210, zCy = 85, R = 42;
const xCx = 210, xCy = 270;
const midY = (zCy + xCy) / 2;

// Forward arrow (z->x), offset right
const fwdLine = svg.append('line')
  .attr('x1', zCx + 18).attr('y1', zCy + R + 4)
  .attr('x2', xCx + 18).attr('y2', xCy - R - 4)
  .attr('stroke', '#3B82F6').attr('stroke-width', 2.5)
  .attr('marker-end', 'url(#arrow-blue)');
gsap.set(fwdLine.node(), { opacity: 0 });

const fwdLblG = svg.append('g');
fwdLblG.append('text').attr('x', xCx + 32).attr('y', midY - 10)
  .attr('fill', '#3B82F6').attr('font-size', '11').attr('font-family', 'Inter, sans-serif')
  .text('P(x|z) — Decoder/Likelihood');
fwdLblG.append('text').attr('x', xCx + 32).attr('y', midY + 6)
  .attr('fill', '#64748b').attr('font-size', '10').attr('font-family', 'Inter, sans-serif')
  .text('easy to compute');
gsap.set(fwdLblG.node(), { opacity: 0 });

// Reverse dashed arrow (x->z), offset left
const revLine = svg.append('line')
  .attr('x1', xCx - 18).attr('y1', xCy - R - 4)
  .attr('x2', zCx - 18).attr('y2', zCy + R + 4)
  .attr('stroke', '#EF4444').attr('stroke-width', 2)
  .attr('stroke-dasharray', '7,4')
  .attr('marker-end', 'url(#arrow-red)');
gsap.set(revLine.node(), { opacity: 0 });

const revLblG = svg.append('g');
revLblG.append('text').attr('x', zCx - 32).attr('y', midY - 10)
  .attr('fill', '#EF4444').attr('font-size', '11').attr('font-family', 'Inter, sans-serif')
  .attr('text-anchor', 'end').text('P(z|x) — Posterior');
revLblG.append('text').attr('x', zCx - 32).attr('y', midY + 6)
  .attr('fill', '#ef444488').attr('font-size', '10').attr('font-family', 'Inter, sans-serif')
  .attr('text-anchor', 'end').text('hard! Need Bayes');
gsap.set(revLblG.node(), { opacity: 0 });

// Node z (purple)
const zG = svg.append('g');
zG.append('circle').attr('cx', zCx).attr('cy', zCy).attr('r', R)
  .attr('fill', '#13111f').attr('stroke', '#8B5CF6').attr('stroke-width', 2.5);
zG.append('text').attr('x', zCx).attr('y', zCy - 4)
  .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
  .attr('fill', '#8B5CF6').attr('font-size', '20').attr('font-weight', '700')
  .attr('font-family', 'Georgia, serif').text('z');
zG.append('text').attr('x', zCx).attr('y', zCy + 17)
  .attr('text-anchor', 'middle').attr('fill', '#8B5CF6aa').attr('font-size', '9')
  .attr('font-family', 'Inter, sans-serif').text('latent code');
gsap.set(zG.node(), { opacity: 0 });

// Node x (green)
const xG = svg.append('g');
xG.append('circle').attr('cx', xCx).attr('cy', xCy).attr('r', R)
  .attr('fill', '#0f1f14').attr('stroke', '#22C55E').attr('stroke-width', 2.5);
xG.append('text').attr('x', xCx).attr('y', xCy - 4)
  .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
  .attr('fill', '#22C55E').attr('font-size', '20').attr('font-weight', '700')
  .attr('font-family', 'Georgia, serif').text('x');
xG.append('text').attr('x', xCx).attr('y', xCy + 17)
  .attr('text-anchor', 'middle').attr('fill', '#22C55Eaa').attr('font-size', '9')
  .attr('font-family', 'Inter, sans-serif').text('video frame');
gsap.set(xG.node(), { opacity: 0 });

// ---- RIGHT: Title ----
const rightTitle = document.createElement('div');
rightTitle.textContent = "Bayes' Theorem";
rightTitle.style.cssText = `
  color: #c9d1d9; font-size: 17px; font-weight: 600;
  margin-bottom: 16px; text-align: center;
`;
gsap.set(rightTitle, { opacity: 0, y: -10 });
rightPanel.appendChild(rightTitle);

// Main equation box
const mainEqBox = document.createElement('div');
mainEqBox.style.cssText = `
  background: #161b22; border: 1px solid #30363d;
  border-radius: 12px; padding: 16px 24px; margin-bottom: 14px;
  width: 100%; box-sizing: border-box; text-align: center;
`;
const smallLbl = document.createElement('div');
smallLbl.textContent = "Posterior via Bayes' Rule";
smallLbl.style.cssText = 'color: #8b949e; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;';
const katexDiv = document.createElement('div');
katex.render('P(z|x) = \\dfrac{P(x|z) \\cdot P(z)}{P(x)}', katexDiv, { throwOnError: false, displayMode: true });
mainEqBox.appendChild(smallLbl);
mainEqBox.appendChild(katexDiv);
gsap.set(mainEqBox, { opacity: 0, y: 18 });
rightPanel.appendChild(mainEqBox);

// Term annotations
const termDefs = [
  { latex: 'P(z|x)', label: 'what latent code explains this frame?', color: '#EF4444' },
  { latex: 'P(x|z)', label: 'decoder generates frame from code', color: '#3B82F6' },
  { latex: 'P(z)', label: 'Gaussian prior over latent space', color: '#8B5CF6' },
  { latex: 'P(x)', label: 'intractable! sum over ALL possible z', color: '#EF4444', intractable: true },
];

const termRowEls = [];
let warnEl = null;

termDefs.forEach((t) => {
  const row = document.createElement('div');
  row.style.cssText = `
    display: flex; align-items: center; gap: 10px;
    background: #161b22; border: 1px solid ${t.color}33;
    border-left: 3px solid ${t.color}; border-radius: 8px;
    padding: 9px 12px; margin-bottom: 6px;
    width: 100%; box-sizing: border-box;
  `;
  gsap.set(row, { opacity: 0, x: 20 });

  const eqEl = document.createElement('span');
  eqEl.style.cssText = 'min-width: 52px; text-align: center; flex-shrink: 0;';
  katex.render(t.latex, eqEl, { throwOnError: false });

  const lbl = document.createElement('span');
  lbl.textContent = t.label;
  lbl.style.cssText = `color: ${t.color}; font-size: 12px; line-height: 1.4;`;

  row.appendChild(eqEl);
  row.appendChild(lbl);
  rightPanel.appendChild(row);
  termRowEls.push(row);

  if (t.intractable) {
    warnEl = document.createElement('div');
    warnEl.style.cssText = `
      display: flex; align-items: flex-start; gap: 8px;
      background: #1a0a0a; border: 1px solid #EF4444;
      border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
      width: 100%; box-sizing: border-box;
    `;
    gsap.set(warnEl, { opacity: 0, y: 8 });

    const icon = document.createElement('span');
    icon.textContent = '\u26A0';
    icon.style.cssText = 'color: #EF4444; font-size: 16px; flex-shrink: 0; margin-top: 1px;';

    const msg = document.createElement('span');
    msg.textContent = 'This is why we need approximations \u2192 VAE, diffusion models.';
    msg.style.cssText = 'color: #EF4444; font-size: 12px; line-height: 1.5;';

    warnEl.appendChild(icon);
    warnEl.appendChild(msg);
    rightPanel.appendChild(warnEl);
  }
});

// ---- TIMELINE ----

tl.addLabel('intro');

tl.to(leftPanel, { opacity: 1, duration: 0.7, ease: 'power2.out' }, 'intro')
  .to(rightPanel, { opacity: 1, duration: 0.7, ease: 'power2.out' }, 'intro+=0.2');

tl.addLabel('graph-model', 'intro+=1');

tl.to(leftTitle, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 'graph-model')
  .to(zG.node(), { opacity: 1, duration: 0.5, ease: 'power2.out' }, 'graph-model+=0.4')
  .to(fwdLine.node(), { opacity: 1, duration: 0.5, ease: 'power2.out' }, 'graph-model+=1.0')
  .to(fwdLblG.node(), { opacity: 1, duration: 0.4 }, 'graph-model+=1.3')
  .to(xG.node(), { opacity: 1, duration: 0.5, ease: 'power2.out' }, 'graph-model+=1.9')
  .to(revLine.node(), { opacity: 1, duration: 0.6, ease: 'power2.out' }, 'graph-model+=2.6')
  .to(revLblG.node(), { opacity: 1, duration: 0.4 }, 'graph-model+=3.0');

tl.addLabel('bayes-theorem', 'graph-model+=4.5');

tl.to(rightTitle, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 'bayes-theorem')
  .to(mainEqBox, { opacity: 1, y: 0, duration: 0.7, ease: 'back.out(1.4)' }, 'bayes-theorem+=0.5');

termRowEls.forEach((row, i) => {
  tl.to(row, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, `bayes-theorem+=${1.4 + i * 0.55}`);
});

tl.addLabel('intractable', 'bayes-theorem+=4.5');

if (warnEl) {
  tl.to(warnEl, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 'intractable')
    .to(warnEl, {
      boxShadow: '0 0 24px #EF444477',
      duration: 0.5, repeat: 3, yoyo: true, ease: 'power2.inOut'
    }, 'intractable+=0.8');

  tl.to(termRowEls[3], {
    boxShadow: '0 0 12px #EF444455',
    duration: 0.4
  }, 'intractable+=0.3');
}

tl.to(revLine.node(), {
  attr: { 'stroke-width': 4 },
  duration: 0.3, repeat: 2, yoyo: true, ease: 'power2.inOut'
}, 'intractable+=0.5');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
