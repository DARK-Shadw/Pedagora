<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The KL divergence formula appears: D_KL(P || Q) = Σ P(x) · l</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
const W = window.innerWidth;
const H = window.innerHeight;

// ── Data ──────────────────────────────────────────────────────────────────────
const xVals = ['1', '2', '3', '4', '5'];
const P = [0.40, 0.30, 0.15, 0.10, 0.05];
const Q = [0.05, 0.10, 0.20, 0.35, 0.30];
const logRatios = P.map((p, i) => Math.log(p / Q[i]));
const weighted = P.map((p, i) => p * logRatios[i]);
const klPQ = weighted.reduce((a, b) => a + b, 0);
const klQP = Q.map((q, i) => q * Math.log(q / P[i])).reduce((a, b) => a + b, 0);

// ── Colors ────────────────────────────────────────────────────────────────────
const C = {
  blue: '#3B82F6', orange: '#F97316', green: '#22C55E',
  red: '#EF4444', yellow: '#F59E0B', purple: '#8B5CF6',
  white: '#c9d1d9', bg: '#0d1117'
};

// ── Title div ─────────────────────────────────────────────────────────────────
const titleEl = document.createElement('div');
Object.assign(titleEl.style, {
  position: 'absolute', top: '14px', left: '0', width: '100%',
  textAlign: 'center', opacity: '0', color: C.white,
  fontSize: '20px', fontFamily: 'Georgia, serif', fontWeight: 'bold',
  letterSpacing: '0.3px'
});
titleEl.textContent = 'KL Divergence — How Different Are Two Distributions?';
container.appendChild(titleEl);

// ── KaTeX formula ─────────────────────────────────────────────────────────────
const formulaEl = document.createElement('div');
Object.assign(formulaEl.style, {
  position: 'absolute', top: '48px', left: '0', width: '100%',
  textAlign: 'center', opacity: '0'
});
container.appendChild(formulaEl);
katex.render(
  'D_{KL}(P \\| Q) = \\sum_x P(x) \\cdot \\log\\dfrac{P(x)}{Q(x)}',
  formulaEl,
  { throwOnError: false, displayMode: true }
);

// ── SVG canvas ────────────────────────────────────────────────────────────────
const svg = d3.select(container).append('svg')
  .attr('width', W).attr('height', H)
  .style('position', 'absolute').style('top', 0).style('left', 0);

// ── Layout constants ──────────────────────────────────────────────────────────
const TOP = 132;
const CHART_H = Math.min(Math.floor(H * 0.38), 230);
const PAD_X = 40;
const TOTAL_W = W - PAD_X * 2;
const SUB_W = TOTAL_W / 4;

// ── Bar chart factory ─────────────────────────────────────────────────────────
function makeChart(data, colorFn, title, subtitle, yDomain, index) {
  const offsetX = PAD_X + index * SUB_W;
  const g = svg.append('g')
    .attr('transform', `translate(${offsetX},${TOP})`)
    .attr('opacity', 0);

  const xs = d3.scaleBand().domain(xVals).range([0, SUB_W - 6]).padding(0.28);
  const ys = d3.scaleLinear().domain(yDomain).range([CHART_H, 0]);
  const zeroY = ys(0);

  // Zero / baseline
  g.append('line')
    .attr('x1', 0).attr('y1', zeroY).attr('x2', SUB_W - 6).attr('y2', zeroY)
    .attr('stroke', '#334').attr('stroke-width', 1.5).attr('stroke-dasharray', '4,3');

  // X axis labels
  xVals.forEach(v => {
    g.append('text')
      .attr('x', xs(v) + xs.bandwidth() / 2).attr('y', CHART_H + 18)
      .attr('text-anchor', 'middle').attr('fill', '#666').attr('font-size', 11)
      .text('x=' + v);
  });

  // Bars — start at zero, will animate
  const bars = g.selectAll('.bar').data(data).enter().append('rect')
    .attr('x', (d, i) => xs(xVals[i]))
    .attr('y', zeroY)
    .attr('width', xs.bandwidth())
    .attr('height', 0)
    .attr('fill', (d, i) => colorFn(d, i))
    .attr('rx', 3);

  // Value labels
  const vlabels = g.selectAll('.vlbl').data(data).enter().append('text')
    .attr('x', (d, i) => xs(xVals[i]) + xs.bandwidth() / 2)
    .attr('y', d => d >= 0 ? ys(d) - 5 : ys(d) + 14)
    .attr('text-anchor', 'middle').attr('fill', C.white).attr('font-size', 10)
    .attr('opacity', 0)
    .text(d => d.toFixed(2));

  // Chart title
  g.append('text').attr('x', (SUB_W - 6) / 2).attr('y', -17)
    .attr('text-anchor', 'middle').attr('fill', C.white)
    .attr('font-size', 13).attr('font-weight', 'bold').text(title);

  g.append('text').attr('x', (SUB_W - 6) / 2).attr('y', -4)
    .attr('text-anchor', 'middle').attr('fill', '#666').attr('font-size', 10)
    .text(subtitle);

  return { g, bars, vlabels, xs, ys, zeroY };
}

const maxPQ  = Math.max(...P, ...Q) * 1.28;
const maxLog = Math.max(...logRatios.map(Math.abs)) * 1.3;
const maxW   = Math.max(...weighted.map(Math.abs)) * 1.4;

const c1 = makeChart(P,        ()  => C.blue,                    'P(x)',             'reference',      [0, maxPQ],        0);
const c2 = makeChart(Q,        ()  => C.orange,                  'Q(x)',             'approximation',  [0, maxPQ],        1);
const c3 = makeChart(logRatios, d  => d >= 0 ? C.green : C.red,  'log[P(x)/Q(x)]',  'log-ratio',      [-maxLog, maxLog], 2);
const c4 = makeChart(weighted,  d  => d >= 0 ? C.purple : C.red, 'P(x)·log[P/Q]',   'weighted penalty',[-maxW, maxW],    3);

// ── KL sum panel ──────────────────────────────────────────────────────────────
const KL_Y = TOP + CHART_H + 58;
const klG = svg.append('g')
  .attr('transform', `translate(${W / 2},${KL_Y})`)
  .attr('opacity', 0);

const klBoxEl = klG.append('rect')
  .attr('x', -180).attr('y', -28).attr('width', 360).attr('height', 56)
  .attr('rx', 8).attr('fill', '#0c1220').attr('stroke', C.purple).attr('stroke-width', 2);

klG.append('text')
  .attr('text-anchor', 'middle').attr('fill', C.purple)
  .attr('font-size', 18).attr('font-weight', 'bold').attr('y', 7)
  .text('KL(P \u2225 Q) = ' + klPQ.toFixed(4) + ' nats');

// ── Caption bar ───────────────────────────────────────────────────────────────
const captionEl = document.createElement('div');
Object.assign(captionEl.style, {
  position: 'absolute', bottom: '18px', left: '0', width: '100%',
  textAlign: 'center', opacity: '0', color: C.yellow,
  fontSize: '16px', fontFamily: 'Georgia, serif', fontWeight: 'bold'
});
container.appendChild(captionEl);

// ── Asymmetry panel ───────────────────────────────────────────────────────────
const asymEl = document.createElement('div');
Object.assign(asymEl.style, {
  position: 'absolute',
  top: (KL_Y + 44) + 'px',
  left: '50%', transform: 'translateX(-50%)',
  padding: '10px 22px', background: '#0c1220',
  border: '2px solid ' + C.yellow, borderRadius: '8px',
  opacity: '0', color: C.yellow,
  fontSize: '15px', fontFamily: 'Georgia, serif', textAlign: 'center',
  whiteSpace: 'nowrap'
});
asymEl.innerHTML =
  'KL(P \u2225 Q) = <b>' + klPQ.toFixed(4) + '</b> nats' +
  '&nbsp;&nbsp;|&nbsp;&nbsp;' +
  'KL(Q \u2225 P) = <b>' + klQP.toFixed(4) + '</b> nats<br>' +
  '<span style="font-size:13px;color:' + C.white + ';">' +
  'KL(P\u2225Q) \u2260 KL(Q\u2225P) \u2014 it matters which direction you measure!' +
  '</span>';
container.appendChild(asymEl);

// ── Penalty spotlight (x=1 in c3) ────────────────────────────────────────────
const spX = PAD_X + 2 * SUB_W + c3.xs('1') - 4;
const spY = TOP - 22;
const spW = c3.xs.bandwidth() + 8;
const spH = CHART_H + 30;

const spotG = svg.append('g').attr('opacity', 0);
spotG.append('rect')
  .attr('x', spX).attr('y', spY).attr('width', spW).attr('height', spH)
  .attr('fill', 'rgba(239,68,68,0.07)').attr('stroke', C.red)
  .attr('stroke-width', 2).attr('rx', 5);

const spotLbl = svg.append('text')
  .attr('x', spX + spW / 2).attr('y', spY - 8)
  .attr('text-anchor', 'middle').attr('fill', C.red)
  .attr('font-size', 11).attr('font-weight', 'bold').attr('opacity', 0)
  .text('HUGE PENALTY!');

// ── Animate bars helper ───────────────────────────────────────────────────────
function animateBars(chart, label, delay) {
  chart.bars.each(function(d, i) {
    tl.to(this, {
      attr: {
        y: d >= 0 ? chart.ys(d) : chart.zeroY,
        height: Math.abs(chart.ys(d) - chart.zeroY)
      },
      duration: 0.5, ease: 'power2.out'
    }, label + '+=' + (delay + i * 0.13));
  });
  chart.vlabels.each(function(d, i) {
    tl.to(this, { opacity: 1, duration: 0.3 }, label + '+=' + (delay + 0.6 + i * 0.1));
  });
}

// ── Timeline ──────────────────────────────────────────────────────────────────

// STEP 1 — intro: title + formula
tl.addLabel('intro');
tl.to(titleEl, { opacity: 1, duration: 0.9 }, 'intro');
tl.to(formulaEl, { opacity: 1, duration: 1.1, ease: 'power2.out' }, 'intro+=0.5');
tl.set(captionEl, { innerHTML: 'Step 1: P(x) is the true distribution — Q(x) is our approximation' }, 'intro+=1.2');
tl.to(captionEl, { opacity: 1, duration: 0.6 }, 'intro+=1.2');

// STEP 2 — distributions: show P and Q side by side
tl.addLabel('distributions', 'intro+=2.8');
tl.to(c1.g.node(), { opacity: 1, duration: 0.5 }, 'distributions');
tl.to(c2.g.node(), { opacity: 1, duration: 0.5 }, 'distributions+=0.3');
animateBars(c1, 'distributions', 0.45);
animateBars(c2, 'distributions', 0.75);

// STEP 3 — log-ratio: compute log(P/Q) for each x
tl.addLabel('log-ratio', 'distributions+=4.5');
tl.to(captionEl, { opacity: 0, duration: 0.3 }, 'log-ratio');
tl.set(captionEl, { innerHTML: 'Step 2: log(P/Q) \u2014 positive where P \u003e Q (P more likely), negative where P \u003c Q' }, 'log-ratio+=0.3');
tl.to(captionEl, { opacity: 1, duration: 0.5 }, 'log-ratio+=0.4');
tl.to(c3.g.node(), { opacity: 1, duration: 0.5 }, 'log-ratio+=0.45');
animateBars(c3, 'log-ratio', 0.75);

// Spotlight x=1: P=0.40, Q=0.05 → log(8) ≈ 2.08 → big green bar
tl.to(spotG.node(), { opacity: 1, duration: 0.7 }, 'log-ratio+=2.6');
tl.to(spotLbl.node(), { opacity: 1, duration: 0.5 }, 'log-ratio+=3.2');

// STEP 4 — weighted: multiply log-ratio by P(x), sum = KL
tl.addLabel('weighted', 'log-ratio+=5.8');
tl.to(spotG.node(), { opacity: 0, duration: 0.4 }, 'weighted');
tl.to(spotLbl.node(), { opacity: 0, duration: 0.4 }, 'weighted');
tl.to(captionEl, { opacity: 0, duration: 0.3 }, 'weighted');
tl.set(captionEl, { innerHTML: 'Step 3: Weight each log-ratio by P(x) \u2014 rare x values contribute little, common ones dominate' }, 'weighted+=0.3');
tl.to(captionEl, { opacity: 1, duration: 0.5 }, 'weighted+=0.4');
tl.to(c4.g.node(), { opacity: 1, duration: 0.5 }, 'weighted+=0.45');
animateBars(c4, 'weighted', 0.75);

// KL sum appears
tl.to(klG.node(), { opacity: 1, duration: 1.1, ease: 'back.out(1.7)' }, 'weighted+=2.6');
// Glow pulse on KL box
tl.to(klBoxEl.node(), {
  attr: { stroke: C.yellow, 'stroke-width': 3 },
  duration: 0.55, repeat: 3, yoyo: true, ease: 'power1.inOut'
}, 'weighted+=3.9');

// STEP 5 — asymmetry: KL(P||Q) ≠ KL(Q||P)
tl.addLabel('asymmetry', 'weighted+=6.5');
tl.to(captionEl, { opacity: 0, duration: 0.3 }, 'asymmetry');
tl.set(captionEl, { innerHTML: 'Key Insight: KL Divergence is <em>asymmetric</em> \u2014 direction matters!' }, 'asymmetry+=0.3');
tl.to(captionEl, { opacity: 1, duration: 0.5, color: C.red }, 'asymmetry+=0.4');
tl.to(asymEl, { opacity: 1, duration: 0.9 }, 'asymmetry+=0.9');
tl.to(asymEl, {
  borderColor: C.red,
  duration: 0.55, repeat: 4, yoyo: true, ease: 'power1.inOut'
}, 'asymmetry+=2.2');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
