<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen starts as pure static noise — millions of random colo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.querySelector('#canvas-container');
container.style.position = 'relative';
container.style.overflow = 'hidden';
container.style.background = '#0d1117';

const W = container.offsetWidth || 1280;
const H = container.offsetHeight || 720;

// ---- Zoom wrapper (origin at eye area of portrait) ----
const zoomWrapper = document.createElement('div');
zoomWrapper.style.cssText = 'position:absolute;inset:0;transform-origin:50% 36%;';
container.appendChild(zoomWrapper);

// ---- Real face image (revealed beneath noise) ----
const imgDiv = document.createElement('div');
imgDiv.style.cssText = 'position:absolute;inset:0;opacity:0;filter:blur(28px);';
const faceImg = document.createElement('img');
faceImg.crossOrigin = 'anonymous';
faceImg.src = 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=1280&q=80&fit=crop';
faceImg.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:center 15%;';
imgDiv.appendChild(faceImg);
zoomWrapper.appendChild(imgDiv);

// ---- Noise canvas (sits on top of face, fades out) ----
const noiseCanvas = document.createElement('canvas');
noiseCanvas.width = W;
noiseCanvas.height = H;
noiseCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
zoomWrapper.appendChild(noiseCanvas);
const ctx = noiseCanvas.getContext('2d');

let animId;
function drawNoise() {
  const id = ctx.createImageData(W, H);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    d[i]   = Math.random() * 255 | 0;
    d[i+1] = Math.random() * 255 | 0;
    d[i+2] = Math.random() * 255 | 0;
    d[i+3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  animId = requestAnimationFrame(drawNoise);
}
drawNoise();

// ---- Pixel values panel (lives on container, unaffected by zoom) ----
const panel = document.createElement('div');
panel.style.cssText = [
  'position:absolute',
  'bottom:72px',
  'right:32px',
  'opacity:0',
  'background:rgba(13,17,23,0.93)',
  'border:1px solid #3B82F6',
  'border-radius:10px',
  'padding:14px 16px',
  'min-width:252px',
  'z-index:5',
  'font-family:JetBrains Mono,monospace'
].join(';');

const panelTitle = document.createElement('div');
panelTitle.style.cssText = 'color:#3B82F6;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;';
panelTitle.textContent = 'Pixel Values — Eye Region';
panel.appendChild(panelTitle);

const gridDiv = document.createElement('div');
gridDiv.style.cssText = 'display:grid;grid-template-columns:repeat(9,1fr);gap:2px;font-size:8.5px;margin-bottom:10px;';
for (let i = 0; i < 45; i++) {
  const v = (Math.random() * 4 - 2);
  const cell = document.createElement('span');
  cell.style.color = v > 0 ? '#3B82F6' : '#EF4444';
  cell.textContent = v.toFixed(2);
  gridDiv.appendChild(cell);
}
panel.appendChild(gridDiv);

// D3 Gaussian distribution curve
const svgW = 220, svgH = 68;
const svgEl = d3.create('svg').attr('width', svgW).attr('height', svgH);
const xs = d3.scaleLinear().domain([-3, 3]).range([22, svgW - 8]);
const ys = d3.scaleLinear().domain([0, 0.42]).range([svgH - 16, 4]);
const pts = d3.range(-3, 3.05, 0.07);
const gauss = x => Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);

svgEl.append('path')
  .datum(pts)
  .attr('d', d3.area().x(d => xs(d)).y0(svgH - 16).y1(d => ys(gauss(d))))
  .attr('fill', '#3B82F618');

svgEl.append('path')
  .datum(pts)
  .attr('d', d3.line().x(d => xs(d)).y(d => ys(gauss(d))))
  .attr('fill', 'none')
  .attr('stroke', '#3B82F6')
  .attr('stroke-width', 2);

svgEl.append('line')
  .attr('x1', 22).attr('y1', svgH - 16)
  .attr('x2', svgW - 8).attr('y2', svgH - 16)
  .attr('stroke', '#ffffff28').attr('stroke-width', 1);

[-2, 0, 2].forEach(v =>
  svgEl.append('text')
    .attr('x', xs(v)).attr('y', svgH - 3)
    .attr('text-anchor', 'middle')
    .attr('fill', '#c9d1d955')
    .attr('font-size', 9)
    .text(v)
);

panel.appendChild(svgEl.node());

const eqDiv = document.createElement('div');
eqDiv.style.cssText = 'margin-top:9px;text-align:center;';
katex.render('x_{ij} \\sim \\mathcal{N}(\\mu,\\,\\sigma^2)', eqDiv, { throwOnError: false });
panel.appendChild(eqDiv);

container.appendChild(panel);

// ---- Question mark + caption overlay ----
const qWrap = document.createElement('div');
qWrap.style.cssText = [
  'position:absolute',
  'inset:0',
  'display:flex',
  'flex-direction:column',
  'align-items:center',
  'justify-content:center',
  'pointer-events:none',
  'z-index:10',
  'opacity:0'
].join(';');

const qMark = document.createElement('div');
qMark.style.cssText = [
  'font-size:128px',
  'font-weight:900',
  'font-family:Georgia,serif',
  'color:#F59E0B',
  'text-shadow:0 0 40px #F59E0B80,0 0 80px #F59E0B40',
  'line-height:1',
  'user-select:none'
].join(';');
qMark.textContent = '?';
qWrap.appendChild(qMark);

const caption = document.createElement('div');
caption.style.cssText = [
  'font-size:22px',
  'font-weight:600',
  'color:#c9d1d9',
  'margin-top:22px',
  'letter-spacing:0.4px',
  'text-shadow:0 2px 16px #0d1117',
  'text-align:center'
].join(';');
caption.textContent = 'How does randomness become THIS?';
qWrap.appendChild(caption);

container.appendChild(qWrap);

// ==============================================================
// GSAP TIMELINE
// ==============================================================

// Step 1 — pure chaos (0 – 5s)
tl.addLabel('intro', 0);
tl.to({}, { duration: 5 });

// Step 2 — order emerges, face coalesces from noise (5 – 15s)
tl.addLabel('emergence', 5);

tl.to(imgDiv, {
  opacity: 1,
  filter: 'blur(0px)',
  duration: 8,
  ease: 'power2.inOut'
}, 'emergence');

tl.to(noiseCanvas, {
  opacity: 0,
  duration: 7,
  ease: 'power1.inOut',
  onComplete() { cancelAnimationFrame(animId); }
}, 'emergence+=1');

// Step 3 — camera dives into the eye, pixel numbers revealed (15 – 27s)
tl.addLabel('zoom', 15);

tl.to(zoomWrapper, {
  scale: 5,
  duration: 10,
  ease: 'power2.inOut'
}, 'zoom');

tl.to(panel, {
  opacity: 1,
  duration: 2.5,
  ease: 'power2.out'
}, 'zoom+=5.5');

// Step 4 — the question pulses (27 – 50s)
tl.addLabel('question', 27);

tl.to(qWrap, {
  opacity: 1,
  duration: 2,
  ease: 'power2.out'
}, 'question');

// Pulsing glow — 9 yoyo cycles × 2s = 18s, lands at ~47s
tl.to(qMark, {
  scale: 1.12,
  textShadow: '0 0 65px #F59E0B, 0 0 120px #F59E0B60',
  duration: 2,
  ease: 'sine.inOut',
  yoyo: true,
  repeat: 8
}, 'question+=2');

// Hold to 50s
tl.to({}, { duration: 3 });

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
