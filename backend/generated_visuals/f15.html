<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
// ── Layout Setup ──────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
container.style.cssText = `
  width:100vw; height:100vh; background:#0d1117; display:flex; flex-direction:column;
  padding:20px; box-sizing:border-box; font-family:'JetBrains Mono','Courier New',monospace;
  overflow:hidden;
`;

// Window chrome
const chrome = document.createElement('div');
chrome.style.cssText = `
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:#161b22; border-radius:8px 8px 0 0;
  border:1px solid #30363d; border-bottom:none; flex-shrink:0;
`;
chrome.innerHTML = `
  <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57;display:inline-block;"></span>
  <span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;display:inline-block;"></span>
  <span style="width:12px;height:12px;border-radius:50%;background:#28C840;display:inline-block;"></span>
  <span style="color:#8b949e;font-size:12px;margin-left:10px;letter-spacing:0.02em;">gaussian_lab.py</span>
  <span style="color:#30363d;margin-left:auto;font-size:11px;">Python 3.10</span>
`;
container.appendChild(chrome);

// Editor shell
const shell = document.createElement('div');
shell.style.cssText = `
  display:flex; flex-direction:column; flex:1; overflow:hidden;
  border:1px solid #30363d; border-radius:0 0 8px 8px;
`;
container.appendChild(shell);

// Scrollable code area
const codeArea = document.createElement('div');
codeArea.style.cssText = `
  flex:1; overflow-y:auto; overflow-x:hidden; padding:18px 20px;
  display:flex; flex-direction:column; gap:22px;
  scrollbar-width:thin; scrollbar-color:#30363d transparent;
`;
shell.appendChild(codeArea);

// Terminal panel (collapsed)
const termPanel = document.createElement('div');
termPanel.style.cssText = `
  height:0; overflow:hidden; background:#0a0d12;
  border-top:1px solid #30363d; flex-shrink:0;
`;
shell.appendChild(termPanel);

const termHead = document.createElement('div');
termHead.style.cssText = `
  padding:5px 14px; background:#161b22; border-bottom:1px solid #30363d;
  color:#8b949e; font-size:11px; display:flex; align-items:center; gap:6px;
`;
termHead.innerHTML = `<span style="color:#22C55E;font-size:10px;">▶</span> TERMINAL`;
termPanel.appendChild(termHead);

const termBody = document.createElement('div');
termBody.style.cssText = `
  padding:10px 16px; font-size:12px; line-height:1.65;
  font-family:'Courier New',monospace; overflow-y:auto; max-height:180px;
`;
termPanel.appendChild(termBody);

// ── Code Block Factory ─────────────────────────────────────────────────────────
function makeBlock(id, title, accentColor, code) {
  const wrapper = document.createElement('div');
  wrapper.id = id;
  wrapper.style.cssText = `opacity:0; transform:translateY(18px);`;

  const header = document.createElement('div');
  header.style.cssText = `
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  `;
  header.innerHTML = `
    <span style="width:3px;height:16px;background:${accentColor};border-radius:2px;display:inline-block;"></span>
    <span style="color:${accentColor};font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">${title}</span>
  `;
  wrapper.appendChild(header);

  const pre = document.createElement('pre');
  pre.style.cssText = `
    background:#161b22; border:1px solid #30363d; border-radius:6px;
    margin:0; padding:14px 16px; overflow-x:auto;
    font-size:12.5px; line-height:1.65; transition:border-color 0.3s, box-shadow 0.3s;
  `;

  const codeEl = document.createElement('code');
  codeEl.className = 'language-python';
  codeEl.innerHTML = Prism.highlight(code, Prism.languages.python, 'python');
  pre.appendChild(codeEl);
  wrapper.appendChild(pre);
  codeArea.appendChild(wrapper);
  return { wrapper, pre };
}

// ── Python Source Strings ──────────────────────────────────────────────────────
const src1 = `import numpy as np
import matplotlib.pyplot as plt
from scipy.stats import norm

# Parameters for the Gaussian distribution
mu, sigma = 0.0, 1.0
N = 10_000          # number of samples to draw

# Draw N samples from N(mu, sigma²)
samples = np.random.normal(loc=mu, scale=sigma, size=N)

# Histogram normalised to density (area = 1) so it matches the PDF
fig, ax = plt.subplots(figsize=(8, 4))
ax.hist(samples, bins=60, density=True,
        color='steelblue', alpha=0.6, label='Empirical histogram')

# Analytical PDF:  p(x) = exp(-0.5*(x-mu)²/sigma²) / (sigma*sqrt(2*pi))
x = np.linspace(-4, 4, 400)
pdf = norm.pdf(x, loc=mu, scale=sigma)
ax.plot(x, pdf, 'r-', lw=2, label=r'$\\mathcal{N}(0,1)$ PDF')

ax.legend(); ax.set_title('Sampling from a Gaussian')
plt.tight_layout(); plt.show()

print(f"Sample mean : {samples.mean():.4f}  (expected {mu})")
print(f"Sample std  : {samples.std():.4f}  (expected {sigma})")`;

const src2 = `# Monte Carlo estimation of E[x²] under N(0,1)
# Analytical answer:  E[x²] = sigma² + mu²  =  1 + 0  =  1

mu, sigma = 0.0, 1.0
truth = sigma**2 + mu**2       # = 1.0

results = []
for N in [100, 1_000, 10_000, 100_000, 1_000_000]:
    x       = np.random.normal(mu, sigma, size=N)
    est     = np.mean(x**2)            # unbiased estimator of E[x²]
    err     = abs(est - truth)
    results.append((N, est, err))
    print(f"N={N:>9,}  E[x²] ≈ {est:.5f}  error = {err:.2e}")

# Convergence: error shrinks as 1/sqrt(N)  (central limit theorem)
Ns     = [r[0] for r in results]
errors = [r[2] for r in results]

plt.figure(figsize=(7, 4))
plt.loglog(Ns, errors,               'o-',  lw=2,   label='MC error')
plt.loglog(Ns, [n**-0.5 for n in Ns], 'r--', lw=1.5, label=r'$O(1/\\sqrt{N})$')
plt.xlabel('N'); plt.ylabel('|error|')
plt.title('Monte Carlo Convergence of E[x²]')
plt.legend(); plt.grid(True, which='both', alpha=0.3)
plt.tight_layout(); plt.show()`;

const src3 = `# KL divergence  D_KL(P || Q)  where P = N(mu1, 1),  Q = N(mu1+Δmu, 1)
#
# Closed-form (equal variance sigma):
#   D_KL = (mu1 - mu2)² / (2 * sigma²)
#
# Sample-based estimate:
#   D_KL ≈ mean_x~P [ log p(x) - log q(x) ]

sigma = 1.0;  mu1 = 0.0
delta_mus   = np.linspace(0, 3, 100)

# ── Closed-form ──────────────────────────────────────────────
kl_closed   = delta_mus**2 / (2 * sigma**2)

# ── Sample-based ─────────────────────────────────────────────
N = 50_000
kl_sampled  = []
for dmu in delta_mus:
    mu2     = mu1 + dmu
    x       = np.random.normal(mu1, sigma, size=N)  # draw from P
    # log p(x)/q(x) = 0.5/sigma² * [(x-mu2)² - (x-mu1)²]
    log_r   = 0.5 * ((x - mu2)**2 - (x - mu1)**2) / sigma**2
    kl_sampled.append(np.mean(log_r))               # E_P[log p/q]

print(f"Δmu=1.0 → closed-form {0.5:.4f}  |  sampled {kl_sampled[33]:.4f}")
print(f"Δmu=2.0 → closed-form {2.0:.4f}  |  sampled {kl_sampled[66]:.4f}")

plt.figure(figsize=(7, 4))
plt.plot(delta_mus, kl_closed,  'b-',  lw=2.5, label='Closed-form KL')
plt.plot(delta_mus, kl_sampled, 'r--', lw=1.5, label='Sample-based KL  (N=50k)')
plt.xlabel(r'$\\Delta\\mu$'); plt.ylabel(r'$D_{KL}(P \\| Q)$')
plt.title('KL Divergence vs Mean Difference')
plt.legend(); plt.tight_layout(); plt.show()`;

const b1 = makeBlock('b1', 'Block 1 — Sampling from a Gaussian & Visualizing', '#3B82F6', src1);
const b2 = makeBlock('b2', 'Block 2 — Monte Carlo Estimation of E[x²]', '#F59E0B', src2);
const b3 = makeBlock('b3', 'Block 3 — KL Divergence Between Two Gaussians', '#8B5CF6', src3);

// ── Terminal Lines (pre-rendered, opacity 0) ───────────────────────────────────
const termLines = [
  { t: '$ python gaussian_lab.py',                              c: '#8b949e' },
  { t: '' },
  { t: '── Block 1: Sampling ─────────────────────────────────', c: '#3B82F6' },
  { t: 'Sample mean :  0.0018  (expected 0.0)',                  c: '#22C55E' },
  { t: 'Sample std  :  0.9994  (expected 1.0)',                  c: '#22C55E' },
  { t: '' },
  { t: '── Block 2: Monte Carlo ──────────────────────────────', c: '#F59E0B' },
  { t: 'N=       100  E[x²] ≈ 0.97821  error = 2.18e-02',       c: '#c9d1d9' },
  { t: 'N=     1,000  E[x²] ≈ 1.00341  error = 3.41e-03',       c: '#c9d1d9' },
  { t: 'N=    10,000  E[x²] ≈ 0.99874  error = 1.26e-03',       c: '#c9d1d9' },
  { t: 'N=   100,000  E[x²] ≈ 1.00012  error = 1.20e-04',       c: '#c9d1d9' },
  { t: 'N= 1,000,000  E[x²] ≈ 0.99998  error = 1.60e-05',       c: '#c9d1d9' },
  { t: '' },
  { t: '── Block 3: KL Divergence ────────────────────────────', c: '#8B5CF6' },
  { t: 'Δmu=1.0 → closed-form 0.5000  |  sampled 0.4997',       c: '#c9d1d9' },
  { t: 'Δmu=2.0 → closed-form 2.0000  |  sampled 1.9983',       c: '#c9d1d9' },
];

const termDivs = termLines.map(({ t, c }) => {
  const d = document.createElement('div');
  d.textContent = t;
  d.style.cssText = `color:${c || '#c9d1d9'};opacity:0;min-height:1em;`;
  termBody.appendChild(d);
  return d;
});

// ── GSAP Timeline ─────────────────────────────────────────────────────────────

// ── Step 1: Block 1 appears (intro)
tl.addLabel('intro');
tl.to(b1.wrapper, { opacity:1, y:0, duration:0.55, ease:'power2.out' });
tl.to(b1.pre, {
  borderColor:'#3B82F6', boxShadow:'0 0 14px rgba(59,130,246,0.3)',
  duration:0.35, ease:'power2.out'
});
tl.to(b1.pre, {
  borderColor:'#30363d', boxShadow:'none',
  duration:0.5, ease:'power2.in', delay:1.8
});

// ── Step 2: Block 2 (Monte Carlo)
tl.addLabel('montecarlo');
tl.to(b2.wrapper, { opacity:1, y:0, duration:0.55, ease:'power2.out' });
tl.to(b2.pre, {
  borderColor:'#F59E0B', boxShadow:'0 0 14px rgba(245,158,11,0.3)',
  duration:0.35, ease:'power2.out'
});
// Scroll code area down so block 2 is visible
tl.to(codeArea, { scrollTop: b2.wrapper.offsetTop - 20, duration:0.6, ease:'power2.inOut' }, '<');
tl.to(b2.pre, {
  borderColor:'#30363d', boxShadow:'none',
  duration:0.5, ease:'power2.in', delay:1.8
});

// ── Step 3: Block 3 (KL divergence)
tl.addLabel('kldivergence');
tl.to(b3.wrapper, { opacity:1, y:0, duration:0.55, ease:'power2.out' });
tl.to(b3.pre, {
  borderColor:'#8B5CF6', boxShadow:'0 0 14px rgba(139,92,246,0.3)',
  duration:0.35, ease:'power2.out'
});
tl.to(codeArea, { scrollTop: b3.wrapper.offsetTop - 20, duration:0.6, ease:'power2.inOut' }, '<');
tl.to(b3.pre, {
  borderColor:'#30363d', boxShadow:'none',
  duration:0.5, ease:'power2.in', delay:1.5
});

// ── Step 4: Open terminal, stagger output lines
tl.addLabel('terminal');
tl.to(termPanel, { height:220, duration:0.45, ease:'power2.inOut' });
tl.to(codeArea, { scrollTop: codeArea.scrollHeight, duration:0.5, ease:'power2.inOut' }, '<+=0.1');
tl.to(termDivs, {
  opacity: 1,
  stagger: 0.1,
  duration: 0.12,
  ease: 'none',
  onUpdate: function() { termBody.scrollTop = termBody.scrollHeight; }
}, '-=0.1');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
