<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayes' theorem displayed large and centered: P(A|B) = P(B|A)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.querySelector('#canvas-container');
container.style.overflow = 'hidden';

const wrap = document.createElement('div');
wrap.style.cssText = `
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start;
  padding:20px 24px; gap:12px;
  color:#c9d1d9;
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden; box-sizing:border-box;
`;
container.appendChild(wrap);

// Title
const titleEl = document.createElement('div');
titleEl.textContent = "Bayes' Theorem";
titleEl.style.cssText = 'font-size:clamp(18px,2.5vw,30px);font-weight:700;color:#3B82F6;letter-spacing:1px;flex-shrink:0;';
wrap.appendChild(titleEl);
gsap.set(titleEl, { opacity:0, y:-20 });

// Equation
const eqEl = document.createElement('div');
eqEl.style.cssText = 'padding:10px 20px;background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.3);border-radius:12px;flex-shrink:0;';
katex.render('P(A|B) = \\dfrac{P(B|A) \\cdot P(A)}{P(B)}', eqEl, { throwOnError:false, displayMode:true });
wrap.appendChild(eqEl);
gsap.set(eqEl, { opacity:0, scale:0.85 });

// Term cards row
const termRow = document.createElement('div');
termRow.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px;flex-shrink:0;';
wrap.appendChild(termRow);

const TERMS = [
  { sym:'P(A)',   lbl:'Prior',      desc:'What we believed before seeing evidence', col:'#8B5CF6' },
  { sym:'P(B|A)', lbl:'Likelihood', desc:'How likely is the evidence if A is true', col:'#3B82F6' },
  { sym:'P(B)',   lbl:'Evidence',   desc:'How likely is this evidence overall',     col:'#F59E0B' },
  { sym:'P(A|B)', lbl:'Posterior',  desc:'Updated belief after seeing evidence',    col:'#22C55E' },
];

const cardEls = TERMS.map(t => {
  const c = document.createElement('div');
  c.style.cssText = `flex:1;min-width:140px;max-width:200px;padding:10px 12px;background:rgba(255,255,255,0.04);border:2px solid ${t.col};border-radius:10px;text-align:center;`;
  const sym = document.createElement('div');
  sym.style.cssText = `color:${t.col};margin-bottom:3px;`;
  katex.render(t.sym, sym, { throwOnError:false });
  const lbl = document.createElement('div');
  lbl.style.cssText = `color:${t.col};font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:4px;`;
  lbl.textContent = t.lbl;
  const desc = document.createElement('div');
  desc.style.cssText = 'color:#8b949e;font-size:11px;line-height:1.5;';
  desc.textContent = t.desc;
  c.append(sym, lbl, desc);
  termRow.appendChild(c);
  gsap.set(c, { opacity:0, y:15 });
  return c;
});

// Balance scale SVG
const scaleCont = document.createElement('div');
scaleCont.style.cssText = 'width:100%;max-width:520px;flex-shrink:0;';
wrap.appendChild(scaleCont);
gsap.set(scaleCont, { opacity:0 });

const SW=520, SH=165, SCX=260, SPIV=52, BLEN=172;
const ssvg = d3.select(scaleCont).append('svg')
  .attr('viewBox',`0 0 ${SW} ${SH}`).attr('width','100%').style('overflow','visible');

const sdefs = ssvg.append('defs');
sdefs.append('marker').attr('id','sarr-g').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
  .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
  .append('path').attr('d','M0,0 L10,5 L0,10 Z').attr('fill','#22C55E');

// Stand + base
ssvg.append('line').attr('x1',SCX).attr('y1',SH-8).attr('x2',SCX).attr('y2',SPIV)
  .attr('stroke','#4b5563').attr('stroke-width',4).attr('stroke-linecap','round');
ssvg.append('rect').attr('x',SCX-28).attr('y',SH-10).attr('width',56).attr('height',10)
  .attr('rx',3).attr('fill','#4b5563');

// Posterior result (above scale, hidden initially)
const postText = ssvg.append('text').attr('x',SCX).attr('y',20).attr('text-anchor','middle')
  .attr('fill','#22C55E').attr('font-size','14px').attr('font-weight','bold')
  .text('\u21D2  Posterior  P(A|B)');
gsap.set(postText.node(), { opacity:0 });

// Beam group (rotates around pivot)
const beamG = ssvg.append('g').attr('id','bayes-beam');
beamG.append('line').attr('x1',SCX-BLEN).attr('y1',SPIV).attr('x2',SCX+BLEN).attr('y2',SPIV)
  .attr('stroke','#c9d1d9').attr('stroke-width',3).attr('stroke-linecap','round');
beamG.append('circle').attr('cx',SCX).attr('cy',SPIV).attr('r',7).attr('fill','#F59E0B');

// Left pan – Prior
beamG.append('line').attr('x1',SCX-BLEN).attr('y1',SPIV).attr('x2',SCX-BLEN).attr('y2',SPIV+40)
  .attr('stroke','#6b7280').attr('stroke-width',1.5).attr('stroke-dasharray','3,3');
beamG.append('line').attr('x1',SCX-BLEN-26).attr('y1',SPIV+40).attr('x2',SCX-BLEN+26).attr('y2',SPIV+40)
  .attr('stroke','#8B5CF6').attr('stroke-width',4).attr('stroke-linecap','round');
beamG.append('text').attr('x',SCX-BLEN).attr('y',SPIV+60).attr('text-anchor','middle')
  .attr('fill','#8B5CF6').attr('font-size','13px').attr('font-weight','bold').text('Prior  P(A)');

// Right pan – Likelihood
beamG.append('line').attr('x1',SCX+BLEN).attr('y1',SPIV).attr('x2',SCX+BLEN).attr('y2',SPIV+40)
  .attr('stroke','#6b7280').attr('stroke-width',1.5).attr('stroke-dasharray','3,3');
beamG.append('line').attr('x1',SCX+BLEN-26).attr('y1',SPIV+40).attr('x2',SCX+BLEN+26).attr('y2',SPIV+40)
  .attr('stroke','#3B82F6').attr('stroke-width',4).attr('stroke-linecap','round');
beamG.append('text').attr('x',SCX+BLEN).attr('y',SPIV+60).attr('text-anchor','middle')
  .attr('fill','#3B82F6').attr('font-size','13px').attr('font-weight','bold').text('Likelihood  P(B|A)');

// Scale caption
const scaleCaption = document.createElement('div');
scaleCaption.style.cssText = 'color:#8b949e;font-size:11px;text-align:center;margin-top:-6px;flex-shrink:0;';
scaleCaption.textContent = 'Weighing Prior belief against Likelihood of evidence \u2192 gives the Posterior';
wrap.appendChild(scaleCaption);
gsap.set(scaleCaption, { opacity:0 });

// Flow diagram SVG
const flowCont = document.createElement('div');
flowCont.style.cssText = 'width:100%;max-width:740px;flex-shrink:0;';
wrap.appendChild(flowCont);
gsap.set(flowCont, { opacity:0 });

const FW=740, FH=112;
const fsvg = d3.select(flowCont).append('svg')
  .attr('viewBox',`0 0 ${FW} ${FH}`).attr('width','100%');

const fdefs = fsvg.append('defs');
fdefs.append('marker').attr('id','farr-b').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
  .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
  .append('path').attr('d','M0,0 L10,5 L0,10 Z').attr('fill','#3B82F6');
fdefs.append('marker').attr('id','farr-y').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
  .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
  .append('path').attr('d','M0,0 L10,5 L0,10 Z').attr('fill','#F59E0B');

const FNODES = [
  { x:80,  lines:['Prior','Belief'],     col:'#8B5CF6' },
  { x:250, lines:['Observe','Data'],     col:'#3B82F6' },
  { x:420, lines:['Update'],             col:'#F59E0B' },
  { x:590, lines:['Posterior','Belief'], col:'#22C55E' },
];

const fNodeEls = FNODES.map(n => {
  const g = fsvg.append('g');
  g.append('rect').attr('x',n.x-60).attr('y',18).attr('width',120).attr('height',48)
    .attr('rx',8).attr('fill','rgba(255,255,255,0.04)').attr('stroke',n.col).attr('stroke-width',2);
  const yBase = n.lines.length > 1 ? 40 : 46;
  n.lines.forEach((ln,i) => {
    g.append('text').attr('x',n.x).attr('y',yBase+i*17)
      .attr('text-anchor','middle').attr('fill',n.col)
      .attr('font-size','13px').attr('font-weight','bold').text(ln);
  });
  gsap.set(g.node(), { opacity:0 });
  return g;
});

const fArrEls = [];
for(let i=0;i<FNODES.length-1;i++){
  const a = fsvg.append('line')
    .attr('x1',FNODES[i].x+62).attr('y1',42)
    .attr('x2',FNODES[i+1].x-62).attr('y2',42)
    .attr('stroke','#3B82F6').attr('stroke-width',2.5)
    .attr('marker-end','url(#farr-b)');
  gsap.set(a.node(), { opacity:0 });
  fArrEls.push(a);
}

const fbPath = fsvg.append('path')
  .attr('d','M 650 66 C 650 100, 20 100, 20 66')
  .attr('fill','none').attr('stroke','#F59E0B').attr('stroke-width',2)
  .attr('stroke-dasharray','6,4').attr('marker-end','url(#farr-y)');
const fbTxt = fsvg.append('text').attr('x',FW/2).attr('y',108)
  .attr('text-anchor','middle').attr('fill','#F59E0B')
  .attr('font-size','11px').attr('font-style','italic').text('Learn from data');
gsap.set(fbPath.node(), { opacity:0 });
gsap.set(fbTxt.node(), { opacity:0 });

// =====================================
// GSAP TIMELINE
// =====================================

tl
  // Step 1 — Equation reveal
  .addLabel('intro')
  .to(titleEl, { opacity:1, y:0, duration:1, ease:'power2.out' })
  .to(eqEl, { opacity:1, scale:1, duration:1.2, ease:'back.out(1.5)' }, '+=0.4')

  // Step 2 — Term definitions
  .addLabel('terms', '+=0.8')
  .to(cardEls[0], { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 'terms')
  .to(cardEls[1], { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 'terms+=0.18')
  .to(cardEls[2], { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 'terms+=0.36')
  .to(cardEls[3], { opacity:1, y:0, duration:0.5, ease:'power2.out' }, 'terms+=0.54')

  // Step 3 — Balance scale: Prior vs Likelihood
  .addLabel('scale', '+=1')
  .to(scaleCont, { opacity:1, duration:0.7, ease:'power2.inOut' }, 'scale')
  .to('#bayes-beam', { svgOrigin:`${SCX} ${SPIV}`, rotation:-13, duration:1.6, ease:'power2.inOut' }, 'scale+=0.5')
  .to('#bayes-beam', { rotation:13, duration:2, ease:'power2.inOut' })
  .to('#bayes-beam', { rotation:0, duration:1.2, ease:'elastic.out(1,0.6)' })
  .to(postText.node(), { opacity:1, duration:0.8, ease:'power2.inOut' }, '+=0.3')
  .to(scaleCaption, { opacity:1, duration:0.5, ease:'power2.inOut' }, '+=0.1')

  // Step 4 — Belief update flow diagram
  .addLabel('flow', '+=0.8')
  .to(flowCont, { opacity:1, duration:0.5, ease:'power2.inOut' }, 'flow')
  .to(fNodeEls[0].node(), { opacity:1, duration:0.4, ease:'power2.out' }, 'flow+=0.2')
  .to(fArrEls[0].node(), { opacity:1, duration:0.35, ease:'power2.out' }, 'flow+=0.55')
  .to(fNodeEls[1].node(), { opacity:1, duration:0.4, ease:'power2.out' }, 'flow+=0.72')
  .to(fArrEls[1].node(), { opacity:1, duration:0.35, ease:'power2.out' }, 'flow+=1.05')
  .to(fNodeEls[2].node(), { opacity:1, duration:0.4, ease:'power2.out' }, 'flow+=1.22')
  .to(fArrEls[2].node(), { opacity:1, duration:0.35, ease:'power2.out' }, 'flow+=1.55')
  .to(fNodeEls[3].node(), { opacity:1, duration:0.4, ease:'power2.out' }, 'flow+=1.72')
  .to(fbPath.node(), { opacity:1, duration:0.8, ease:'power2.inOut' }, 'flow+=2.1')
  .to(fbTxt.node(), { opacity:1, duration:0.5, ease:'power2.inOut' }, 'flow+=2.6');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
