<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A multi-part challenge displayed on screen. Part A: Given P </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.cssText = 'background:#0d1117;color:#c9d1d9;font-family:Inter,sans-serif;overflow:hidden;position:relative;width:100vw;height:100vh;';

// ── Layout root ──────────────────────────────────────────────────────────────
const root = document.createElement('div');
root.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px;box-sizing:border-box;gap:20px;';
container.appendChild(root);

// ── Header ────────────────────────────────────────────────────────────────────
const header = document.createElement('div');
header.id = 'header';
header.style.cssText = 'opacity:0;text-align:center;';
header.innerHTML = '<div style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#8B5CF6;margin-bottom:6px;">Practice Challenge</div><div style="font-size:26px;font-weight:700;color:#c9d1d9;">KL Divergence: From Formula to Intuition</div>';
root.appendChild(header);

// ── Part A card ───────────────────────────────────────────────────────────────
const cardA = document.createElement('div');
cardA.id = 'cardA';
cardA.style.cssText = 'opacity:0;width:100%;max-width:760px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;box-sizing:border-box;';
root.appendChild(cardA);

const aTitle = document.createElement('div');
aTitle.style.cssText = 'font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#3B82F6;margin-bottom:14px;';
aTitle.textContent = 'Part A — Compute KL(P ‖ Q)';
cardA.appendChild(aTitle);

const aSetup = document.createElement('div');
aSetup.style.cssText = 'color:#8b949e;font-size:14px;margin-bottom:12px;';
aSetup.textContent = 'Given P = N(0, 1)  and  Q = N(1, 2), compute KL(P ‖ Q).';
cardA.appendChild(aSetup);

const formulaDiv = document.createElement('div');
formulaDiv.id = 'formula-display';
formulaDiv.style.cssText = 'margin:14px 0;padding:14px 20px;background:#0d1117;border-radius:8px;border-left:3px solid #3B82F6;font-size:15px;';
katex.render('\\mathrm{KL}(P\\|Q) = \\log\\frac{\\sigma_2}{\\sigma_1} + \\frac{\\sigma_1^2 + (\\mu_1-\\mu_2)^2}{2\\sigma_2^2} - \\frac{1}{2}', formulaDiv, {throwOnError:false, displayMode:true});
cardA.appendChild(formulaDiv);

const aInputRow = document.createElement('div');
aInputRow.style.cssText = 'display:flex;align-items:center;gap:12px;margin-top:8px;';
const aLabel = document.createElement('label');
aLabel.style.cssText = 'color:#c9d1d9;font-size:14px;white-space:nowrap;';
aLabel.textContent = 'Your answer (2 d.p.):';
const aInput = document.createElement('input');
aInput.id = 'inputA';
aInput.type = 'number';
aInput.step = '0.01';
aInput.placeholder = '0.00';
aInput.style.cssText = 'background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#c9d1d9;font-size:14px;width:120px;outline:none;';
const checkBtnA = document.createElement('button');
checkBtnA.id = 'checkA';
checkBtnA.textContent = 'Check';
checkBtnA.style.cssText = 'background:#3B82F6;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:14px;cursor:pointer;';
const aFeedback = document.createElement('span');
aFeedback.id = 'feedbackA';
aFeedback.style.cssText = 'font-size:13px;';
aInputRow.appendChild(aLabel); aInputRow.appendChild(aInput); aInputRow.appendChild(checkBtnA); aInputRow.appendChild(aFeedback);
cardA.appendChild(aInputRow);

// ── Part B card ───────────────────────────────────────────────────────────────
const cardB = document.createElement('div');
cardB.id = 'cardB';
cardB.style.cssText = 'opacity:0;width:100%;max-width:760px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;box-sizing:border-box;';
root.appendChild(cardB);

const bTitle = document.createElement('div');
bTitle.style.cssText = 'font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B5CF6;margin-bottom:12px;';
bTitle.textContent = 'Part B — VAE Intuition';
cardB.appendChild(bTitle);

const bQuestion = document.createElement('div');
bQuestion.style.cssText = 'color:#c9d1d9;font-size:14px;line-height:1.6;margin-bottom:14px;';
bQuestion.innerHTML = 'In a VAE, if we minimise KL(Q(z|x) ‖ P(z)) where P(z)=N(0,1),<br>what happens to Q(z|x) as training progresses?<br><span style="color:#8b949e;font-style:italic;">Explain WHY this is desirable for generation.</span>';
cardB.appendChild(bQuestion);

const bTextarea = document.createElement('textarea');
bTextarea.id = 'inputB';
bTextarea.placeholder = 'Type your explanation here…';
bTextarea.style.cssText = 'width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 14px;color:#c9d1d9;font-size:13px;resize:vertical;min-height:70px;box-sizing:border-box;outline:none;font-family:inherit;';
cardB.appendChild(bTextarea);

const revealRow = document.createElement('div');
revealRow.style.cssText = 'margin-top:12px;display:flex;justify-content:flex-end;';
const revealBtn = document.createElement('button');
revealBtn.id = 'revealBtn';
revealBtn.textContent = 'Show Solutions';
revealBtn.style.cssText = 'background:#8B5CF6;color:#fff;border:none;border-radius:6px;padding:9px 22px;font-size:14px;cursor:pointer;';
revealRow.appendChild(revealBtn);
cardB.appendChild(revealRow);

// ── Solution A panel ──────────────────────────────────────────────────────────
const solA = document.createElement('div');
solA.id = 'solA';
solA.style.cssText = 'opacity:0;pointer-events:none;width:100%;max-width:760px;background:#0f1e12;border:1px solid #22C55E44;border-radius:12px;padding:24px;box-sizing:border-box;';
root.appendChild(solA);

const solATitle = document.createElement('div');
solATitle.style.cssText = 'font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#22C55E;margin-bottom:16px;';
solATitle.textContent = 'Solution — Part A';
solA.appendChild(solATitle);

const steps = [
  {label:'Identify parameters', latex:'\\mu_1=0,\\;\\sigma_1=1,\\;\\mu_2=1,\\;\\sigma_2=2'},
  {label:'Substitute into formula', latex:'\\log\\frac{2}{1}+\\frac{1^2+(0-1)^2}{2\\cdot 2^2}-\\frac{1}{2}'},
  {label:'Simplify numerator', latex:'\\ln 2+\\frac{1+1}{8}-0.5'},
  {label:'Evaluate', latex:'0.6931+0.25-0.5 = \\boxed{0.4431}'},
];

const stepEls = steps.map((s, i) => {
  const row = document.createElement('div');
  row.id = `stepRow${i}`;
  row.style.cssText = 'opacity:0;display:flex;align-items:center;gap:14px;margin-bottom:14px;';
  const badge = document.createElement('div');
  badge.style.cssText = `width:24px;height:24px;border-radius:50%;background:#22C55E22;border:1px solid #22C55E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#22C55E;flex-shrink:0;`;
  badge.textContent = i+1;
  const content = document.createElement('div');
  content.style.cssText = 'flex:1;';
  const lbl = document.createElement('div');
  lbl.style.cssText = 'font-size:12px;color:#8b949e;margin-bottom:4px;';
  lbl.textContent = s.label;
  const eq = document.createElement('div');
  eq.style.cssText = 'color:#c9d1d9;';
  katex.render(s.latex, eq, {throwOnError:false, displayMode:false});
  content.appendChild(lbl); content.appendChild(eq);
  row.appendChild(badge); row.appendChild(content);
  solA.appendChild(row);
  return row;
});

// ── Solution B panel + D3 collapse visual ─────────────────────────────────────
const solB = document.createElement('div');
solB.id = 'solB';
solB.style.cssText = 'opacity:0;pointer-events:none;width:100%;max-width:760px;background:#120d1e;border:1px solid #8B5CF644;border-radius:12px;padding:24px;box-sizing:border-box;';
root.appendChild(solB);

const solBTitle = document.createElement('div');
solBTitle.style.cssText = 'font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B5CF6;margin-bottom:14px;';
solBTitle.textContent = 'Solution — Part B';
solB.appendChild(solBTitle);

const solBText = document.createElement('div');
solBText.style.cssText = 'color:#c9d1d9;font-size:14px;line-height:1.7;margin-bottom:18px;';
solBText.innerHTML = 'As training minimises KL(Q(z|x)‖P(z)), the encoder posterior <span style="color:#8B5CF6;font-weight:600;">Q(z|x)</span> is pushed toward the standard normal prior <span style="color:#3B82F6;font-weight:600;">P(z)=N(0,1)</span>.<br><br><strong style="color:#F59E0B;">Why desirable?</strong> At generation time we sample z~P(z) directly — no encoder needed. If Q≈P, samples from the prior produce realistic reconstructions.';
solB.appendChild(solBText);

const svgWrap = document.createElement('div');
svgWrap.id = 'collapseViz';
svgWrap.style.cssText = 'opacity:0;';
solB.appendChild(svgWrap);

// D3 collapse visual
const W = 700, H = 180, margin = {top:20, right:20, bottom:36, left:44};
const svgEl = d3.select(svgWrap).append('svg')
  .attr('width','100%').attr('viewBox',`0 0 ${W} ${H}`)
  .style('overflow','visible');

const gViz = svgEl.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
const vW = W-margin.left-margin.right, vH = H-margin.top-margin.bottom;

const xScale = d3.scaleLinear().domain([-5,5]).range([0,vW]);
const yScale = d3.scaleLinear().domain([0,0.65]).range([vH,0]);

function gaussian(x, mu, sigma) {
  return (1/(sigma*Math.sqrt(2*Math.PI)))*Math.exp(-0.5*((x-mu)/sigma)**2);
}

const xs = d3.range(-5,5.05,0.05);

// Prior P(z) — static blue
const priorLine = d3.line().x(d=>xScale(d)).y(d=>yScale(gaussian(d,0,1))).curve(d3.curveCatmullRom);
gViz.append('path').datum(xs).attr('d',priorLine).attr('fill','none').attr('stroke','#3B82F6').attr('stroke-width',2.5).attr('opacity',0.9);

// Q(z|x) — animated — starts wide (mu=2, sigma=2), collapses to (0,1)
const qPath = gViz.append('path').attr('fill','none').attr('stroke','#8B5CF6').attr('stroke-width',2).attr('stroke-dasharray','5,3').attr('opacity',0.9);

function updateQ(mu, sigma) {
  const qLine = d3.line().x(d=>xScale(d)).y(d=>yScale(gaussian(d,mu,sigma))).curve(d3.curveCatmullRom);
  qPath.attr('d', qLine(xs));
}
updateQ(2.5, 2);

// Axes
gViz.append('g').attr('transform',`translate(0,${vH})`).call(d3.axisBottom(xScale).ticks(5).tickFormat(d=>d+'σ')).call(g=>{g.selectAll('text').style('fill','#8b949e').style('font-size','11px'); g.select('.domain').style('stroke','#30363d'); g.selectAll('.tick line').style('stroke','#30363d');});
gViz.append('g').call(d3.axisLeft(yScale).ticks(3).tickFormat(d=>d.toFixed(2))).call(g=>{g.selectAll('text').style('fill','#8b949e').style('font-size','11px'); g.select('.domain').style('stroke','#30363d'); g.selectAll('.tick line').style('stroke','#30363d');});

// Legend
const legend = svgEl.append('g').attr('transform',`translate(${W-margin.right-160},${margin.top+4})`);
legend.append('line').attr('x1',0).attr('x2',28).attr('y1',0).attr('y2',0).attr('stroke','#3B82F6').attr('stroke-width',2.5);
legend.append('text').attr('x',34).attr('y',4).text('P(z) = N(0,1)').attr('fill','#3B82F6').style('font-size','12px');
legend.append('line').attr('x1',0).attr('x2',28).attr('y1',20).attr('y2',20).attr('stroke','#8B5CF6').attr('stroke-width',2).attr('stroke-dasharray','5,3');
legend.append('text').attr('x',34).attr('y',24).text('Q(z|x) encoder').attr('fill','#8B5CF6').style('font-size','12px');

// Progress label
const progressLabel = gViz.append('text').attr('x',vW/2).attr('y',-4).attr('text-anchor','middle').style('fill','#F59E0B').style('font-size','12px').text('Training: 0%');

// ── Check Part A answer ────────────────────────────────────────────────────────
const CORRECT_A = 0.4431;
checkBtnA.addEventListener('click', () => {
  const val = parseFloat(aInput.value);
  if (isNaN(val)) { aFeedback.textContent = 'Enter a number'; aFeedback.style.color='#EF4444'; return; }
  if (Math.abs(val - CORRECT_A) < 0.01) {
    aFeedback.innerHTML = '✓ Correct!'; aFeedback.style.color='#22C55E';
    gsap.to(cardA, {borderColor:'#22C55E44', duration:0.4});
  } else {
    aFeedback.innerHTML = `✗ Got ${val.toFixed(4)} — try again`; aFeedback.style.color='#EF4444';
  }
});

// ── Reveal button ──────────────────────────────────────────────────────────────
revealBtn.addEventListener('click', () => {
  tl.seek('solution-a');

tl.pause(); tl.seek(0);
});

// ── GSAP TIMELINE ─────────────────────────────────────────────────────────────

tl.addLabel('intro');

// Step 1 — intro header
tl.to(header, {opacity:1, y:0, duration:0.8, ease:'power2.out'}, 'intro');

tl.addLabel('challenge', '+=0.4');

// Step 2 — cards appear
tl.to(cardA, {opacity:1, y:0, duration:0.7, ease:'power2.out'}, 'challenge');
tl.to(cardB, {opacity:1, y:0, duration:0.7, ease:'power2.out'}, 'challenge+=0.3');

tl.addLabel('solution-a', '+=1.5');

// Step 3 — Solution A panel reveals
tl.to(solA, {opacity:1, duration:0.5, ease:'power2.out'}, 'solution-a');
tl.set(solA, {pointerEvents:'auto'}, 'solution-a');

// Animate step rows one by one
stepEls.forEach((el, i) => {
  tl.to(el, {opacity:1, x:0, duration:0.45, ease:'power2.out'}, `solution-a+=${0.2 + i*0.35}`);
});

tl.addLabel('solution-b', `solution-a+=${0.2 + stepEls.length*0.35 + 0.5}`);

// Step 4 — Solution B panel reveals
tl.to(solB, {opacity:1, duration:0.5, ease:'power2.out'}, 'solution-b');
tl.set(solB, {pointerEvents:'auto'}, 'solution-b');
tl.to(solBText, {opacity:1, duration:0.4}, 'solution-b+=0.2');

// Collapse visual appears
tl.to(svgWrap, {opacity:1, duration:0.5}, 'solution-b+=0.5');

// D3 animated collapse: Q from N(2.5,2) → N(0,1) over ~3 seconds
const qState = {mu:2.5, sigma:2.0, pct:0};
tl.to(qState, {
  mu: 0,
  sigma: 1,
  pct: 100,
  duration: 3.5,
  ease: 'power1.inOut',
  onUpdate: () => {
    updateQ(qState.mu, qState.sigma);
    progressLabel.text(`Training: ${Math.round(qState.pct)}%`);
  },
  onComplete: () => {
    progressLabel.text('Training: 100% — Q ≈ P ✓');
    gsap.to(progressLabel.node(), {fill:'#22C55E', duration:0.4});
  }
}, 'solution-b+=0.8');

// Play intro automatically
tl.play('intro');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
