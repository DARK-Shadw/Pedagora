<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two overlapping distribution curves on the same axis. Curve </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.cssText = 'background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden;position:relative;';

// --- SVG setup ---
const W = Math.min(window.innerWidth * 0.9, 820);
const H = 340;
const margin = { top: 30, right: 30, bottom: 50, left: 50 };
const innerW = W - margin.left - margin.right;
const innerH = H - margin.top - margin.bottom;

const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svgEl.setAttribute('width', W);
svgEl.setAttribute('height', H);
svgEl.style.cssText = 'display:block;opacity:0;margin-bottom:20px;';
container.appendChild(svgEl);

const svg = d3.select(svgEl);
const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

// --- Scales ---
const xScale = d3.scaleLinear().domain([-4, 6]).range([0, innerW]);
const yScale = d3.scaleLinear().domain([0, 0.45]).range([innerH, 0]);

// --- Gaussian PDF ---
function gaussian(x, mu, sigma) {
  return (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
}

function makePath(mu, sigma, numPoints = 200) {
  const xs = d3.range(-4, 6.01, 10 / numPoints);
  return d3.line()
    .x(d => xScale(d))
    .y(d => yScale(gaussian(d, mu, sigma)))
    .curve(d3.curveBasis)(xs);
}

// --- Axes ---
g.append('g')
  .attr('transform', `translate(0,${innerH})`)
  .call(d3.axisBottom(xScale).ticks(10).tickSize(-4))
  .call(ax => {
    ax.select('.domain').attr('stroke', '#555');
    ax.selectAll('.tick line').attr('stroke', '#555');
    ax.selectAll('.tick text').attr('fill', '#888').attr('font-size', '11px');
  });

g.append('g')
  .call(d3.axisLeft(yScale).ticks(5).tickSize(-4))
  .call(ax => {
    ax.select('.domain').attr('stroke', '#555');
    ax.selectAll('.tick line').attr('stroke', '#555');
    ax.selectAll('.tick text').attr('fill', '#888').attr('font-size', '11px');
  });

// Axis labels
g.append('text').attr('x', innerW / 2).attr('y', innerH + 40).attr('fill', '#888').attr('text-anchor', 'middle').attr('font-size', '12px').text('x');
g.append('text').attr('transform', 'rotate(-90)').attr('x', -innerH / 2).attr('y', -38).attr('fill', '#888').attr('text-anchor', 'middle').attr('font-size', '12px').text('p(x)');

// --- Mismatch fill area (clipped) ---
const defs = svg.append('defs');

// Build area generator for shaded region
function makeAreaPath(muP, sigP, muQ, sigQ) {
  const xs = d3.range(-4, 6.01, 10 / 400);
  const pts = xs.map(x => ({
    x,
    top: Math.max(gaussian(x, muP, sigP), gaussian(x, muQ, sigQ)),
    bottom: Math.min(gaussian(x, muP, sigP), gaussian(x, muQ, sigQ))
  }));
  return pts;
}

const mismatchGroup = g.append('g').attr('class', 'mismatch').style('opacity', 0);

function drawMismatch(muQ, sigQ) {
  mismatchGroup.selectAll('*').remove();
  const pts = makeAreaPath(0, 1, muQ, sigQ);
  const areaGen = d3.area()
    .x(d => xScale(d.x))
    .y0(d => yScale(d.bottom))
    .y1(d => yScale(d.top))
    .curve(d3.curveBasis);
  mismatchGroup.append('path')
    .datum(pts)
    .attr('d', areaGen)
    .attr('fill', '#EF4444')
    .attr('opacity', 0.35);
}

drawMismatch(2, 1.5);

// --- Curve P (blue, fixed) ---
const pathP = g.append('path')
  .attr('d', makePath(0, 1))
  .attr('fill', 'none')
  .attr('stroke', '#3B82F6')
  .attr('stroke-width', 2.8)
  .attr('opacity', 0);

// Label P
const labelP = g.append('text')
  .attr('x', xScale(-0.05))
  .attr('y', yScale(0.41))
  .attr('fill', '#3B82F6')
  .attr('font-size', '15px')
  .attr('font-weight', '700')
  .attr('opacity', 0)
  .text('P  (μ=0, σ=1)');

// --- Curve Q (orange, animated) ---
let curMuQ = 2, curSigQ = 1.5;

const pathQ = g.append('path')
  .attr('d', makePath(curMuQ, curSigQ))
  .attr('fill', 'none')
  .attr('stroke', '#F59E0B')
  .attr('stroke-width', 2.8)
  .attr('opacity', 0);

const labelQ = g.append('text')
  .attr('x', xScale(2.1))
  .attr('y', yScale(0.272))
  .attr('fill', '#F59E0B')
  .attr('font-size', '15px')
  .attr('font-weight', '700')
  .attr('opacity', 0)
  .text('Q  (μ=2, σ=1.5)');

// --- Quiz card ---
const quiz = document.createElement('div');
quiz.style.cssText = `
  background:#161b22;border:1px solid #30363d;border-radius:12px;
  padding:20px 28px;max-width:680px;width:90%;opacity:0;
  font-family:'Inter',sans-serif;color:#c9d1d9;
`;
quiz.innerHTML = `
  <div style="font-size:15px;font-weight:600;margin-bottom:14px;color:#e6edf3;">
    Aswin, which of these statements is <em>true</em>?
  </div>
  <div class="opt" data-id="A" style="margin:8px 0;padding:9px 14px;border-radius:8px;border:1px solid #30363d;cursor:pointer;transition:background 0.2s;">
    <span style="color:#8B5CF6;font-weight:700;">A</span>&nbsp;&nbsp;P and Q represent the same distribution, just shifted.
  </div>
  <div class="opt" data-id="B" style="margin:8px 0;padding:9px 14px;border-radius:8px;border:1px solid #30363d;cursor:pointer;transition:background 0.2s;">
    <span style="color:#8B5CF6;font-weight:700;">B</span>&nbsp;&nbsp;To make Q match P we need to both <em>shift</em> AND <em>squeeze</em> it.
  </div>
  <div class="opt" data-id="C" style="margin:8px 0;padding:9px 14px;border-radius:8px;border:1px solid #30363d;cursor:pointer;transition:background 0.2s;">
    <span style="color:#8B5CF6;font-weight:700;">C</span>&nbsp;&nbsp;The area between the curves IS the KL divergence.
  </div>
`;
container.appendChild(quiz);

// Hover states
quiz.querySelectorAll('.opt').forEach(opt => {
  opt.addEventListener('mouseenter', () => { if (!opt.dataset.locked) opt.style.background = '#1f2937'; });
  opt.addEventListener('mouseleave', () => { if (!opt.dataset.locked) opt.style.background = ''; });
});

// --- Answer feedback ---
const feedback = document.createElement('div');
feedback.style.cssText = `
  font-family:'Inter',sans-serif;color:#22C55E;font-size:14px;font-weight:600;
  margin-top:10px;opacity:0;text-align:center;max-width:680px;
`;
feedback.textContent = '✓ Correct! Q has a larger σ, so you must shift it left (Δμ = −2) AND scale σ from 1.5 → 1 to match P.';
container.appendChild(feedback);

// --- KaTeX annotation ---
const katexDiv = document.createElement('div');
katexDiv.style.cssText = 'opacity:0;margin-top:6px;font-size:13px;color:#8B5CF6;text-align:center;';
container.appendChild(katexDiv);
katex.render('\\text{KL}(P\\|Q) = \\int p(x)\\ln\\frac{p(x)}{q(x)}\\,dx \\neq \\text{area between curves}', katexDiv, { throwOnError: false });

// ---- Animation proxy for Q curve ----
const qProxy = { mu: 2, sigma: 1.5 };

function updateQ() {
  const newPath = makePath(qProxy.mu, qProxy.sigma);
  pathQ.attr('d', newPath);
  const peak = gaussian(qProxy.mu, qProxy.sigma, qProxy.sigma); // at mu
  const peakY = yScale(1 / (qProxy.sigma * Math.sqrt(2 * Math.PI)));
  labelQ.attr('x', xScale(qProxy.mu + 0.15)).attr('y', peakY - 8);
  drawMismatch(qProxy.mu, qProxy.sigma);
}

// =========================================================
// GSAP TIMELINE
// =========================================================

// --- Step 1: Intro — curves appear ---
tl.addLabel('intro');

tl.to(svgEl, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 'intro');
tl.to(pathP.node(), { opacity: 1, duration: 1, ease: 'power2.out' }, 'intro+=0.3');
tl.to(labelP.node(), { opacity: 1, duration: 0.6 }, 'intro+=1');
tl.to(pathQ.node(), { opacity: 1, duration: 1, ease: 'power2.out' }, 'intro+=0.8');
tl.to(labelQ.node(), { opacity: 1, duration: 0.6 }, 'intro+=1.5');

// Mismatch area fades in softly
tl.to(mismatchGroup.node(), { opacity: 1, duration: 1.2, ease: 'power2.inOut' }, 'intro+=1.8');

// --- Step 2: Question appears ---
tl.addLabel('question', 'intro+=3');

tl.to(quiz, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 'question');

// Wire up click handler — only active after question step
let answered = false;
quiz.querySelectorAll('.opt').forEach(opt => {
  opt.addEventListener('click', () => {
    if (answered) return;
    answered = true;
    const id = opt.dataset.id;
    quiz.querySelectorAll('.opt').forEach(o => {
      o.style.cursor = 'default';
      o.dataset.locked = 'true';
      if (o.dataset.id === 'B') {
        o.style.background = 'rgba(34,197,94,0.15)';
        o.style.borderColor = '#22C55E';
      } else if (o.dataset.id === id && id !== 'B') {
        o.style.background = 'rgba(239,68,68,0.12)';
        o.style.borderColor = '#EF4444';
      }
    });
    // Jump to reveal step
    tl.play('reveal');
  });
});

// --- Step 3: Reveal — correct answer, animate Q ---
tl.addLabel('reveal', 'question+=60'); // long pause waiting for interaction; seek via click

tl.to(feedback, { opacity: 1, duration: 0.5 }, 'reveal');
tl.to(katexDiv, { opacity: 1, duration: 0.5 }, 'reveal+=0.4');

// Animate Q: shift mu 2→0, sigma 1.5→1
tl.to(qProxy, {
  mu: 0,
  sigma: 1,
  duration: 3.5,
  ease: 'power2.inOut',
  onUpdate: updateQ
}, 'reveal+=0.8');

// Fade mismatch to red glow as it shrinks, then nearly zero
tl.to(mismatchGroup.node(), {
  opacity: 0.15,
  duration: 3.5,
  ease: 'power2.inOut'
}, 'reveal+=0.8');

// Pulse red glow on remaining mismatch after animation
tl.to(mismatchGroup.node(), {
  opacity: 0.5,
  duration: 0.4,
  yoyo: true,
  repeat: 3,
  ease: 'power1.inOut'
}, 'reveal+=4.4');

// Update label Q text after transform
tl.call(() => {
  labelQ.text('Q  (μ=0, σ=1) → matched!').attr('fill', '#22C55E');
}, [], 'reveal+=4.3');

tl.to(labelQ.node(), { opacity: 1, duration: 0.5 }, 'reveal+=4.3');

// Pause at end
tl.addLabel('end', 'reveal+=6');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
