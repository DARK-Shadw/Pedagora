<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Left side: a 3D surface plot of a simple spherical Gaussian </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
(()=>{
const container = document.getElementById('canvas-container');
  container.style.position = 'relative';
  container.style.overflow = 'hidden';
  container.style.background = '#0d1117';

  // ── Layout ──────────────────────────────────────────────────────────────────
  const wrapper = document.createElement('div');
  wrapper.style.cssText = `
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px; box-sizing:border-box;
  `;
  container.appendChild(wrapper);

  // Title
  const title = document.createElement('div');
  title.textContent = 'Simple noise → Complex reality';
  title.style.cssText = `
    font-family:'Inter',sans-serif; font-size:clamp(16px,2.2vw,28px);
    font-weight:700; color:#c9d1d9; letter-spacing:0.04em;
    margin-bottom:18px; opacity:0; text-align:center;
  `;
  wrapper.appendChild(title);

  // Panels row
  const row = document.createElement('div');
  row.style.cssText = `
    display:flex; flex-direction:row; align-items:center;
    gap:0; width:100%; max-width:1100px;
    flex:1; min-height:0;
  `;
  wrapper.appendChild(row);

  // ── Helper: create a panel ───────────────────────────────────────────────────
  function makePanel(label, color) {
    const panel = document.createElement('div');
    panel.style.cssText = `
      flex:1; min-width:0; height:100%; max-height:420px;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      opacity:0;
    `;

    const lbl = document.createElement('div');
    lbl.textContent = label;
    lbl.style.cssText = `
      font-family:'Inter',sans-serif; font-size:clamp(11px,1.2vw,15px);
      font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
      color:${color}; margin-bottom:8px; opacity:0.85;
    `;
    panel.appendChild(lbl);

    const svgWrap = document.createElement('div');
    svgWrap.style.cssText = `width:100%; flex:1; min-height:0; position:relative;`;
    panel.appendChild(svgWrap);

    return { panel, svgWrap };
  }

  const { panel: leftPanel, svgWrap: leftSvg } = makePanel('Gaussian Noise Prior', '#3B82F6');
  const { panel: rightPanel, svgWrap: rightSvg } = makePanel('Real Video Frame Distribution', '#F97316');

  // ── Arrow bridge ─────────────────────────────────────────────────────────────
  const arrowCol = document.createElement('div');
  arrowCol.style.cssText = `
    flex:0 0 140px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; position:relative; opacity:0;
  `;

  const arrowLabel = document.createElement('div');
  arrowLabel.style.cssText = `
    font-family:'Inter',sans-serif; font-size:clamp(10px,1.1vw,13px);
    font-weight:700; color:#8B5CF6; text-align:center; letter-spacing:0.05em;
    margin-bottom:10px; padding:4px 10px;
    border:1.5px solid rgba(139,92,246,0.5); border-radius:6px;
    background:rgba(139,92,246,0.08);
  `;
  arrowLabel.textContent = 'YOUR MODEL';

  const arrowSvgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  arrowSvgEl.setAttribute('width', '120');
  arrowSvgEl.setAttribute('height', '60');
  arrowSvgEl.setAttribute('viewBox', '0 0 120 60');
  arrowSvgEl.style.overflow = 'visible';

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  grad.setAttribute('id', 'arrowGrad');
  grad.setAttribute('x1', '0%'); grad.setAttribute('y1', '0%');
  grad.setAttribute('x2', '100%'); grad.setAttribute('y2', '0%');
  const s1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
  s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#3B82F6');
  const s2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
  s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', '#F97316');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);

  const glowFilter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
  glowFilter.setAttribute('id', 'arrowGlow');
  const feBlur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
  feBlur.setAttribute('stdDeviation', '3'); feBlur.setAttribute('result', 'blur');
  const feMerge = document.createElementNS('http://www.w3.org/2000/svg', 'feMerge');
  const n1 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
  n1.setAttribute('in', 'blur');
  const n2 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
  n2.setAttribute('in', 'SourceGraphic');
  feMerge.appendChild(n1); feMerge.appendChild(n2);
  glowFilter.appendChild(feBlur); glowFilter.appendChild(feMerge);
  defs.appendChild(glowFilter);
  arrowSvgEl.appendChild(defs);

  const arrowMarker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  arrowMarker.setAttribute('id', 'arrowHead');
  arrowMarker.setAttribute('markerWidth', '8'); arrowMarker.setAttribute('markerHeight', '8');
  arrowMarker.setAttribute('refX', '6'); arrowMarker.setAttribute('refY', '3');
  arrowMarker.setAttribute('orient', 'auto');
  const arrowPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  arrowPoly.setAttribute('points', '0 0, 8 3, 0 6');
  arrowPoly.setAttribute('fill', '#F97316');
  arrowMarker.appendChild(arrowPoly); defs.appendChild(arrowMarker);

  const arrowLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  arrowLine.setAttribute('x1', '5'); arrowLine.setAttribute('y1', '30');
  arrowLine.setAttribute('x2', '105'); arrowLine.setAttribute('y2', '30');
  arrowLine.setAttribute('stroke', 'url(#arrowGrad)');
  arrowLine.setAttribute('stroke-width', '3');
  arrowLine.setAttribute('marker-end', 'url(#arrowHead)');
  arrowLine.setAttribute('filter', 'url(#arrowGlow)');
  const arrowLen = 100;
  arrowLine.style.strokeDasharray = arrowLen;
  arrowLine.style.strokeDashoffset = arrowLen;
  arrowSvgEl.appendChild(arrowLine);

  arrowCol.appendChild(arrowLabel);
  arrowCol.appendChild(arrowSvgEl);

  // Particle canvas for the arrow
  const particleCanvas = document.createElement('canvas');
  particleCanvas.width = 120; particleCanvas.height = 60;
  particleCanvas.style.cssText = `
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) translateY(10px);
    pointer-events:none;
  `;
  arrowCol.style.position = 'relative';
  arrowCol.appendChild(particleCanvas);

  row.appendChild(leftPanel);
  row.appendChild(arrowCol);
  row.appendChild(rightPanel);

  // ── D3 SVG: Simple Gaussian (left) ──────────────────────────────────────────
  const W = 380, H = 320;
  const svgL = d3.select(leftSvg).append('svg')
    .attr('width', '100%').attr('height', '100%')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .style('overflow', 'visible');

  const marginL = { top: 20, right: 20, bottom: 40, left: 40 };
  const innerW = W - marginL.left - marginL.right;
  const innerH = H - marginL.top - marginL.bottom;

  const gL = svgL.append('g').attr('transform', `translate(${marginL.left},${marginL.top})`);

  const xScaleL = d3.scaleLinear().domain([-3.5, 3.5]).range([0, innerW]);
  const yScaleL = d3.scaleLinear().domain([0, 0.45]).range([innerH, 0]);

  // Grid
  gL.append('g').attr('class', 'grid').call(
    d3.axisLeft(yScaleL).ticks(4).tickSize(-innerW).tickFormat('')
  ).selectAll('line').style('stroke', 'rgba(255,255,255,0.06)').style('stroke-dasharray', '4,4');
  gL.select('.grid .domain').remove();

  gL.append('g').attr('class', 'grid2').call(
    d3.axisBottom(xScaleL).ticks(6).tickSize(-innerH).tickFormat('')
  ).attr('transform', `translate(0,${innerH})`)
    .selectAll('line').style('stroke', 'rgba(255,255,255,0.06)').style('stroke-dasharray', '4,4');
  gL.select('.grid2 .domain').remove();

  // Axes
  gL.append('g').attr('transform', `translate(0,${innerH})`)
    .call(d3.axisBottom(xScaleL).ticks(5))
    .selectAll('text, line, path').style('stroke', '#4b5563').style('fill', '#9ca3af').style('font-size', '11px');

  gL.append('g').call(d3.axisLeft(yScaleL).ticks(4))
    .selectAll('text, line, path').style('stroke', '#4b5563').style('fill', '#9ca3af').style('font-size', '11px');

  // Gaussian PDF
  const gaussian = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
  const lineGenL = d3.line()
    .x(d => xScaleL(d))
    .y(d => yScaleL(gaussian(d)))
    .curve(d3.curveCatmullRom);

  const xData = d3.range(-3.5, 3.51, 0.05);

  // Filled area
  const areaGenL = d3.area()
    .x(d => xScaleL(d))
    .y0(innerH)
    .y1(d => yScaleL(gaussian(d)))
    .curve(d3.curveCatmullRom);

  const areaPathL = gL.append('path')
    .datum(xData)
    .attr('d', areaGenL)
    .attr('fill', 'rgba(59,130,246,0.15)')
    .attr('opacity', 0);

  const curvePathL = gL.append('path')
    .datum(xData)
    .attr('d', lineGenL)
    .attr('fill', 'none')
    .attr('stroke', '#3B82F6')
    .attr('stroke-width', 3)
    .attr('filter', 'drop-shadow(0 0 6px #3B82F6)')
    .attr('opacity', 0);

  const curveLenL = curvePathL.node().getTotalLength();
  curvePathL.style('stroke-dasharray', curveLenL).style('stroke-dashoffset', curveLenL);

  // Mean line
  const meanLine = gL.append('line')
    .attr('x1', xScaleL(0)).attr('x2', xScaleL(0))
    .attr('y1', innerH).attr('y2', yScaleL(gaussian(0)))
    .attr('stroke', '#F59E0B').attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '5,4').attr('opacity', 0);

  // Label μ=0
  const meanLabel = gL.append('text')
    .attr('x', xScaleL(0) + 6).attr('y', yScaleL(gaussian(0)) + 14)
    .text('μ=0, σ=1').attr('fill', '#F59E0B')
    .attr('font-size', '11px').attr('font-family', 'Inter, sans-serif')
    .attr('opacity', 0);

  // σ bracket
  const sigmaGroup = gL.append('g').attr('opacity', 0);
  sigmaGroup.append('line')
    .attr('x1', xScaleL(0)).attr('x2', xScaleL(1))
    .attr('y1', yScaleL(0.24)).attr('y2', yScaleL(0.24))
    .attr('stroke', '#22C55E').attr('stroke-width', 1.5)
    .attr('marker-end', 'url(#none)');
  sigmaGroup.append('text')
    .attr('x', xScaleL(0.5)).attr('y', yScaleL(0.24) - 6)
    .text('σ').attr('fill', '#22C55E')
    .attr('font-size', '12px').attr('text-anchor', 'middle').attr('font-family', 'Inter, sans-serif');

  // ── D3 SVG: Complex multi-modal (right) ─────────────────────────────────────
  const svgR = d3.select(rightSvg).append('svg')
    .attr('width', '100%').attr('height', '100%')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .style('overflow', 'visible');

  const gR = svgR.append('g').attr('transform', `translate(${marginL.left},${marginL.top})`);

  const xScaleR = d3.scaleLinear().domain([0, 10]).range([0, innerW]);
  const yScaleR = d3.scaleLinear().domain([0, 1.0]).range([innerH, 0]);

  gR.append('g').attr('class', 'grid').call(
    d3.axisLeft(yScaleR).ticks(4).tickSize(-innerW).tickFormat('')
  ).selectAll('line').style('stroke', 'rgba(255,255,255,0.06)').style('stroke-dasharray', '4,4');
  gR.select('.grid .domain').remove();

  gR.append('g').call(d3.axisBottom(xScaleR).ticks(5))
    .attr('transform', `translate(0,${innerH})`)
    .selectAll('text, line, path').style('stroke', '#4b5563').style('fill', '#9ca3af').style('font-size', '11px');

  gR.append('g').call(d3.axisLeft(yScaleR).ticks(4))
    .selectAll('text, line, path').style('stroke', '#4b5563').style('fill', '#9ca3af').style('font-size', '11px');

  // Multi-modal: sum of Gaussians
  const peaks = [
    { mu: 1.0, sig: 0.3, a: 0.55 },
    { mu: 2.1, sig: 0.2, a: 0.40 },
    { mu: 3.4, sig: 0.4, a: 0.70 },
    { mu: 4.2, sig: 0.18, a: 0.45 },
    { mu: 5.0, sig: 0.5, a: 0.90 },
    { mu: 5.8, sig: 0.22, a: 0.50 },
    { mu: 6.7, sig: 0.35, a: 0.65 },
    { mu: 7.5, sig: 0.25, a: 0.42 },
    { mu: 8.3, sig: 0.4,  a: 0.75 },
    { mu: 9.1, sig: 0.28, a: 0.38 },
  ];

  function multiModal(x) {
    return peaks.reduce((s, p) => s + p.a * Math.exp(-0.5 * Math.pow((x - p.mu) / p.sig, 2)), 0);
  }

  const xDataR = d3.range(0, 10.05, 0.04);

  const colorScaleR = d3.scaleLinear()
    .domain([0, 0.5, 1.0])
    .range(['#7c3aed', '#F97316', '#EF4444']);

  // Build area with gradient fill — draw as filled path
  const areaGenR = d3.area()
    .x(d => xScaleR(d))
    .y0(innerH)
    .y1(d => yScaleR(multiModal(d)))
    .curve(d3.curveCatmullRom);

  // Gradient def for right
  const defsR = svgR.append('defs');
  const lgR = defsR.append('linearGradient').attr('id', 'rightGrad')
    .attr('x1', '0%').attr('y1', '0%').attr('x2', '100%').attr('y2', '0%');
  lgR.append('stop').attr('offset', '0%').attr('stop-color', '#7c3aed').attr('stop-opacity', 0.7);
  lgR.append('stop').attr('offset', '50%').attr('stop-color', '#F97316').attr('stop-opacity', 0.6);
  lgR.append('stop').attr('offset', '100%').attr('stop-color', '#EF4444').attr('stop-opacity', 0.7);

  const areaPathR = gR.append('path')
    .datum(xDataR)
    .attr('d', areaGenR)
    .attr('fill', 'url(#rightGrad)')
    .attr('opacity', 0);

  const lineGenR = d3.line()
    .x(d => xScaleR(d))
    .y(d => yScaleR(multiModal(d)))
    .curve(d3.curveCatmullRom);

  const curvePathR = gR.append('path')
    .datum(xDataR)
    .attr('d', lineGenR)
    .attr('fill', 'none')
    .attr('stroke', '#F97316')
    .attr('stroke-width', 2.5)
    .attr('filter', 'drop-shadow(0 0 5px #F97316)')
    .attr('opacity', 0);

  const curveLenR = curvePathR.node().getTotalLength();
  curvePathR.style('stroke-dasharray', curveLenR).style('stroke-dashoffset', curveLenR);

  // Peak labels (dots)
  const peakDots = gR.selectAll('.pkdot').data(peaks).enter()
    .append('circle')
    .attr('cx', d => xScaleR(d.mu))
    .attr('cy', d => yScaleR(d.a))
    .attr('r', 3)
    .attr('fill', '#F59E0B')
    .attr('opacity', 0);

  // ── Particle system ───────────────────────────────────────────────────────────
  const pCtx = particleCanvas.getContext('2d');
  const particles = [];
  let particlesActive = false;

  function spawnParticle() {
    particles.push({ x: 5, y: 30, vx: 0.8 + Math.random() * 0.4, vy: (Math.random() - 0.5) * 0.6, life: 1.0 });
  }

  function animateParticles() {
    if (!particlesActive) return;
    pCtx.clearRect(0, 0, 120, 60);
    if (Math.random() < 0.35) spawnParticle();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.018;
      if (p.x > 112 || p.life <= 0) { particles.splice(i, 1); continue; }
      const t = p.x / 112;
      const r = Math.round(59 + (249 - 59) * t);
      const g2 = Math.round(130 + (115 - 130) * t);
      const b = Math.round(246 + (22 - 246) * t);
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      pCtx.fillStyle = `rgba(${r},${g2},${b},${p.life * 0.9})`;
      pCtx.shadowColor = `rgba(${r},${g2},${b},0.8)`;
      pCtx.shadowBlur = 5;
      pCtx.fill();
    }
    requestAnimationFrame(animateParticles);
  }

  // ── Build GSAP Timeline ──────────────────────────────────────────────────────

  // STEP 1: Intro — title + left panel appears, simple Gaussian draws in
  tl.addLabel('step-intro');

  tl.to(title, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 'step-intro');
  tl.to(leftPanel, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 'step-intro+=0.3');

  // Draw Gaussian curve
  tl.to(curvePathL.node(), {
    strokeDashoffset: 0, duration: 2.2, ease: 'power1.inOut',
    onStart: () => curvePathL.attr('opacity', 1)
  }, 'step-intro+=0.7');

  tl.to(areaPathL.node(), { opacity: 1, duration: 1.2, ease: 'power2.in' }, 'step-intro+=1.5');
  tl.to(meanLine.node(), { opacity: 1, duration: 0.5 }, 'step-intro+=2.5');
  tl.to(meanLabel.node(), { opacity: 1, duration: 0.5 }, 'step-intro+=2.8');
  tl.to(sigmaGroup.node(), { opacity: 1, duration: 0.5 }, 'step-intro+=3.1');

  // STEP 2: Bridge — arrow appears + particles start
  tl.addLabel('step-bridge', 'step-intro+=4');

  tl.to(arrowCol, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 'step-bridge');
  tl.to(arrowLine, {
    strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut'
  }, 'step-bridge+=0.4');

  tl.to({}, {
    duration: 0.1,
    onStart: () => {
      particlesActive = true;
      animateParticles();
    }
  }, 'step-bridge+=1.0');

  // Pulse glow on arrow label
  tl.to(arrowLabel, {
    boxShadow: '0 0 16px rgba(139,92,246,0.7)',
    duration: 0.6, ease: 'power2.inOut',
    yoyo: true, repeat: 3
  }, 'step-bridge+=0.5');

  // STEP 3: Right panel — complex distribution draws in
  tl.addLabel('step-complex', 'step-bridge+=3');

  tl.to(rightPanel, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 'step-complex');
  tl.to(curvePathR.node(), {
    strokeDashoffset: 0, duration: 2.8, ease: 'power1.inOut',
    onStart: () => curvePathR.attr('opacity', 1)
  }, 'step-complex+=0.4');

  tl.to(areaPathR.node(), { opacity: 1, duration: 1.4, ease: 'power2.in' }, 'step-complex+=1.2');

  // Stagger peak dots
  tl.to(peakDots.nodes(), {
    opacity: 0.9, duration: 0.25, stagger: 0.12, ease: 'back.out(1.5)'
  }, 'step-complex+=2.5');

  // STEP 4: Contrast — comparison highlight
  tl.addLabel('step-contrast', 'step-complex+=4');

  // Pulse left curve blue
  tl.to(curvePathL.node(), {
    attr: { 'stroke-width': 5 }, duration: 0.4, ease: 'power2.out',
    yoyo: true, repeat: 1
  }, 'step-contrast');

  // Pulse right curve orange
  tl.to(curvePathR.node(), {
    attr: { 'stroke-width': 5 }, duration: 0.4, ease: 'power2.out',
    yoyo: true, repeat: 1
  }, 'step-contrast+=0.5');

  // Titles flash
  tl.to(title, {
    color: '#F59E0B', duration: 0.4, ease: 'power2.inOut',
    yoyo: true, repeat: 1
  }, 'step-contrast+=0.2');

  // Fade everything slightly except arrow for final hold
  tl.to([leftPanel, rightPanel], {
    opacity: 0.75, duration: 0.8, ease: 'power2.inOut'
  }, 'step-contrast+=1.2');

  tl.to(arrowCol, {
    opacity: 1, scale: 1.05, duration: 0.5, ease: 'power2.out',
    yoyo: true, repeat: 1, transformOrigin: '50% 50%'
  }, 'step-contrast+=1.2');

  tl.to([leftPanel, rightPanel], {
    opacity: 1, duration: 0.6, ease: 'power2.inOut'
  }, 'step-contrast+=2.5');

  // Final rest with particles continuing
  tl.addLabel('step-end', 'step-contrast+=4');
  tl.to({}, { duration: 2 }, 'step-end');

  // Cleanup particles on end
  tl.call(() => { particlesActive = false; });

})();

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
