<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Gaussian curve on an x-y axis. The y-axis is clearly label</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
// Setup container
const container = document.getElementById('canvas-container');
container.style.cssText = 'background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden;font-family:Inter,sans-serif;';

const W = container.clientWidth, H = container.clientHeight;

// ─── MAIN SVG ───────────────────────────────────────────────────────────────
const mainDiv = document.createElement('div');
mainDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
container.appendChild(mainDiv);

const svg = d3.select(mainDiv).append('svg')
  .attr('width', W).attr('height', H)
  .style('overflow','visible');

// Gaussian PDF
const gaussPDF = (x, mu=0, sigma=1) => Math.exp(-0.5*((x-mu)/sigma)**2) / (sigma*Math.sqrt(2*Math.PI));

// ─── PANEL 1: Main Gaussian with strip ──────────────────────────────────────
const p1 = { x: W*0.05, y: H*0.04, w: W*0.9, h: H*0.52 };
const margin1 = { top: 50, right: 40, bottom: 60, left: 80 };
const pw1 = p1.w - margin1.left - margin1.right;
const ph1 = p1.h - margin1.top - margin1.bottom;

const g1 = svg.append('g').attr('transform', `translate(${p1.x + margin1.left}, ${p1.y + margin1.top})`);

const xScale = d3.scaleLinear().domain([-4, 4]).range([0, pw1]);
const yScale = d3.scaleLinear().domain([0, 0.45]).range([ph1, 0]);

// Grid lines (hidden initially)
const gridG = g1.append('g').attr('class','grid').style('opacity',0);
[-3,-2,-1,0,1,2,3].forEach(v => {
  gridG.append('line').attr('x1',xScale(v)).attr('x2',xScale(v)).attr('y1',0).attr('y2',ph1)
    .attr('stroke','#1f2937').attr('stroke-width',1).attr('stroke-dasharray','4,4');
});
[0.1,0.2,0.3,0.4].forEach(v => {
  gridG.append('line').attr('x1',0).attr('x2',pw1).attr('y1',yScale(v)).attr('y2',yScale(v))
    .attr('stroke','#1f2937').attr('stroke-width',1).attr('stroke-dasharray','4,4');
});

// Axes
const xAxis = g1.append('g').attr('transform',`translate(0,${ph1})`).style('opacity',0);
xAxis.call(d3.axisBottom(xScale).tickValues([-3,-2,-1,0,1,2,3]).tickFormat(d3.format('.0f')));
xAxis.selectAll('text').attr('fill','#c9d1d9').attr('font-size','14px');
xAxis.selectAll('path,line').attr('stroke','#4b5563');

const yAxis = g1.append('g').style('opacity',0);
yAxis.call(d3.axisLeft(yScale).tickValues([0,0.1,0.2,0.3,0.4]).tickFormat(d3.format('.1f')));
yAxis.selectAll('text').attr('fill','#c9d1d9').attr('font-size','14px');
yAxis.selectAll('path,line').attr('stroke','#4b5563');

// Y-axis label
const yLabel = g1.append('text')
  .attr('transform','rotate(-90)')
  .attr('x', -ph1/2).attr('y', -65)
  .attr('text-anchor','middle')
  .attr('fill','#c9d1d9').attr('font-size','13px')
  .style('opacity',0);
// We'll set it via KaTeX div overlay

const yLabelDiv = document.createElement('div');
yLabelDiv.style.cssText = `position:absolute;left:${p1.x+4}px;top:${p1.y+margin1.top+ph1/2-80}px;width:160px;transform:rotate(-90deg);transform-origin:left center;color:#c9d1d9;font-size:13px;font-weight:700;text-align:center;opacity:0;pointer-events:none;`;
yLabelDiv.textContent = 'Probability DENSITY (not probability!)';
mainDiv.appendChild(yLabelDiv);

// X-axis label
const xLabelDiv = document.createElement('div');
xLabelDiv.style.cssText = `position:absolute;left:${p1.x+margin1.left+pw1/2-30}px;top:${p1.y+margin1.top+ph1+40}px;color:#c9d1d9;font-size:14px;opacity:0;`;
xLabelDiv.textContent = 'x';
mainDiv.appendChild(xLabelDiv);

// Gaussian curve path
const lineGen = d3.line()
  .x(d => xScale(d.x)).y(d => yScale(d.y)).curve(d3.curveBasis);
const curveData = d3.range(-4, 4.05, 0.05).map(x => ({ x, y: gaussPDF(x) }));

const curvePath = g1.append('path')
  .datum(curveData)
  .attr('fill','none')
  .attr('stroke','#3B82F6')
  .attr('stroke-width',3)
  .attr('d', lineGen)
  .style('opacity',0);

// Animate path with stroke-dasharray trick
const totalLen = curvePath.node().getTotalLength();
curvePath.attr('stroke-dasharray', totalLen).attr('stroke-dashoffset', totalLen);

// Highlighted strip x=1.0 to x=1.1
const stripX1 = 1.0, stripX2 = 1.1;
const stripData = d3.range(stripX1, stripX2+0.01, 0.01).map(x => ({x, y: gaussPDF(x)}));
const stripAreaGen = d3.area()
  .x(d => xScale(d.x)).y0(ph1).y1(d => yScale(d.y));

const stripArea = g1.append('path')
  .datum(stripData)
  .attr('fill','#3B82F6')
  .attr('fill-opacity', 0.7)
  .attr('d', stripAreaGen)
  .style('opacity',0);

// Strip border lines
const stripLeft = g1.append('line')
  .attr('x1',xScale(stripX1)).attr('x2',xScale(stripX1))
  .attr('y1',ph1).attr('y2',yScale(gaussPDF(stripX1)))
  .attr('stroke','#F59E0B').attr('stroke-width',2).style('opacity',0);
const stripRight = g1.append('line')
  .attr('x1',xScale(stripX2)).attr('x2',xScale(stripX2))
  .attr('y1',ph1).attr('y2',yScale(gaussPDF(stripX2)))
  .attr('stroke','#F59E0B').attr('stroke-width',2).style('opacity',0);

// Strip annotation
const stripAnnotDiv = document.createElement('div');
stripAnnotDiv.style.cssText = `position:absolute;left:${p1.x+margin1.left+xScale(1.15)}px;top:${p1.y+margin1.top+yScale(0.28)}px;color:#F59E0B;font-size:13px;font-weight:600;max-width:220px;opacity:0;pointer-events:none;line-height:1.4;`;
stripAnnotDiv.innerHTML = 'P(1.0 &lt; x &lt; 1.1) =<br>this <strong style="color:#3B82F6">AREA</strong>, not the height';
mainDiv.appendChild(stripAnnotDiv);

// Arrow from annotation to strip
const arrowG = g1.append('g').style('opacity',0);
arrowG.append('line')
  .attr('x1', xScale(1.2)).attr('y1', yScale(0.27))
  .attr('x2', xScale(1.07)).attr('y2', yScale(gaussPDF(1.05)*0.5))
  .attr('stroke','#F59E0B').attr('stroke-width',1.5).attr('marker-end','url(#arrow-yellow)');

// Arrow marker
const defs = svg.append('defs');
defs.append('marker').attr('id','arrow-yellow').attr('markerWidth',8).attr('markerHeight',8)
  .attr('refX',6).attr('refY',3).attr('orient','auto')
  .append('path').attr('d','M0,0 L0,6 L9,3 z').attr('fill','#F59E0B');
defs.append('marker').attr('id','arrow-red').attr('markerWidth',8).attr('markerHeight',8)
  .attr('refX',6).attr('refY',3).attr('orient','auto')
  .append('path').attr('d','M0,0 L0,6 L9,3 z').attr('fill','#EF4444');

// ─── COMMON MISTAKE: red horizontal line from peak ──────────────────────────
const peakY = gaussPDF(0);
const mistakeLine = g1.append('line')
  .attr('x1', xScale(0)).attr('x2', xScale(0))  // will animate x2
  .attr('y1', yScale(peakY)).attr('y2', yScale(peakY))
  .attr('stroke','#EF4444').attr('stroke-width',2).attr('stroke-dasharray','6,4')
  .style('opacity',0);

const peakDot = g1.append('circle')
  .attr('cx', xScale(0)).attr('cy', yScale(peakY)).attr('r', 5)
  .attr('fill','#EF4444').style('opacity',0);

// Red X over the line
const redXDiv = document.createElement('div');
redXDiv.style.cssText = `position:absolute;left:${p1.x+margin1.left+xScale(-2.2)}px;top:${p1.y+margin1.top+yScale(peakY)-22}px;color:#EF4444;font-size:40px;font-weight:900;opacity:0;pointer-events:none;`;
redXDiv.textContent = '✗';
mainDiv.appendChild(redXDiv);

const mistakeTextDiv = document.createElement('div');
mistakeTextDiv.style.cssText = `position:absolute;left:${p1.x+margin1.left+xScale(-4.0)+5}px;top:${p1.y+margin1.top+yScale(peakY)+8}px;color:#EF4444;font-size:12px;font-weight:700;max-width:200px;opacity:0;pointer-events:none;line-height:1.4;`;
mistakeTextDiv.innerHTML = 'COMMON MISTAKE:<br>the height is <u>NOT</u> the<br>probability of that point';
mainDiv.appendChild(mistakeTextDiv);

// ─── PANEL 2: Full curve with total area ────────────────────────────────────
const p2 = { x: W*0.05, y: H*0.59, w: W*0.48, h: H*0.37 };
const margin2 = { top: 30, right: 20, bottom: 50, left: 60 };
const pw2 = p2.w - margin2.left - margin2.right;
const ph2 = p2.h - margin2.top - margin2.bottom;

const g2 = svg.append('g').attr('transform',`translate(${p2.x+margin2.left},${p2.y+margin2.top})`).style('opacity',0);

const xScale2 = d3.scaleLinear().domain([-4,4]).range([0,pw2]);
const yScale2 = d3.scaleLinear().domain([0,0.45]).range([ph2,0]);

// Full shaded area
const fullAreaGen = d3.area().x(d=>xScale2(d.x)).y0(ph2).y1(d=>yScale2(d.y)).curve(d3.curveBasis);
g2.append('path').datum(curveData).attr('fill','#3B82F6').attr('fill-opacity',0.25).attr('d',fullAreaGen);
g2.append('path').datum(curveData).attr('fill','none').attr('stroke','#3B82F6').attr('stroke-width',2).attr('d',
  d3.line().x(d=>xScale2(d.x)).y(d=>yScale2(d.y)).curve(d3.curveBasis)(curveData));

// Axes
const xAxis2 = g2.append('g').attr('transform',`translate(0,${ph2})`);
xAxis2.call(d3.axisBottom(xScale2).tickValues([-3,-2,-1,0,1,2,3]).tickFormat(d3.format('.0f')));
xAxis2.selectAll('text').attr('fill','#c9d1d9').attr('font-size','11px');
xAxis2.selectAll('path,line').attr('stroke','#4b5563');
const yAxis2 = g2.append('g');
yAxis2.call(d3.axisLeft(yScale2).ticks(3).tickFormat(d3.format('.1f')));
yAxis2.selectAll('text').attr('fill','#c9d1d9').attr('font-size','11px');
yAxis2.selectAll('path,line').attr('stroke','#4b5563');

// "Total area = 1.0" label inside panel2
const totalAreaDiv = document.createElement('div');
totalAreaDiv.style.cssText = `position:absolute;left:${p2.x+margin2.left+pw2/2-60}px;top:${p2.y+margin2.top+ph2/2-10}px;color:#22C55E;font-size:15px;font-weight:700;opacity:0;pointer-events:none;`;
totalAreaDiv.textContent = 'Total area = 1.0 (always)';
mainDiv.appendChild(totalAreaDiv);

// Panel 2 title
const p2TitleDiv = document.createElement('div');
p2TitleDiv.style.cssText = `position:absolute;left:${p2.x+margin2.left}px;top:${p2.y+2}px;color:#c9d1d9;font-size:13px;font-weight:600;opacity:0;pointer-events:none;`;
p2TitleDiv.textContent = 'Full distribution: area under curve';
mainDiv.appendChild(p2TitleDiv);

// ─── PANEL 3: Zoomed inset with integral formula ─────────────────────────────
const p3 = { x: W*0.57, y: H*0.59, w: W*0.38, h: H*0.37 };
const margin3 = { top: 30, right: 20, bottom: 50, left: 60 };
const pw3 = p3.w - margin3.left - margin3.right;
const ph3 = p3.h - margin3.top - margin3.bottom;

const g3 = svg.append('g').attr('transform',`translate(${p3.x+margin3.left},${p3.y+margin3.top})`).style('opacity',0);

// Zoomed domain: x=0.5 to 2.0
const xScale3 = d3.scaleLinear().domain([0.5, 2.0]).range([0, pw3]);
const yScale3 = d3.scaleLinear().domain([0, 0.45]).range([ph3, 0]);
const zoomData = d3.range(0.5, 2.05, 0.02).map(x => ({x, y: gaussPDF(x)}));

// Tiny strip a to b (0.8 to 1.0)
const insetStripData = d3.range(0.8, 1.01, 0.01).map(x => ({x, y: gaussPDF(x)}));
const insetStripArea = d3.area().x(d=>xScale3(d.x)).y0(ph3).y1(d=>yScale3(d.y));
g3.append('path').datum(insetStripData).attr('fill','#8B5CF6').attr('fill-opacity',0.6).attr('d',insetStripArea);

// Curve in inset
g3.append('path').datum(zoomData).attr('fill','none').attr('stroke','#3B82F6').attr('stroke-width',2)
  .attr('d', d3.line().x(d=>xScale3(d.x)).y(d=>yScale3(d.y)).curve(d3.curveBasis)(zoomData));

// Axes
const xAxis3 = g3.append('g').attr('transform',`translate(0,${ph3})`);
xAxis3.call(d3.axisBottom(xScale3).tickValues([0.5,1.0,1.5,2.0]).tickFormat(d3.format('.1f')));
xAxis3.selectAll('text').attr('fill','#c9d1d9').attr('font-size','10px');
xAxis3.selectAll('path,line').attr('stroke','#4b5563');
const yAxis3 = g3.append('g');
yAxis3.call(d3.axisLeft(yScale3).ticks(3).tickFormat(d3.format('.2f')));
yAxis3.selectAll('text').attr('fill','#c9d1d9').attr('font-size','10px');
yAxis3.selectAll('path,line').attr('stroke','#4b5563');

// 'a' and 'b' tick labels on x axis
g3.append('text').attr('x',xScale3(0.8)).attr('y',ph3+30).attr('text-anchor','middle')
  .attr('fill','#8B5CF6').attr('font-size','12px').attr('font-weight','700').text('a');
g3.append('text').attr('x',xScale3(1.0)).attr('y',ph3+30).attr('text-anchor','middle')
  .attr('fill','#8B5CF6').attr('font-size','12px').attr('font-weight','700').text('b');

// Vertical dashed lines at a, b
[0.8, 1.0].forEach(v => {
  g3.append('line').attr('x1',xScale3(v)).attr('x2',xScale3(v))
    .attr('y1',ph3).attr('y2',yScale3(gaussPDF(v)))
    .attr('stroke','#8B5CF6').attr('stroke-width',1.5).attr('stroke-dasharray','4,3');
});

// Panel 3 title
const p3TitleDiv = document.createElement('div');
p3TitleDiv.style.cssText = `position:absolute;left:${p3.x+margin3.left}px;top:${p3.y+2}px;color:#c9d1d9;font-size:13px;font-weight:600;opacity:0;pointer-events:none;`;
p3TitleDiv.textContent = 'Zoomed inset: infinitesimal strip';
mainDiv.appendChild(p3TitleDiv);

// KaTeX integral formula below inset
const formulaDiv = document.createElement('div');
formulaDiv.style.cssText = `position:absolute;left:${p3.x+margin3.left-10}px;top:${p3.y+margin3.top+ph3+36}px;color:#c9d1d9;font-size:15px;opacity:0;pointer-events:none;`;
katex.render('P(a < x < b) = \\int_a^b f(x)\\,dx', formulaDiv, {throwOnError:false});
mainDiv.appendChild(formulaDiv);

// ─── PANEL BORDER BOXES ──────────────────────────────────────────────────────
const panel2Box = svg.append('rect')
  .attr('x',p2.x).attr('y',p2.y).attr('width',p2.w).attr('height',p2.h)
  .attr('fill','none').attr('stroke','#1f2937').attr('stroke-width',1).attr('rx',8)
  .style('opacity',0);
const panel3Box = svg.append('rect')
  .attr('x',p3.x).attr('y',p3.y).attr('width',p3.w).attr('height',p3.h)
  .attr('fill','none').attr('stroke','#1f2937').attr('stroke-width',1).attr('rx',8)
  .style('opacity',0);

// ─── STEP 1: Draw axes and Gaussian curve ───────────────────────────────────
tl.addLabel('step-axes')
  .to(gridG.node(), { opacity:1, duration:0.5 })
  .to(xAxis.node(), { opacity:1, duration:0.6 }, '<')
  .to(yAxis.node(), { opacity:1, duration:0.6 }, '<')
  .to(yLabelDiv, { opacity:1, duration:0.8 }, '<+0.2')
  .to(xLabelDiv, { opacity:1, duration:0.5 }, '<')
  .addLabel('step-curve')
  .to(curvePath.node(), { opacity:1, duration:0.1 })
  .to(curvePath.node(), { attr:{ 'stroke-dashoffset': 0 }, duration:2.5, ease:'power2.inOut' })

// ─── STEP 2: Show strip + annotation ────────────────────────────────────────
  .addLabel('step-strip')
  .to(stripArea.node(), { opacity:1, duration:0.8, ease:'power2.out' })
  .to(stripLeft.node(), { opacity:1, duration:0.4 }, '<')
  .to(stripRight.node(), { opacity:1, duration:0.4 }, '<')
  .to(stripAnnotDiv, { opacity:1, duration:0.6, y:-8, ease:'back.out' }, '<+0.3')
  .to(arrowG.node(), { opacity:1, duration:0.4 }, '<+0.2')

// ─── STEP 3: Common mistake - red horizontal line ───────────────────────────
  .addLabel('step-mistake')
  .to(peakDot.node(), { opacity:1, duration:0.4 })
  .to(mistakeLine.node(), { opacity:1, duration:0.2 }, '<')
  .to(mistakeLine.node(), { attr:{ x2: xScale(-4) }, duration:1.2, ease:'power2.out' }, '<')
  .to(redXDiv, { opacity:1, duration:0.3, scale:1.2, ease:'back.out' }, '<+0.8')
  .to(redXDiv, { scale:1, duration:0.2 }, '<+0.3')
  .to(mistakeTextDiv, { opacity:1, duration:0.7, x:5, ease:'power2.out' }, '<+0.1')

// ─── STEP 4: Panel 2 — full area ─────────────────────────────────────────────
  .addLabel('step-totalarea')
  .to(panel2Box.node(), { opacity:1, duration:0.4 })
  .to(g2.node(), { opacity:1, duration:1.0, ease:'power2.inOut' })
  .to(p2TitleDiv, { opacity:1, duration:0.5 }, '<+0.3')
  .to(totalAreaDiv, { opacity:1, duration:0.8, y:-6, ease:'back.out' }, '<+0.5')

// ─── STEP 5: Panel 3 — zoomed inset + integral formula ───────────────────────
  .addLabel('step-integral')
  .to(panel3Box.node(), { opacity:1, duration:0.4 })
  .to(g3.node(), { opacity:1, duration:1.0, ease:'power2.inOut' })
  .to(p3TitleDiv, { opacity:1, duration:0.5 }, '<+0.3')
  .to(formulaDiv, { opacity:1, duration:1.0, y:-6, ease:'back.out' }, '<+0.6')
  .to({}, { duration: 3 });

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
