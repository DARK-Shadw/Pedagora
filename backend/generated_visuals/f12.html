<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A VAE training loop visualization. Left: the true posterior </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.cssText = 'width:100vw;height:100vh;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:Inter,sans-serif;';

// ── Layout ──────────────────────────────────────────────────────────────────
const W = container.clientWidth, H = container.clientHeight;

const topRow = document.createElement('div');
topRow.style.cssText = 'display:flex;align-items:flex-start;justify-content:center;gap:40px;width:100%;padding:20px 40px;box-sizing:border-box;';

const panelW = Math.min(320, (W - 200) / 2);
const panelH = panelW;

// ── P(z|x) Panel ────────────────────────────────────────────────────────────
const leftWrap = document.createElement('div');
leftWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;';
const leftLabel = document.createElement('div');
leftLabel.style.cssText = 'color:#8B5CF6;font-size:14px;font-weight:600;letter-spacing:0.5px;';
leftLabel.textContent = 'True Posterior  P(z | x)';
const leftSvgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
leftSvgEl.setAttribute('width', panelW); leftSvgEl.setAttribute('height', panelH);
leftSvgEl.style.cssText = 'border:1px solid #1e2433;border-radius:10px;background:#0a0e18;';
leftWrap.appendChild(leftLabel); leftWrap.appendChild(leftSvgEl);

// ── KL Meter Panel ──────────────────────────────────────────────────────────
const meterWrap = document.createElement('div');
meterWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:120px;';
const meterTitle = document.createElement('div');
meterTitle.style.cssText = 'color:#F59E0B;font-size:12px;font-weight:700;text-align:center;letter-spacing:0.5px;';
meterTitle.textContent = 'KL Divergence';
const meterSvgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
meterSvgEl.setAttribute('width','60'); meterSvgEl.setAttribute('height', Math.min(220, panelH * 0.7));
const klValueDiv = document.createElement('div');
klValueDiv.style.cssText = 'color:#F59E0B;font-size:22px;font-weight:700;';
klValueDiv.textContent = '4.82';
const klSubDiv = document.createElement('div');
klSubDiv.style.cssText = 'color:#6b7280;font-size:11px;text-align:center;';
klSubDiv.textContent = 'nats';
meterWrap.appendChild(meterTitle); meterWrap.appendChild(meterSvgEl);
meterWrap.appendChild(klValueDiv); meterWrap.appendChild(klSubDiv);

// ── Q(z|x) Panel ────────────────────────────────────────────────────────────
const rightWrap = document.createElement('div');
rightWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;';
const rightLabel = document.createElement('div');
rightLabel.style.cssText = 'color:#3B82F6;font-size:14px;font-weight:600;letter-spacing:0.5px;';
rightLabel.textContent = 'Approximate Posterior  Q(z | x)';
const rightSvgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
rightSvgEl.setAttribute('width', panelW); rightSvgEl.setAttribute('height', panelH);
rightSvgEl.style.cssText = 'border:1px solid #1e2433;border-radius:10px;background:#0a0e18;';
rightWrap.appendChild(rightLabel); rightWrap.appendChild(rightSvgEl);

topRow.appendChild(leftWrap);
topRow.appendChild(meterWrap);
topRow.appendChild(rightWrap);

// ── Equation Row ─────────────────────────────────────────────────────────────
const eqRow = document.createElement('div');
eqRow.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;opacity:0;';
const eqDiv = document.createElement('div');
eqDiv.style.cssText = 'color:#c9d1d9;font-size:15px;padding:12px 24px;border:1px solid #2d3748;border-radius:8px;background:#111827;';
katex.render('\\mathcal{L}_{\\text{VAE}} = \\underbrace{\\mathbb{E}[\\log p(x|z)]}_{\\text{Reconstruction}} - \\underbrace{D_{\\text{KL}}\\bigl(Q(z|x)\\,\\|\\,P(z)\\bigr)}_{\\text{KL Term}}', eqDiv, {throwOnError:false,displayMode:true});
const annotDiv = document.createElement('div');
annotDiv.style.cssText = 'color:#22C55E;font-size:12px;max-width:520px;text-align:center;line-height:1.6;padding:8px 16px;border-left:3px solid #22C55E;background:#0a1a10;border-radius:4px;';
annotDiv.innerHTML = '<strong>KL Term</strong> pulls Q toward the Gaussian prior — keeping the latent space organized &amp; smooth.';
eqRow.appendChild(eqDiv); eqRow.appendChild(annotDiv);

// ── Step Indicator ───────────────────────────────────────────────────────────
const stepDiv = document.createElement('div');
stepDiv.style.cssText = 'color:#6b7280;font-size:12px;margin-top:6px;letter-spacing:1px;text-transform:uppercase;';
stepDiv.textContent = 'Initializing...';

container.appendChild(topRow);
container.appendChild(eqRow);
container.appendChild(stepDiv);

// ── D3 Setup ─────────────────────────────────────────────────────────────────
const margin = {top:16,right:16,bottom:28,left:28};
const iW = panelW - margin.left - margin.right;
const iH = panelH - margin.top - margin.bottom;

const xScale = d3.scaleLinear().domain([-4,4]).range([0,iW]);
const yScale = d3.scaleLinear().domain([-4,4]).range([iH,0]);

function makeG(svgEl) {
  const g = d3.select(svgEl).append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  g.append('g').attr('class','x-axis').attr('transform',`translate(0,${iH})`).call(d3.axisBottom(xScale).ticks(5).tickSize(3)).call(a=>{a.select('.domain').attr('stroke','#2d3748');a.selectAll('text').attr('fill','#4b5563').attr('font-size','9px');a.selectAll('.tick line').attr('stroke','#2d3748');});
  g.append('g').attr('class','y-axis').call(d3.axisLeft(yScale).ticks(5).tickSize(3)).call(a=>{a.select('.domain').attr('stroke','#2d3748');a.selectAll('text').attr('fill','#4b5563').attr('font-size','9px');a.selectAll('.tick line').attr('stroke','#2d3748');});
  return g;
}

const leftG = makeG(leftSvgEl);
const rightG = makeG(rightSvgEl);

// ── Gaussian helpers ──────────────────────────────────────────────────────────
function gaussianPDF2D(x, y, mx, my, sx, sy, rho) {
  const dx = (x-mx)/sx, dy = (y-my)/sy;
  const z = dx*dx - 2*rho*dx*dy + dy*dy;
  return Math.exp(-z / (2*(1-rho*rho)));
}

function multiModalPDF(x, y) {
  const peaks = [
    {mx:-1.5, my:1.2, sx:0.7, sy:0.5, rho:0.3, w:0.4},
    {mx:1.2,  my:-0.8, sx:0.6, sy:0.8, rho:-0.2, w:0.35},
    {mx:0.2,  my:1.8, sx:0.5, sy:0.4, rho:0.1, w:0.25},
  ];
  return peaks.reduce((s,p) => s + p.w * gaussianPDF2D(x,y,p.mx,p.my,p.sx,p.sy,p.rho), 0);
}

// ── Build P(z|x) contour ──────────────────────────────────────────────────────
const n = 50;
const xs = d3.range(n).map(i => -4 + 8*i/(n-1));
const ys = d3.range(n).map(i => -4 + 8*i/(n-1));
const values = [];
for (let j=0;j<n;j++) for (let i=0;i<n;i++) values.push(multiModalPDF(xs[i], ys[j]));

const contourGen = d3.contours().size([n,n]).thresholds(d3.range(0.05, 0.95, 0.1));
const contourData = contourGen(values);

const xScaleContour = d3.scaleLinear().domain([0,n]).range([0,iW]);
const yScaleContour = d3.scaleLinear().domain([0,n]).range([iH,0]);

const colorScaleP = d3.scaleSequential(d3.interpolatePurples).domain([0,1]);

const pContourGroup = leftG.append('g').attr('class','p-contours');
contourData.forEach((c,idx) => {
  pContourGroup.append('path')
    .datum(c)
    .attr('d', d3.geoPath(d3.geoIdentity().scale(1).translate([0,0]).reflectY(true).fitSize([iW,iH], c)))
    .attr('fill', colorScaleP(c.value))
    .attr('fill-opacity', 0.7)
    .attr('stroke', '#8B5CF6')
    .attr('stroke-width', idx % 2 === 0 ? 0.5 : 0)
    .attr('stroke-opacity', 0.4)
    .style('opacity', 0);
});

// Mode labels on P
[{x:-1.5,y:1.2,label:'Mode 1'},{x:1.2,y:-0.8,label:'Mode 2'},{x:0.2,y:1.8,label:'Mode 3'}].forEach(m => {
  leftG.append('text').attr('x',xScale(m.x)).attr('y',yScale(m.y)-8)
    .attr('fill','#c9d1d9').attr('font-size','10px').attr('text-anchor','middle')
    .attr('opacity',0).attr('class','mode-label').text(m.label);
});

// ── KL Meter (vertical bar) ───────────────────────────────────────────────────
const mH = parseInt(meterSvgEl.getAttribute('height'));
const meterG = d3.select(meterSvgEl).append('g').attr('transform','translate(15,10)');
const barH = mH - 20;
meterG.append('rect').attr('x',0).attr('y',0).attr('width',30).attr('height',barH)
  .attr('rx',4).attr('fill','#1e2433').attr('stroke','#2d3748');
const klBarFill = meterG.append('rect').attr('id','kl-fill')
  .attr('x',1).attr('y',barH*0.02).attr('width',28).attr('height',barH*0.96)
  .attr('rx',3).attr('fill','#F59E0B').attr('opacity',0.85);
const klGlow = meterG.append('rect').attr('id','kl-glow')
  .attr('x',1).attr('y',barH*0.02).attr('width',28).attr('height',barH*0.96)
  .attr('rx',3).attr('fill','#F59E0B').attr('filter','url(#glow-filter)').attr('opacity',0.4);

const defs = d3.select(meterSvgEl).append('defs');
const filter = defs.append('filter').attr('id','glow-filter').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
filter.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation','4').attr('result','blur');
filter.append('feComposite').attr('in','SourceGraphic').attr('in2','blur').attr('operator','over');

// ── Q(z|x) visualization ─────────────────────────────────────────────────────
// State: mean (mx,my), std (sx,sy), rotation rho
let qState = {mx:0, my:0, sx:2.5, sy:2.0, rho:0};

// Draw Q ellipse via SVG ellipse + clip path approach
const qDefs = d3.select(rightSvgEl).append('defs');
const radialGrad = qDefs.append('radialGradient').attr('id','q-grad')
  .attr('cx','50%').attr('cy','50%').attr('r','50%');
radialGrad.append('stop').attr('offset','0%').attr('stop-color','#3B82F6').attr('stop-opacity','0.6');
radialGrad.append('stop').attr('offset','100%').attr('stop-color','#3B82F6').attr('stop-opacity','0.05');

const qContourGroup = rightG.append('g').attr('class','q-contours');

function drawQContours(state) {
  qContourGroup.selectAll('*').remove();
  const levels = [0.1, 0.3, 0.5, 0.7, 0.9];
  const nq = 40;
  const qxs = d3.range(nq).map(i => -4 + 8*i/(nq-1));
  const qys = d3.range(nq).map(i => -4 + 8*i/(nq-1));
  const qvals = [];
  for (let j=0;j<nq;j++) for (let i=0;i<nq;i++) {
    qvals.push(gaussianPDF2D(qxs[i], qys[j], state.mx, state.my, state.sx, state.sy, state.rho));
  }
  const qContourGen2 = d3.contours().size([nq,nq]).thresholds(levels);
  const qData = qContourGen2(qvals);
  const colorScaleQ = d3.scaleSequential(d3.interpolateBlues).domain([0,1]);
  qData.forEach(c => {
    qContourGroup.append('path')
      .datum(c)
      .attr('d', d3.geoPath(d3.geoIdentity().reflectY(true).fitSize([iW,iH], c)))
      .attr('fill', colorScaleQ(c.value))
      .attr('fill-opacity', 0.55)
      .attr('stroke', '#3B82F6')
      .attr('stroke-width', 0.8)
      .attr('stroke-opacity', 0.7);
  });
  // Mean marker
  qContourGroup.append('circle')
    .attr('cx', xScale(state.mx)).attr('cy', yScale(state.my))
    .attr('r', 5).attr('fill', '#3B82F6').attr('opacity', 0.9);
  qContourGroup.append('text')
    .attr('x', xScale(state.mx)+8).attr('y', yScale(state.my)-6)
    .attr('fill','#93C5FD').attr('font-size','10px').text('μ');
}

// Axes labels
rightG.append('text').attr('x',iW/2).attr('y',iH+22).attr('fill','#4b5563').attr('font-size','10px').attr('text-anchor','middle').text('z₁');
rightG.append('text').attr('x',-20).attr('y',iH/2).attr('fill','#4b5563').attr('font-size','10px').attr('text-anchor','middle').attr('transform',`rotate(-90,-20,${iH/2})`).text('z₂');
leftG.append('text').attr('x',iW/2).attr('y',iH+22).attr('fill','#4b5563').attr('font-size','10px').attr('text-anchor','middle').text('z₁');
leftG.append('text').attr('x',-20).attr('y',iH/2).attr('fill','#4b5563').attr('font-size','10px').attr('text-anchor','middle').attr('transform',`rotate(-90,-20,${iH/2})`).text('z₂');

// ── Training steps data ───────────────────────────────────────────────────────
const trainingSteps = [
  {mx:0,    my:0,    sx:2.5, sy:2.0, rho:0,    kl:4.82, label:'Step 0: Wide Gaussian Prior'},
  {mx:-0.3, my:0.3,  sx:2.0, sy:1.7, rho:0.1,  kl:3.91, label:'Step 50: First Shift'},
  {mx:-0.7, my:0.6,  sx:1.5, sy:1.3, rho:0.2,  kl:2.85, label:'Step 150: Narrowing'},
  {mx:-1.0, my:0.9,  sx:1.1, sy:1.0, rho:0.25, kl:1.94, label:'Step 300: Converging'},
  {mx:-1.2, my:1.0,  sx:0.85,sy:0.75,rho:0.28, kl:1.22, label:'Step 500: Near Mode 1'},
  {mx:-1.4, my:1.15, sx:0.72,sy:0.58,rho:0.3,  kl:0.61, label:'Step 800: Close Fit'},
  {mx:-1.5, my:1.2,  sx:0.68,sy:0.52,rho:0.3,  kl:0.38, label:'Step 1000: Converged'},
];

// ── GSAP Timeline ─────────────────────────────────────────────────────────────
tl.addLabel('intro');

// Fade in P contours
tl.to(pContourGroup.selectAll('path').nodes(), {opacity:1, duration:1.5, stagger:0.06, ease:'power2.out'}, 'intro');
tl.to(leftG.selectAll('.mode-label').nodes(), {opacity:1, duration:0.8, stagger:0.2, ease:'power2.out'}, 'intro+=0.5');
tl.to(stepDiv, {
  duration:0.5,
  onStart: () => { stepDiv.textContent = 'Step 1 — True Posterior: Multi-modal & Complex'; }
}, 'intro');

// Show initial Q (wide Gaussian)
tl.addLabel('q-init', 'intro+=2');
tl.to({}, {
  duration: 0.1,
  onStart: () => {
    qState = {...trainingSteps[0]};
    drawQContours(qState);
    stepDiv.textContent = trainingSteps[0].label;
    klValueDiv.textContent = trainingSteps[0].kl.toFixed(2);
  }
}, 'q-init');
tl.from(rightSvgEl, {opacity:0, duration:1.0, ease:'power2.out'}, 'q-init');
// KL bar full
tl.to(klBarFill.node(), {attr:{height: (mH-20)*0.96, y: (mH-20)*0.02}, duration:1.0}, 'q-init');
tl.to(klGlow.node(), {attr:{height: (mH-20)*0.96, y: (mH-20)*0.02}, duration:1.0}, 'q-init');

// ── Training loop ─────────────────────────────────────────────────────────────
tl.addLabel('training', 'q-init+=1.5');
tl.to(stepDiv, {duration:0.3, onStart:()=>{stepDiv.textContent = 'Step 2 — Training: Q adapts to minimize KL divergence';}}, 'training');

trainingSteps.slice(1).forEach((step, idx) => {
  const t = `training+=${idx * 18}`;
  const totalBarH = (mH-20)*0.96;
  const maxKL = 4.82;
  const fillRatio = step.kl / maxKL;
  const newBarH = totalBarH * fillRatio;
  const newBarY = (mH-20)*0.02 + totalBarH*(1-fillRatio);

  const proxy = {kl: parseFloat(klValueDiv.textContent)};
  tl.to(proxy, {
    kl: step.kl,
    duration: 6,
    ease: 'power1.inOut',
    onUpdate: function() {
      klValueDiv.textContent = proxy.kl.toFixed(2);
    },
    onStart: () => {
      stepDiv.textContent = step.label;
    }
  }, t);

  tl.to(klBarFill.node(), {
    attr:{height: newBarH, y: newBarY},
    duration:6, ease:'power1.inOut'
  }, t);
  tl.to(klGlow.node(), {
    attr:{height: newBarH, y: newBarY},
    duration:6, ease:'power1.inOut'
  }, t);

  // Redraw Q at midpoint
  tl.to({}, {
    duration:0.1,
    onStart: () => {
      qState = {...step};
      drawQContours(qState);
    }
  }, `${t}+=3`);

  // Color shift of KL bar green as it decreases
  if (step.kl < 1.0) {
    tl.to(klBarFill.node(), {attr:{fill:'#22C55E'}, duration:2}, t);
    tl.to(klGlow.node(), {attr:{fill:'#22C55E'}, duration:2}, t);
    tl.to(meterTitle, {color:'#22C55E', duration:1}, t);
    tl.to(klValueDiv, {color:'#22C55E', duration:1}, t);
  }
});

// ── Convergence annotation ───────────────────────────────────────────────────
tl.addLabel('converged', `training+=${trainingSteps.length * 18}`);
tl.to(stepDiv, {
  duration:0.3,
  onStart:()=>{stepDiv.textContent = 'Step 3 — Converged: Q approximates one mode of P';}
}, 'converged');

// Highlight Mode 1 on P side
tl.to({},{duration:0.1,onStart:()=>{
  leftG.append('circle')
    .attr('cx', xScale(-1.5)).attr('cy', yScale(1.2))
    .attr('r',0).attr('fill','none').attr('stroke','#22C55E')
    .attr('stroke-width',2).attr('id','mode1-ring').attr('opacity',0.9);
}}, 'converged');
tl.to(document.getElementById('mode1-ring') || {}, {
  onStart:()=>{
    const ring = d3.select('#mode1-ring');
    ring.transition().duration(800).attr('r',28).attr('stroke-opacity',0.8)
      .transition().duration(400).attr('r',24);
  }, duration:1.5
}, 'converged+=0.2');

// Arrow between panels (conceptual match)
const arrowSvg = document.createElementNS('http://www.w3.org/2000/svg','svg');
arrowSvg.setAttribute('width','40'); arrowSvg.setAttribute('height','40');
arrowSvg.style.cssText = 'position:absolute;opacity:0;';
const arrowPath = document.createElementNS('http://www.w3.org/2000/svg','path');
arrowPath.setAttribute('d','M5 20 L35 20 M25 10 L35 20 L25 30');
arrowPath.setAttribute('stroke','#22C55E'); arrowPath.setAttribute('stroke-width','2');
arrowPath.setAttribute('fill','none'); arrowPath.setAttribute('stroke-linecap','round');
arrowSvg.appendChild(arrowPath);

// Show equation
tl.to(eqRow, {opacity:1, y:0, duration:1.2, ease:'power2.out'}, 'converged+=1');

// Pulse the KL annotation
tl.to(annotDiv, {
  boxShadow:'0 0 20px rgba(34,197,94,0.4)',
  duration:0.8,
  repeat:2,
  yoyo:true,
  ease:'power2.inOut'
}, 'converged+=2');

// Final state - Q shown side by side with callout
tl.to(stepDiv, {
  duration:0.3,
  onStart:()=>{
    stepDiv.innerHTML = '<span style="color:#22C55E">&#x2713;</span> Q(z|x) &asymp; Mode 1 of P(z|x) &nbsp;|&nbsp; <span style="color:#F59E0B">KL kept low by prior regularization</span>';
  }
}, 'converged+=3');

// Gentle pulsing of Q to show it's "alive" but stable
tl.to(rightSvgEl, {
  opacity:0.85, duration:1, repeat:4, yoyo:true, ease:'sine.inOut'
}, 'converged+=4');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
