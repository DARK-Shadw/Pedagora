<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A large square representing the full sample space, divided i</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
container.style.position = 'relative';
container.style.overflow = 'hidden';
container.style.background = '#0d1117';

const W = container.clientWidth || window.innerWidth;
const H = container.clientHeight || window.innerHeight;

// SVG setup
const svg = d3.select(container).append('svg')
  .attr('width', W).attr('height', H)
  .style('position', 'absolute').style('top', 0).style('left', 0);

const cx = W / 2, cy = H / 2;
const sqSize = Math.min(W, H) * 0.52;
const sqX = cx - sqSize / 2, sqY = cy - sqSize / 2;

// Label div overlay
const labelDiv = document.createElement('div');
labelDiv.style.cssText = `position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;`;
container.appendChild(labelDiv);

// ---- Draw defs/clips ----
const defs = svg.append('defs');

// Clip for the full square
defs.append('clipPath').attr('id', 'sq-clip').append('rect')
  .attr('x', sqX).attr('y', sqY).attr('width', sqSize).attr('height', sqSize);

// Region B: left 75% of the square (30% of full space = 0.30, so B occupies 75% width of square if we treat square = 1.0, but let's use proportional areas)
// Total area = sqSize^2 = 1.0 (normalized)
// A = 40%, B = 30%, A∩B = 20%
// Layout: place B as a rectangle on the left portion, A as a rectangle on the top portion, overlap in top-left
// B: full height, width = 0.42 * sqSize  => area 0.42 * 1.0 = 0.42 ≈ adjusted
// Better: use a simple intuitive layout
// B region: left side strip, width = sqrt(0.30)*sqSize ≈ 0.548*sqSize, height = sqSize  => area ratio 0.548
// Let's just do rectangular regions for clarity
// B: horizontal band, height = 0.55 * sqSize (so area ~ 0.55 of full square → represents ~30% of sample space visually labeled)
// We'll annotate with actual percentages regardless of exact pixel area

const bH = sqSize * 0.55; // B region height
const bY = sqY + sqSize - bH; // B at bottom portion
const aW = sqSize * 0.72; // A region width
const aX = sqX; // A at left portion

// Overlap region (A∩B): intersection of A and B rectangles
const ovX = aX, ovY = bY, ovW = aW, ovH = bH;

// ---- BACKGROUND ELEMENTS (all initially hidden) ----

// Full square border
const fullSquare = svg.append('rect')
  .attr('x', sqX).attr('y', sqY).attr('width', sqSize).attr('height', sqSize)
  .attr('fill', '#1e293b').attr('stroke', '#c9d1d9').attr('stroke-width', 2)
  .style('opacity', 0);

// Region A (blue)
const regionA = svg.append('rect')
  .attr('x', aX).attr('y', sqY).attr('width', aW).attr('height', sqSize)
  .attr('fill', '#3B82F6').attr('fill-opacity', 0.35)
  .attr('clip-path', 'url(#sq-clip)').style('opacity', 0);

// Region B (green)
const regionB = svg.append('rect')
  .attr('x', sqX).attr('y', bY).attr('width', sqSize).attr('height', bH)
  .attr('fill', '#22C55E').attr('fill-opacity', 0.35)
  .attr('clip-path', 'url(#sq-clip)').style('opacity', 0);

// Overlap A∩B (teal)
const regionAB = svg.append('rect')
  .attr('x', ovX).attr('y', ovY).attr('width', ovW).attr('height', ovH)
  .attr('fill', '#0d968b').attr('fill-opacity', 0.7)
  .attr('clip-path', 'url(#sq-clip)').style('opacity', 0);

// Sample space label
const ssLabel = svg.append('text')
  .attr('x', sqX + sqSize - 12).attr('y', sqY + 22)
  .attr('text-anchor', 'end').attr('fill', '#c9d1d9').attr('font-size', 15)
  .attr('font-family', 'Inter, sans-serif')
  .text('Sample Space Ω').style('opacity', 0);

// Region A label
const aLabel = svg.append('text')
  .attr('x', aX + aW * 0.38).attr('y', sqY + 36)
  .attr('text-anchor', 'middle').attr('fill', '#93c5fd')
  .attr('font-size', 16).attr('font-weight', 'bold').attr('font-family', 'Inter, sans-serif')
  .text('A').style('opacity', 0);

const aSubLabel = svg.append('text')
  .attr('x', aX + aW * 0.38).attr('y', sqY + 56)
  .attr('text-anchor', 'middle').attr('fill', '#93c5fd')
  .attr('font-size', 12).attr('font-family', 'Inter, sans-serif')
  .text('Frame has face (40%)').style('opacity', 0);

// Region B label
const bLabel = svg.append('text')
  .attr('x', sqX + sqSize - 16).attr('y', bY + 22)
  .attr('text-anchor', 'end').attr('fill', '#86efac')
  .attr('font-size', 16).attr('font-weight', 'bold').attr('font-family', 'Inter, sans-serif')
  .text('B').style('opacity', 0);

const bSubLabel = svg.append('text')
  .attr('x', sqX + sqSize - 16).attr('y', bY + 42)
  .attr('text-anchor', 'end').attr('fill', '#86efac')
  .attr('font-size', 12).attr('font-family', 'Inter, sans-serif')
  .text('Well-lit (30%)').style('opacity', 0);

// Overlap label
const abLabel = svg.append('text')
  .attr('x', ovX + ovW * 0.5).attr('y', ovY + ovH * 0.42)
  .attr('text-anchor', 'middle').attr('fill', '#ffffff')
  .attr('font-size', 14).attr('font-weight', 'bold').attr('font-family', 'Inter, sans-serif')
  .text('A ∩ B').style('opacity', 0);

const abSubLabel = svg.append('text')
  .attr('x', ovX + ovW * 0.5).attr('y', ovY + ovH * 0.42 + 20)
  .attr('text-anchor', 'middle').attr('fill', '#5eead4')
  .attr('font-size', 12).attr('font-family', 'Inter, sans-serif')
  .text('20%').style('opacity', 0);

// ---- STEP 2: Gray-out overlay (everything except B) ----
const grayTop = svg.append('rect')
  .attr('x', sqX).attr('y', sqY).attr('width', sqSize).attr('height', sqSize - bH)
  .attr('fill', '#0d1117').attr('fill-opacity', 0.72)
  .attr('clip-path', 'url(#sq-clip)').style('opacity', 0);

// B region highlight border
const bHighlight = svg.append('rect')
  .attr('x', sqX).attr('y', bY).attr('width', sqSize).attr('height', bH)
  .attr('fill', 'none').attr('stroke', '#22C55E').attr('stroke-width', 3)
  .attr('stroke-dasharray', '8,4').attr('clip-path', 'url(#sq-clip)').style('opacity', 0);

// "Given B occurred" annotation
const givenDiv = document.createElement('div');
givenDiv.style.cssText = `position:absolute;left:${sqX + sqSize + 24}px;top:${bY + 10}px;color:#86efac;font-family:Inter,sans-serif;font-size:14px;max-width:180px;opacity:0;`;
givenDiv.innerHTML = '<span style="font-weight:700;font-size:15px;">Given: B occurred</span><br><span style="color:#c9d1d9;font-size:12px;">We know the frame is well-lit. The rest of the sample space is irrelevant.</span>';
labelDiv.appendChild(givenDiv);

// ---- STEP 3: Circle around overlap + formula ----
// Ellipse circle around overlap
const overlapCircle = svg.append('ellipse')
  .attr('cx', ovX + ovW * 0.5).attr('cy', ovY + ovH * 0.5)
  .attr('rx', ovW * 0.48).attr('ry', ovH * 0.48)
  .attr('fill', 'none').attr('stroke', '#f59e0b')
  .attr('stroke-width', 3).attr('stroke-dasharray', '6,3')
  .style('opacity', 0);

// Formula div (KaTeX)
const formulaDiv = document.createElement('div');
const formulaX = sqX - 20;
const formulaY = sqY - 110;
formulaDiv.style.cssText = `position:absolute;left:${formulaX}px;top:${formulaY}px;color:#c9d1d9;font-family:Inter,sans-serif;opacity:0;`;
labelDiv.appendChild(formulaDiv);

// Render KaTeX formula
const formulaEl = document.createElement('div');
formulaEl.style.cssText = 'font-size:18px;margin-bottom:8px;';
katex.render('P(A|B) = \\dfrac{P(A \\cap B)}{P(B)} = \\dfrac{0.20}{0.30} = 0.\\overline{6} \\approx 0.67', formulaEl, { throwOnError: false, displayMode: true });
formulaDiv.appendChild(formulaEl);

// Step-by-step breakdown lines
const step1El = document.createElement('div');
step1El.style.cssText = 'font-size:13px;color:#86efac;margin-top:6px;opacity:0;transition:opacity 0.5s;';
step1El.textContent = '→ P(A ∩ B) = 0.20  (face AND well-lit)';
formulaDiv.appendChild(step1El);

const step2El = document.createElement('div');
step2El.style.cssText = 'font-size:13px;color:#22C55E;margin-top:4px;opacity:0;transition:opacity 0.5s;';
step2El.textContent = '→ P(B) = 0.30  (frame is well-lit)';
formulaDiv.appendChild(step2El);

// Final annotation
const annotDiv = document.createElement('div');
annotDiv.style.cssText = `position:absolute;left:${sqX}px;top:${sqY + sqSize + 22}px;width:${sqSize}px;text-align:center;color:#f59e0b;font-family:Inter,sans-serif;font-size:15px;font-weight:600;opacity:0;`;
annotDiv.textContent = '"Given the frame is well-lit, there\'s a 67% chance it contains a face."';
labelDiv.appendChild(annotDiv);

// Title
const titleDiv = document.createElement('div');
titleDiv.style.cssText = `position:absolute;left:0;top:24px;width:100%;text-align:center;color:#c9d1d9;font-family:Inter,sans-serif;font-size:22px;font-weight:700;opacity:0;letter-spacing:0.5px;`;
titleDiv.textContent = 'Conditional Probability: P(A | B)';
labelDiv.appendChild(titleDiv);

// ---- BUILD TIMELINE ----

// Step 1: Intro — show the full sample space and regions
tl.addLabel('intro')
  .to(titleDiv, { opacity: 1, duration: 0.8, ease: 'power2.out' })
  .to(fullSquare.node(), { opacity: 1, duration: 0.9, ease: 'power2.out' }, '<0.3')
  .to(ssLabel.node(), { opacity: 1, duration: 0.6 }, '<0.4')
  .to(regionA.node(), { opacity: 1, duration: 1.0, ease: 'power2.inOut' }, '+=0.4')
  .to(aLabel.node(), { opacity: 1, duration: 0.5 }, '<0.2')
  .to(aSubLabel.node(), { opacity: 1, duration: 0.5 }, '<0.1')
  .to(regionB.node(), { opacity: 1, duration: 1.0, ease: 'power2.inOut' }, '+=0.3')
  .to(bLabel.node(), { opacity: 1, duration: 0.5 }, '<0.2')
  .to(bSubLabel.node(), { opacity: 1, duration: 0.5 }, '<0.1')
  .to(regionAB.node(), { opacity: 1, duration: 1.0, ease: 'power2.inOut' }, '+=0.3')
  .to(abLabel.node(), { opacity: 1, duration: 0.5 }, '<0.2')
  .to(abSubLabel.node(), { opacity: 1, duration: 0.5 }, '<0.1')

// Step 2: Condition on B — gray out non-B, highlight B
  .addLabel('condition-on-b', '+=1.5')
  .to(grayTop.node(), { opacity: 1, duration: 1.2, ease: 'power2.inOut' })
  .to(bHighlight.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' }, '<0.3')
  .to(givenDiv, { opacity: 1, duration: 0.8, ease: 'power2.out' }, '<0.2')
  // Pulse the B region highlight
  .to(bHighlight.node(), { attr: { 'stroke-width': 5 }, duration: 0.4, ease: 'power2.inOut', yoyo: true, repeat: 3 }, '+=0.5')

// Step 3: Circle overlap, show formula
  .addLabel('formula', '+=1.2')
  .to(overlapCircle.node(), { opacity: 1, duration: 0.8, ease: 'power2.out' })
  .to(overlapCircle.node(), {
    attr: { rx: ovW * 0.52, ry: ovH * 0.52 },
    duration: 0.5, ease: 'power2.inOut', yoyo: true, repeat: 2
  }, '<0.1')
  .to(formulaDiv, { opacity: 1, duration: 1.0, ease: 'power2.out' }, '<0.3')
  .to(step1El, { opacity: 1, duration: 0.6 }, '+=0.6')
  .to(step2El, { opacity: 1, duration: 0.6 }, '+=0.4')

// Step 4: Final annotation
  .addLabel('result', '+=1.2')
  .to(annotDiv, { opacity: 1, duration: 1.0, ease: 'power2.out' })
  .to(overlapCircle.node(), {
    attr: { stroke: '#f59e0b', 'stroke-width': 4 },
    duration: 0.4
  }, '<')
  // Gentle final pulse on annotation
  .to(annotDiv, { opacity: 0.7, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 3 }, '+=0.8');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
