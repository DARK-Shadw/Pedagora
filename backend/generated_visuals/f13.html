<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A distribution curve f(x) with a shaded area beneath it. Ver</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
const W = container.clientWidth || window.innerWidth;
const H = container.clientHeight || window.innerHeight;

const C = {
  bg: '#0d1117', text: '#c9d1d9',
  blue: '#3B82F6', red: '#EF4444', green: '#22C55E',
  yellow: '#F59E0B', purple: '#8B5CF6'
};

const svg = d3.select('#canvas-container').append('svg')
  .attr('width', W).attr('height', H)
  .style('position', 'absolute').style('top', 0).style('left', 0);

const ov = document.createElement('div');
ov.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
container.appendChild(ov);

const mkDiv = (css) => {
  const el = document.createElement('div');
  el.style.cssText = css + ';opacity:0;';
  ov.appendChild(el);
  return el;
};
const mkKatex = (latex, css) => {
  const el = mkDiv(css);
  katex.render(latex, el, { throwOnError: false });
  return el;
};
const mkText = (text, css) => {
  const el = mkDiv(css);
  el.textContent = text;
  return el;
};

// ===== DATA =====
const gaussPDF = (x, mu = 0, sigma = 1) =>
  Math.exp(-0.5 * ((x - mu) / sigma) ** 2) / (sigma * Math.sqrt(2 * Math.PI));

const pts = [-2, -1, 0, 1, 2];
const rawP = pts.map(x => gaussPDF(x));
const pSum = rawP.reduce((a, b) => a + b, 0);
const P = rawP.map(p => p / pSum);

const Ex = pts.reduce((s, x, i) => s + x * P[i], 0);
const Ex2 = pts.reduce((s, x, i) => s + x * x * P[i], 0);

// ===== LAYOUT =====
const PAD_L = 60, PAD_R = 30, PAD_T = 58;
const PH = Math.round(H * 0.41);
const PW = W - PAD_L - PAD_R;
const plotBotY = PAD_T + PH;

const xSc = d3.scaleLinear().domain([-3, 3]).range([PAD_L, PAD_L + PW]);
const ySc = d3.scaleLinear().domain([0, gaussPDF(0) * 1.18]).range([plotBotY, PAD_T]);

const BEY  = Math.round(H * 0.64);
const BE2Y = Math.round(H * 0.85);
const BX_L = Math.round(W * 0.11);
const BX_R = Math.round(W * 0.89);
const bSc  = d3.scaleLinear().domain([-3, 3]).range([BX_L, BX_R]);
const b2Sc = d3.scaleLinear().domain([-0.2, 4.6]).range([BX_L, BX_R]);

// ===== DISTRIBUTION CURVE =====
const curveData = d3.range(-3, 3.01, 0.04).map(x => [x, gaussPDF(x)]);

const areaFn = d3.area()
  .x(d => xSc(d[0])).y0(plotBotY).y1(d => ySc(d[1]))
  .curve(d3.curveBasis);
const lineFn = d3.line()
  .x(d => xSc(d[0])).y(d => ySc(d[1]))
  .curve(d3.curveBasis);

const shadePath = svg.append('path').datum(curveData)
  .attr('d', areaFn).attr('fill', C.blue).attr('opacity', 0);
const curvePath = svg.append('path').datum(curveData)
  .attr('d', lineFn).attr('fill', 'none')
  .attr('stroke', C.blue).attr('stroke-width', 3).attr('opacity', 0);

// Axes
const axG = svg.append('g').attr('opacity', 0);
axG.append('line')
  .attr('x1', PAD_L).attr('x2', PAD_L + PW)
  .attr('y1', plotBotY).attr('y2', plotBotY)
  .attr('stroke', C.text).attr('stroke-width', 1.5).attr('opacity', 0.55);

[-3, -2, -1, 0, 1, 2, 3].forEach(v => {
  axG.append('line')
    .attr('x1', xSc(v)).attr('x2', xSc(v))
    .attr('y1', plotBotY).attr('y2', plotBotY + 7)
    .attr('stroke', C.text).attr('stroke-width', 1.5);
  axG.append('text')
    .attr('x', xSc(v)).attr('y', plotBotY + 23)
    .attr('text-anchor', 'middle').attr('fill', C.text).attr('font-size', 13)
    .text(v);
});

// Y axis
const yTickVals = [0.1, 0.2, 0.3];
yTickVals.forEach(v => {
  axG.append('line')
    .attr('x1', PAD_L - 6).attr('x2', PAD_L)
    .attr('y1', ySc(v)).attr('y2', ySc(v))
    .attr('stroke', C.text).attr('stroke-width', 1.2).attr('opacity', 0.5);
  axG.append('text')
    .attr('x', PAD_L - 10).attr('y', ySc(v) + 4)
    .attr('text-anchor', 'end').attr('fill', C.text).attr('font-size', 11).attr('opacity', 0.7)
    .text(v.toFixed(1));
});

// f(x) curve label
const fxLbl = svg.append('text')
  .attr('x', xSc(-2.1)).attr('y', ySc(gaussPDF(-2.1)) - 14)
  .attr('fill', C.blue).attr('font-size', 22).attr('font-style', 'italic')
  .attr('font-family', 'serif').text('f(x)').attr('opacity', 0);

// Vertical dotted lines, probability labels, x-value labels, animated circles
const vLines = [], pLabels = [], xLabels = [], cNodes = [];

pts.forEach((x, i) => {
  const p = P[i];
  const cx = xSc(x);
  const cy = ySc(gaussPDF(x));

  vLines.push(svg.append('line')
    .attr('x1', cx).attr('x2', cx)
    .attr('y1', plotBotY).attr('y2', cy)
    .attr('stroke', C.yellow).attr('stroke-width', 1.8)
    .attr('stroke-dasharray', '6,3').attr('opacity', 0).node());

  pLabels.push(svg.append('text')
    .attr('x', cx).attr('y', cy - 10)
    .attr('text-anchor', 'middle').attr('fill', C.yellow).attr('font-size', 12)
    .text(`p=${p.toFixed(2)}`).attr('opacity', 0).node());

  xLabels.push(svg.append('text')
    .attr('x', cx).attr('y', plotBotY + 42)
    .attr('text-anchor', 'middle').attr('fill', C.text).attr('font-size', 12)
    .text(`x=${x}`).attr('opacity', 0).node());

  const r = Math.max(7, p * 50);
  cNodes.push(svg.append('circle')
    .attr('cx', cx).attr('cy', plotBotY)
    .attr('r', r).attr('fill', C.purple).attr('opacity', 0).node());
});

// E[x] result on distribution plot
const exDot = svg.append('circle')
  .attr('cx', xSc(Ex)).attr('cy', plotBotY).attr('r', 0)
  .attr('fill', C.green).attr('opacity', 0);
const exTick = svg.append('line')
  .attr('x1', xSc(Ex)).attr('x2', xSc(Ex))
  .attr('y1', plotBotY - 5).attr('y2', plotBotY - 55)
  .attr('stroke', C.green).attr('stroke-width', 2.5).attr('opacity', 0);

// ===== BALANCE BEAM (E[x]) =====
const beamG = svg.append('g').attr('opacity', 0);

beamG.append('rect')
  .attr('x', BX_L).attr('y', BEY - 4)
  .attr('width', BX_R - BX_L).attr('height', 8)
  .attr('fill', C.text).attr('rx', 4).attr('opacity', 0.75);

const fulX = bSc(Ex);
beamG.append('polygon')
  .attr('points', `${fulX},${BEY} ${fulX - 18},${BEY + 34} ${fulX + 18},${BEY + 34}`)
  .attr('fill', C.green).attr('opacity', 0.85);
beamG.append('rect')
  .attr('x', fulX - 26).attr('y', BEY + 34)
  .attr('width', 52).attr('height', 6)
  .attr('fill', C.green).attr('rx', 3);

const bCircles = [], bPLabels = [];
pts.forEach((x, i) => {
  const r = Math.max(9, P[i] * 72);
  bCircles.push(svg.append('circle')
    .attr('cx', bSc(x)).attr('cy', BEY)
    .attr('r', r).attr('fill', C.blue).attr('opacity', 0).node());
  bPLabels.push(svg.append('text')
    .attr('x', bSc(x)).attr('y', BEY - r - 7)
    .attr('text-anchor', 'middle').attr('fill', C.yellow).attr('font-size', 11)
    .text(P[i].toFixed(2)).attr('opacity', 0).node());
});

const bMarker = svg.append('line')
  .attr('x1', bSc(Ex)).attr('x2', bSc(Ex))
  .attr('y1', BEY - 40).attr('y2', BEY + 8)
  .attr('stroke', C.green).attr('stroke-width', 3).attr('stroke-dasharray', '4,3')
  .attr('opacity', 0);

// ===== BALANCE BEAM (E[x²]) =====
const beam2G = svg.append('g').attr('opacity', 0);

beam2G.append('rect')
  .attr('x', BX_L).attr('y', BE2Y - 3)
  .attr('width', BX_R - BX_L).attr('height', 6)
  .attr('fill', C.text).attr('rx', 3).attr('opacity', 0.6);

const ful2X = b2Sc(Ex2);
beam2G.append('polygon')
  .attr('points', `${ful2X},${BE2Y} ${ful2X - 16},${BE2Y + 28} ${ful2X + 16},${BE2Y + 28}`)
  .attr('fill', C.purple).attr('opacity', 0.85);
beam2G.append('rect')
  .attr('x', ful2X - 22).attr('y', BE2Y + 28)
  .attr('width', 44).attr('height', 5)
  .attr('fill', C.purple).attr('rx', 2);

const b2Circles = [], b2Labels = [];
pts.forEach((x, i) => {
  const x2 = x * x;
  const r = Math.max(8, P[i] * 65);
  b2Circles.push(svg.append('circle')
    .attr('cx', b2Sc(x2)).attr('cy', BE2Y)
    .attr('r', r).attr('fill', C.purple).attr('opacity', 0).node());
  b2Labels.push(svg.append('text')
    .attr('x', b2Sc(x2)).attr('y', BE2Y - r - 5)
    .attr('text-anchor', 'middle').attr('fill', C.text).attr('font-size', 10)
    .text(`x²=${x2}`).attr('opacity', 0).node());
});

const b2Marker = svg.append('line')
  .attr('x1', ful2X).attr('x2', ful2X)
  .attr('y1', BE2Y - 34).attr('y2', BE2Y + 6)
  .attr('stroke', C.purple).attr('stroke-width', 3).attr('stroke-dasharray', '4,3')
  .attr('opacity', 0);

// Comparison arrow between E[x] and E[x²] on beam2
const cmpArrow = svg.append('line')
  .attr('x1', b2Sc(Ex)).attr('x2', b2Sc(Ex2))
  .attr('y1', BE2Y - 50).attr('y2', BE2Y - 50)
  .attr('stroke', C.yellow).attr('stroke-width', 2)
  .attr('marker-end', 'url(#arrowhead)').attr('opacity', 0);

// Arrow marker
const defs = svg.append('defs');
defs.append('marker')
  .attr('id', 'arrowhead').attr('markerWidth', 8).attr('markerHeight', 6)
  .attr('refX', 8).attr('refY', 3).attr('orient', 'auto')
  .append('polygon')
  .attr('points', '0 0, 8 3, 0 6').attr('fill', C.yellow);

// ===== OVERLAY LABELS =====
const titleEl = mkText('Expectation: Probability-Weighted Average',
  `position:absolute;top:13px;left:50%;transform:translateX(-50%);
   color:${C.text};font-size:20px;font-weight:700;font-family:sans-serif;white-space:nowrap;`);

const formulaEl = mkKatex('E[x] = \\displaystyle\\sum_{x} x \\cdot p(x)',
  `position:absolute;top:${plotBotY + 55}px;left:50%;transform:translateX(-50%);
   color:${C.yellow};font-size:16px;`);

const exResEl = mkKatex(`E[x] \\approx ${Ex.toFixed(2)}`,
  `position:absolute;top:${plotBotY - 76}px;left:${xSc(Ex) + 16}px;
   color:${C.green};font-size:16px;font-weight:bold;`);

const beamTitleEl = mkText('Physical Analogy: Balance Beam',
  `position:absolute;top:${BEY - 50}px;left:${BX_L}px;
   color:${C.text};font-size:15px;font-family:sans-serif;font-weight:600;`);

const comEl = mkKatex('E[x] = \\text{center of mass of the distribution}',
  `position:absolute;top:${BEY + 48}px;left:50%;transform:translateX(-50%);
   color:${C.green};font-size:14px;`);

const ex2TitleEl = mkText('Second Example: E[x²] — Different Balance Point',
  `position:absolute;top:${BE2Y - 46}px;left:${BX_L}px;
   color:${C.purple};font-size:14px;font-family:sans-serif;font-weight:600;`);

const ex2ResEl = mkKatex(`E[x^2] = \\sum x^2 \\cdot p(x) \\approx ${Ex2.toFixed(2)}`,
  `position:absolute;top:${BE2Y + 38}px;left:50%;transform:translateX(-50%);
   color:${C.purple};font-size:14px;`);

const conclusionEl = mkText('Expectation = probability-weighted average of ANY function of x',
  `position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
   color:${C.text};font-size:15px;font-family:sans-serif;
   background:rgba(13,17,23,0.92);padding:10px 24px;
   border-radius:8px;border:2px solid ${C.purple};white-space:nowrap;`);

// ===== TIMELINE =====

// --- STEP 1: intro — distribution curve appears ---
tl.addLabel('intro');

tl.to(titleEl, { opacity: 1, duration: 0.9 }, 'intro');
tl.to(curvePath.node(), { opacity: 1, duration: 1.3 }, 'intro+=0.6');
tl.to(shadePath.node(), { opacity: 0.14, duration: 1.2 }, 'intro+=0.6');
tl.to(axG.node(), { opacity: 1, duration: 0.8 }, 'intro+=0.9');
tl.to(fxLbl.node(), { opacity: 1, duration: 0.7 }, 'intro+=1.4');

// Vertical lines and labels appear one by one
pts.forEach((_, i) => {
  const t = 2.0 + i * 0.4;
  tl.to(vLines[i], { opacity: 1, duration: 0.45 }, `intro+=${t}`);
  tl.to(pLabels[i], { opacity: 1, duration: 0.4 }, `intro+=${t + 0.1}`);
  tl.to(xLabels[i], { opacity: 1, duration: 0.35 }, `intro+=${t + 0.05}`);
});

// Formula fades in below plot
tl.to(formulaEl, { opacity: 1, duration: 1.0 }, 'intro+=4.8');

// Pause before weighted-avg step
// --- STEP 2: weighted-avg — circles lift off and merge to E[x] ---
tl.addLabel('weighted-avg', 'intro+=7');

// Show weighted circles at base
pts.forEach((_, i) => {
  tl.to(cNodes[i], { opacity: 0.85, duration: 0.4 }, `weighted-avg+=${i * 0.15}`);
});

// Lift circles upward, scaled by probability weight
pts.forEach((x, i) => {
  const liftY = plotBotY - 22 - P[i] * 110;
  const bigR = Math.max(7, P[i] * 50) * (1 + P[i] * 1.8);
  tl.to(cNodes[i], {
    attr: { cy: liftY, r: bigR },
    duration: 1.0, ease: 'power2.out'
  }, `weighted-avg+=${0.9 + i * 0.14}`);
});

// Brief pause to show lifted weights
// Merge all circles toward E[x] on the number line
pts.forEach((_, i) => {
  tl.to(cNodes[i], {
    attr: { cx: xSc(Ex), cy: plotBotY - 4, r: 5 },
    opacity: 0.3,
    duration: 1.1, ease: 'power2.inOut'
  }, `weighted-avg+=${3.1 + i * 0.09}`);
});

// E[x] marker emerges with elastic pop
tl.to(exDot.node(), {
  attr: { r: 20 }, opacity: 1,
  duration: 0.8, ease: 'elastic.out(1, 0.55)'
}, 'weighted-avg+=4.5');
tl.to(exTick.node(), { opacity: 1, duration: 0.6 }, 'weighted-avg+=4.8');
tl.to(exResEl, { opacity: 1, duration: 0.7 }, 'weighted-avg+=5.2');

// Pulse E[x] dot to draw attention
tl.to(exDot.node(), {
  attr: { r: 26 }, opacity: 0.7,
  duration: 0.5, ease: 'power2.out', yoyo: true, repeat: 1
}, 'weighted-avg+=6.0');

// Fade formula before beam section
tl.to(formulaEl, { opacity: 0, duration: 0.5 }, 'weighted-avg+=7.5');

// --- STEP 3: balance-beam — physical seesaw analogy ---
tl.addLabel('balance-beam', 'weighted-avg+=9');

tl.to(beamTitleEl, { opacity: 1, duration: 0.7 }, 'balance-beam');
tl.to(beamG.node(), { opacity: 1, duration: 1.0 }, 'balance-beam+=0.5');

// Drop weight circles onto beam one by one
pts.forEach((_, i) => {
  tl.to(bCircles[i], { opacity: 0.88, duration: 0.45 }, `balance-beam+=${1.2 + i * 0.28}`);
  tl.to(bPLabels[i], { opacity: 1, duration: 0.4 }, `balance-beam+=${1.4 + i * 0.28}`);
});

// Beam tilts left, then right, then settles balanced
tl.to(beamG.node(), {
  rotation: -8, svgOrigin: `${fulX} ${BEY}`,
  duration: 0.6, ease: 'power1.inOut'
}, 'balance-beam+=3.5');
tl.to(beamG.node(), {
  rotation: 8, svgOrigin: `${fulX} ${BEY}`,
  duration: 0.9, ease: 'power1.inOut'
}, 'balance-beam+=4.2');
tl.to(beamG.node(), {
  rotation: 0, svgOrigin: `${fulX} ${BEY}`,
  duration: 0.8, ease: 'elastic.out(1, 0.5)'
}, 'balance-beam+=5.2');

// Balance marker and center-of-mass label
tl.to(bMarker.node(), { opacity: 1, duration: 0.7 }, 'balance-beam+=6.2');
tl.to(comEl, { opacity: 1, duration: 0.8 }, 'balance-beam+=6.6');

// --- STEP 4: ex-squared — E[x²] with shifted balance point ---
tl.addLabel('ex-squared', 'balance-beam+=9');

tl.to(ex2TitleEl, { opacity: 1, duration: 0.7 }, 'ex-squared');
tl.to(beam2G.node(), { opacity: 1, duration: 0.9 }, 'ex-squared+=0.5');

// Place x² weight circles
pts.forEach((_, i) => {
  tl.to(b2Circles[i], { opacity: 0.85, duration: 0.4 }, `ex-squared+=${1.2 + i * 0.22}`);
  tl.to(b2Labels[i], { opacity: 1, duration: 0.35 }, `ex-squared+=${1.35 + i * 0.22}`);
});

// E[x²] balance marker
tl.to(b2Marker.node(), { opacity: 1, duration: 0.7 }, 'ex-squared+=3.0');
tl.to(ex2ResEl, { opacity: 1, duration: 0.8 }, 'ex-squared+=3.4');

// Arrow showing the shift from E[x] to E[x²]
tl.to(cmpArrow.node(), { opacity: 1, duration: 0.6 }, 'ex-squared+=4.2');

// Flash both markers to highlight the difference
tl.to([bMarker.node(), b2Marker.node()], {
  opacity: 0.2, duration: 0.35,
  yoyo: true, repeat: 3
}, 'ex-squared+=5.0');

// --- STEP 5: conclusion ---
tl.addLabel('conclusion', 'ex-squared+=7');

tl.to(conclusionEl, { opacity: 1, duration: 1.2, ease: 'power2.inOut' }, 'conclusion');

// Glow pulse on conclusion banner
tl.to(conclusionEl, {
  boxShadow: `0 0 32px ${C.purple}88`,
  duration: 1.4, yoyo: true, repeat: 3,
  ease: 'power2.inOut'
}, 'conclusion+=1.3');

// ── Auto-play after setup ──

tl.pause(); tl.seek(0);
</script>
</body>
</html>
