<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>test-bars</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (!action) return;
    const _d = tl.duration ? tl.duration() : 0;
    const _t = tl.time ? tl.time() : 0;
    const _n = Object.keys(tl.labels || {}).length;
    console.log(`[AnimFrame] ${action} ${label||''} dur=${_d.toFixed(1)} t=${_t.toFixed(1)} labels=${_n}`);
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const c = document.getElementById('canvas-container'); const margin = {top: 100, right: 100, bottom: 100, left: 100}; const width = window.innerWidth - margin.left - margin.right; const height = window.innerHeight - margin.top - margin.bottom; const svg = d3.select(c).append('svg').attr('width', '100%').attr('height', '100%').style('opacity', 0); const g = svg.append('g').attr('transform', `translate(${margin.left}, ${margin.top})`); const x = d3.scaleBand().domain([1, 2, 3, 4, 5, 6]).range([0, width]).padding(0.2); const y = d3.scaleLinear().domain([0, 0.3]).range([height, 0]); const xAxis = d3.axisBottom(x); const yAxis = d3.axisLeft(y).ticks(5).tickFormat(d3.format('.1f')); g.append('g').attr('class', 'x-axis').attr('transform', `translate(0, ${height})`).call(xAxis).style('color', '#c9d1d9'); g.append('g').attr('class', 'y-axis').call(yAxis).style('color', '#c9d1d9'); const bars = g.selectAll('.bar').data([1, 2, 3, 4, 5, 6]).enter().append('rect').attr('class', 'bar').attr('x', d => x(d)).attr('y', height).attr('width', x.bandwidth()).attr('height', 0).attr('fill', '#3B82F6'); const line = g.append('line').attr('x1', x(3.5)).attr('x2', x(3.5)).attr('y1', height).attr('y2', height).attr('stroke', '#EF4444').attr('stroke-width', 4).attr('stroke-dasharray', '8,8').style('opacity', 0); const eqEl = document.createElement('div'); eqEl.style.cssText = 'position:absolute; left:50%; top:15%; transform:translateX(-50%); color:white; opacity:0;'; c.appendChild(eqEl); katex.render('E[X] = 3.5', eqEl, {throwOnError: false, displayMode: true}); tl.addLabel('show-axes'); tl.to(svg, {opacity: 1, duration: 1.5}); tl.addLabel('bars-grow'); tl.to(bars, {y: d => y(1/6), height: d => height - y(1/6), duration: 1.5, stagger: 0.3}); tl.addLabel('expected-value-line'); tl.to(line, {y1: 0, opacity: 1, duration: 1.5}); tl.to(eqEl, {opacity: 1, y: 20, duration: 1.0}, '<+=0.5');

// ── DO NOT auto-play. The teacher controls all playback via postMessage. ──
// The classroom's lockstep engine seeks to each step and tweens between
// them, so the timeline must stay paused at t=0 until commanded otherwise.
// [test mode] pause removed — use controls below
</script>

<div id="test-controls" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
     z-index:9999; display:flex; gap:12px; align-items:center; background:rgba(0,0,0,0.85);
     padding:10px 20px; border-radius:12px; font-family:monospace; color:#c9d1d9; font-size:14px;">
  <button onclick="tl.seek(0);tl.pause()" style="background:#333;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Reset</button>
  <button onclick="tl.play()" style="background:#22C55E;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:bold">Play</button>
  <button onclick="tl.pause()" style="background:#EF4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Pause</button>
  <span id="step-display" style="min-width:140px">step: -</span>
  <span id="time-display" style="min-width:80px">0.0s</span>
  <div id="label-btns" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
</div>
<script>
// Build per-label seek buttons
const _labels = Object.keys(tl.labels || {});
const _btnC = document.getElementById('label-btns');
_labels.forEach(l => {
  const b = document.createElement('button');
  b.textContent = l;
  b.style.cssText = 'background:#3B82F6;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;';
  b.onclick = () => { tl.seek(l); tl.pause(); };
  _btnC.appendChild(b);
});
// Update display
setInterval(() => {
  document.getElementById('time-display').textContent = tl.time().toFixed(1) + 's';
  const s = window.animationAPI.getCurrentStep();
  document.getElementById('step-display').textContent = 'step: ' + (s || '-');
}, 100);
</script>

</body>
</html>
