<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A die rolls repeatedly. After each roll, a histogram bar inc</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (!action) return;
    const _d = tl.duration ? tl.duration() : 0;
    const _t = tl.time ? tl.time() : 0;
    const _n = Object.keys(tl.labels || {}).length;
    console.log(`[AnimFrame] ${action} ${label||''} dur=${_d.toFixed(1)} t=${_t.toFixed(1)} labels=${_n}`);
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const c = document.getElementById('canvas-container'); const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%'); svg.style.position = 'absolute'; c.appendChild(svg); const bars = []; const barWidth = 60; const gap = 20; const startX = (window.innerWidth - (6 * barWidth + 5 * gap)) / 2; for(let i=0; i<6; i++) { const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); rect.setAttribute('x', startX + i * (barWidth + gap)); rect.setAttribute('y', window.innerHeight - 100); rect.setAttribute('width', barWidth); rect.setAttribute('height', 0); rect.setAttribute('fill', '#3B82F6'); rect.style.opacity = 0; svg.appendChild(rect); bars.push(rect); } const title = document.createElement('div'); title.style.cssText = 'position:absolute; top:5%; width:100%; text-align:center; color:#c9d1d9; font-size:2em; opacity:0;'; c.appendChild(title); katex.render('PMF \text{ of a Fair Die}', title, {throwOnError: false}); const counter = document.createElement('div'); counter.style.cssText = 'position:absolute; top:15%; width:100%; text-align:center; color:#F59E0B; font-size:1.5em; opacity:0;'; c.appendChild(counter); const fracLabels = []; for(let i=0; i<6; i++) { const f = document.createElement('div'); f.style.cssText = 'position:absolute; bottom:120px; opacity:0; color:#fff;'; f.style.left = (startX + i * (barWidth + gap) + 15) + 'px'; c.appendChild(f); katex.render('\frac{1}{6}', f, {throwOnError: false}); fracLabels.push(f); } tl.addLabel('ten-rolls'); tl.to(bars, {opacity: 1, duration: 0.5}); tl.to(bars, {height: (i) => [20, 120, 40, 80, 30, 90][i], y: (i) => window.innerHeight - 100 - [20, 120, 40, 80, 30, 90][i], duration: 1}); tl.addLabel('hundred-rolls', '+=2'); tl.to(bars, {height: (i) => [60, 70, 65, 75, 68, 72][i], y: (i) => window.innerHeight - 100 - [60, 70, 65, 75, 68, 72][i], duration: 1}); tl.addLabel('thousand-rolls', '+=2'); tl.to(bars, {height: 80, y: window.innerHeight - 180, duration: 1}); tl.addLabel('pmf-label', '+=2'); tl.to(title, {opacity: 1, duration: 0.5}); tl.to(fracLabels, {opacity: 1, duration: 0.5}); tl.addLabel('mass-metaphor', '+=2'); tl.to(counter, {opacity: 1, duration: 0.5}); katex.render('\sum_{i=1}^6 P(X=i) = 1.0', counter, {throwOnError: false}); tl.to(bars, {fill: '#8B5CF6', duration: 0.5});

// ── DO NOT auto-play. The teacher controls all playback via postMessage. ──
// The classroom's lockstep engine seeks to each step and tweens between
// them, so the timeline must stay paused at t=0 until commanded otherwise.
// [test mode] pause removed — use controls below
</script>

<div id="test-controls" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
     z-index:9999; display:flex; gap:12px; align-items:center; background:rgba(0,0,0,0.85);
     padding:10px 20px; border-radius:12px; font-family:monospace; color:#c9d1d9; font-size:14px;">
  <button onclick="tl.seek(0);tl.pause()" style="background:#333;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Reset</button>
  <button onclick="tl.play()" style="background:#22C55E;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:bold">Play</button>
  <button onclick="tl.pause()" style="background:#EF4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Pause</button>
  <span id="step-display" style="min-width:140px">step: -</span>
  <span id="time-display" style="min-width:80px">0.0s</span>
  <div id="label-btns" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
</div>
<script>
// Build per-label seek buttons
const _labels = Object.keys(tl.labels || {});
const _btnC = document.getElementById('label-btns');
_labels.forEach(l => {
  const b = document.createElement('button');
  b.textContent = l;
  b.style.cssText = 'background:#3B82F6;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;';
  b.onclick = () => { tl.seek(l); tl.pause(); };
  _btnC.appendChild(b);
});
// Update display
setInterval(() => {
  document.getElementById('time-display').textContent = tl.time().toFixed(1) + 's';
  const s = window.animationAPI.getCurrentStep();
  document.getElementById('step-display').textContent = 'step: ' + (s || '-');
}, 100);
</script>

</body>
</html>
