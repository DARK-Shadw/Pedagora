<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Left side shows a bubble labeled 'Experiment' containing ico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (!action) return;
    const _d = tl.duration ? tl.duration() : 0;
    const _t = tl.time ? tl.time() : 0;
    const _n = Object.keys(tl.labels || {}).length;
    console.log(`[AnimFrame] ${action} ${label||''} dur=${_d.toFixed(1)} t=${_t.toFixed(1)} labels=${_n}`);
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const c = document.getElementById('canvas-container'); const createEl = (tag, style) => { const el = document.createElement(tag); el.style.cssText = style; c.appendChild(el); return el; }; const expBubble = createEl('div', 'position:absolute; left:15%; top:30%; width:300px; height:300px; border:2px solid #c9d1d9; border-radius:50%; opacity:0;'); const expTitle = createEl('div', 'position:absolute; left:15%; top:20%; color:#c9d1d9; opacity:0; font-size:1.2em;'); expTitle.textContent = 'Experiment'; const coin = createEl('div', 'position:absolute; left:25%; top:40%; width:50px; height:50px; border-radius:50%; background:#F59E0B; opacity:0;'); const die = createEl('div', 'position:absolute; left:50%; top:40%; width:50px; height:50px; background:#EF4444; opacity:0;'); const line = createEl('svg', 'position:absolute; left:60%; top:40%; width:300px; height:100px; opacity:0;'); line.innerHTML = '<line x1="0" y1="50" x2="300" y2="50" stroke="white" stroke-width="2"/><line x1="0" y1="40" x2="0" y2="60" stroke="white"/><line x1="150" y1="40" x2="150" y2="60" stroke="white"/><line x1="300" y1="40" x2="300" y2="60" stroke="white"/>'; const lineLabel = createEl('div', 'position:absolute; left:65%; top:55%; color:#c9d1d9; opacity:0;'); lineLabel.textContent = 'Real Numbers'; const arrow = createEl('svg', 'position:absolute; left:30%; top:45%; width:300px; height:100px; opacity:0;'); arrow.innerHTML = '<path d="M0 0 Q 150 -50 300 0" stroke="#3B82F6" fill="none" stroke-width="3" marker-end="url(#arrowhead)"/>'; const funcLabel = createEl('div', 'position:absolute; left:45%; top:20%; opacity:0;'); katex.render('X: \Omega \to \mathbb{R}', funcLabel, {throwOnError: false, displayMode: true}); const highlight = createEl('div', 'position:absolute; left:10%; top:25%; width:350px; height:350px; border:3px solid #22C55E; border-radius:50%; opacity:0;'); const insightText = createEl('div', 'position:absolute; left:20%; top:80%; color:#22C55E; opacity:0; font-size:1.5em;'); insightText.textContent = 'Randomness is HERE'; tl.addLabel('experiment-space'); tl.to(expBubble, {opacity: 1, duration: 1}); tl.to(expTitle, {opacity: 1, duration: 0.5}, '<'); tl.to(coin, {opacity: 1, duration: 0.5}, '+=0.2'); tl.to(die, {opacity: 1, duration: 0.5}, '+=0.2'); tl.addLabel('number-line', '+=1'); tl.to(line, {opacity: 1, duration: 1}); tl.to(lineLabel, {opacity: 1, duration: 0.5}, '<'); tl.addLabel('mapping-arrows', '+=1'); tl.to(arrow, {opacity: 1, duration: 1}); tl.addLabel('formal-label', '+=1'); tl.to(funcLabel, {opacity: 1, duration: 1}); tl.addLabel('key-insight', '+=1'); tl.to(highlight, {opacity: 1, duration: 0.5}); tl.to(insightText, {opacity: 1, duration: 0.5}, '<'); tl.to(arrow, {opacity: 0.3, duration: 0.5}, '<'); tl.to(line, {opacity: 0.3, duration: 0.5}, '<');

// ── DO NOT auto-play. The teacher controls all playback via postMessage. ──
// The classroom's lockstep engine seeks to each step and tweens between
// them, so the timeline must stay paused at t=0 until commanded otherwise.
// [test mode] pause removed — use controls below
</script>

<div id="test-controls" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
     z-index:9999; display:flex; gap:12px; align-items:center; background:rgba(0,0,0,0.85);
     padding:10px 20px; border-radius:12px; font-family:monospace; color:#c9d1d9; font-size:14px;">
  <button onclick="tl.seek(0);tl.pause()" style="background:#333;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Reset</button>
  <button onclick="tl.play()" style="background:#22C55E;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:bold">Play</button>
  <button onclick="tl.pause()" style="background:#EF4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Pause</button>
  <span id="step-display" style="min-width:140px">step: -</span>
  <span id="time-display" style="min-width:80px">0.0s</span>
  <div id="label-btns" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
</div>
<script>
// Build per-label seek buttons
const _labels = Object.keys(tl.labels || {});
const _btnC = document.getElementById('label-btns');
_labels.forEach(l => {
  const b = document.createElement('button');
  b.textContent = l;
  b.style.cssText = 'background:#3B82F6;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;';
  b.onclick = () => { tl.seek(l); tl.pause(); };
  _btnC.appendChild(b);
});
// Update display
setInterval(() => {
  document.getElementById('time-display').textContent = tl.time().toFixed(1) + 's';
  const s = window.animationAPI.getCurrentStep();
  document.getElementById('step-display').textContent = 'step: ' + (s || '-');
}, 100);
</script>

</body>
</html>
