<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bell Curve v3 fixed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Helper: resolve D3 selections to DOM elements for GSAP ──
function _t(el) { return el && typeof el.node === 'function' ? el.node() : el; }

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (!action) return;
    const _d = tl.duration ? tl.duration() : 0;
    const _t = tl.time ? tl.time() : 0;
    const _n = Object.keys(tl.labels || {}).length;
    console.log(`[AnimFrame] ${action} ${label||''} dur=${_d.toFixed(1)} t=${_t.toFixed(1)} labels=${_n}`);
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const c = document.getElementById('canvas-container'); const w = window.innerWidth; const h = window.innerHeight; const svg = d3.select(c).append('svg').attr('width', w).attr('height', h); const margin = {top: 200, right: 100, bottom: 150, left: 100}; const width = w - margin.left - margin.right; const height = h - margin.top - margin.bottom; const x = d3.scaleLinear().domain([-4, 4]).range([0, width]); const y = d3.scaleLinear().domain([0, 0.45]).range([height, 0]); const line = d3.line().x(d => x(d)).y(d => y(1/Math.sqrt(2*Math.PI) * Math.exp(-0.5*d*d))); const data = d3.range(-4, 4.01, 0.1); const g = svg.append('g').attr('transform', `translate(${margin.left}, ${margin.top})`); g.append('path').datum(data).attr('fill', 'none').attr('stroke', '#c9d1d9').attr('stroke-width', 3).attr('d', line); g.append('line').attr('x1', 0).attr('y1', height).attr('x2', width).attr('y2', height).attr('stroke', '#c9d1d9'); const shadeLeft = g.append('path').attr('fill', '#3B82F6').attr('opacity', 0); const shadeCenter = g.append('path').attr('fill', '#22C55E').attr('opacity', 0); const shadePoint = g.append('line').attr('stroke', '#F59E0B').attr('stroke-width', 4).attr('opacity', 0).attr('y1', height).attr('y2', 0); const windowRect = g.append('rect').attr('fill', '#8B5CF6').attr('opacity', 0).attr('height', height).attr('width', 60).attr('y', 0); const eqDiv = document.createElement('div'); eqDiv.style.cssText = 'position:absolute; left:50%; top:10%; transform:translateX(-50%); color:#c9d1d9; font-size:1.5em; opacity:0;'; c.appendChild(eqDiv); const title = document.createElement('div'); title.style.cssText = 'position:absolute; left:50%; top:5%; transform:translateX(-50%); color:#c9d1d9; font-size:2em;'; title.textContent = 'Standard Normal Distribution'; c.appendChild(title); tl.addLabel('full-curve'); tl.from(_t(g.node()), {opacity: 0, duration: 1}); tl.addLabel('shade-left-tail'); tl.to(_t(shadeLeft), {opacity: 0.4, duration: 1, attr: {d: d3.area().x(d => x(d)).y0(height).y1(d => y(1/Math.sqrt(2*Math.PI) * Math.exp(-0.5*d*d)))(d3.range(-4, -1, 0.1))}}); tl.call(() => katex.render('\\text{Area} \\approx 16\\%', eqDiv, {throwOnError: false, displayMode: true})); tl.to(_t(eqDiv), {opacity: 1, duration: 0.5}); tl.addLabel('shade-center'); tl.to(_t(shadeLeft), {opacity: 0, duration: 0.5}); tl.to(_t(eqDiv), {opacity: 0, duration: 0.5}); tl.to(_t(shadeCenter), {opacity: 0.4, duration: 1, attr: {d: d3.area().x(d => x(d)).y0(height).y1(d => y(1/Math.sqrt(2*Math.PI) * Math.exp(-0.5*d*d)))(d3.range(-1, 1, 0.1))}}); tl.call(() => katex.render('\\text{Area} \\approx 68\\%', eqDiv, {throwOnError: false, displayMode: true})); tl.to(_t(eqDiv), {opacity: 1, duration: 0.5}); tl.addLabel('shade-single-point'); tl.to(_t(shadeCenter), {opacity: 0, duration: 0.5}); tl.to(_t(eqDiv), {opacity: 0, duration: 0.5}); tl.to(_t(shadePoint), {opacity: 1, x1: x(0), x2: x(0), duration: 1}); tl.call(() => katex.render('\\text{Area} = 0\\%', eqDiv, {throwOnError: false, displayMode: true})); tl.to(_t(eqDiv), {opacity: 1, duration: 0.5}); tl.addLabel('sliding-window'); tl.to(_t(shadePoint), {opacity: 0, duration: 0.5}); tl.to(_t(eqDiv), {opacity: 0, duration: 0.5}); tl.to(_t(windowRect), {opacity: 0.3, duration: 0.5}); tl.to(_t(windowRect), {x: width - 60, duration: 10, ease: 'linear'});

// ── DO NOT auto-play. The teacher controls all playback via postMessage. ──
// The classroom's lockstep engine seeks to each step and tweens between
// them, so the timeline must stay paused at t=0 until commanded otherwise.
// [test mode] pause removed — use controls below
</script>

<div id="test-controls" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
     z-index:9999; display:flex; gap:12px; align-items:center; background:rgba(0,0,0,0.85);
     padding:10px 20px; border-radius:12px; font-family:monospace; color:#c9d1d9; font-size:14px;">
  <button onclick="tl.seek(0);tl.pause()" style="background:#333;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Reset</button>
  <button onclick="tl.play()" style="background:#22C55E;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:bold">Play</button>
  <button onclick="tl.pause()" style="background:#EF4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Pause</button>
  <span id="step-display" style="min-width:140px">step: -</span>
  <span id="time-display" style="min-width:80px">0.0s</span>
  <div id="label-btns" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
</div>
<script>
// Build per-label seek buttons
const _labels = Object.keys(tl.labels || {});
const _btnC = document.getElementById('label-btns');
_labels.forEach(l => {
  const b = document.createElement('button');
  b.textContent = l;
  b.style.cssText = 'background:#3B82F6;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;';
  b.onclick = () => { tl.seek(l); tl.pause(); };
  _btnC.appendChild(b);
});
// Update display
setInterval(() => {
  document.getElementById('time-display').textContent = tl.time().toFixed(1) + 's';
  const s = window.animationAPI.getCurrentStep();
  document.getElementById('step-display').textContent = 'step: ' + (s || '-');
}, 100);
</script>

</body>
</html>
