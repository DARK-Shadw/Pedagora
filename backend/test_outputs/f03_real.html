<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Left side shows a bubble labeled 'Experiment' containing ico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (!action) return;
    const _d = tl.duration ? tl.duration() : 0;
    const _t = tl.time ? tl.time() : 0;
    const _n = Object.keys(tl.labels || {}).length;
    console.log(`[AnimFrame] ${action} ${label||''} dur=${_d.toFixed(1)} t=${_t.toFixed(1)} labels=${_n}`);
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const c = document.getElementById('canvas-container'); const createEl = (style) => { const el = document.createElement('div'); el.style.cssText = 'position:absolute; opacity:0; ' + style; c.appendChild(el); return el; }; const expBubble = createEl('left:15%; top:30%; width:300px; height:300px; border:2px solid #3B82F6; border-radius:50%; display:flex; justify-content:center; align-items:center; color:#c9d1d9; font-size:2em;'); expBubble.innerHTML = 'Experiment'; const icons = createEl('left:15%; top:50%; font-size:3em;'); icons.innerHTML = '🪙 🎲 🌡️'; const lineContainer = createEl('right:15%; top:40%; width:400px; height:2px; background:#c9d1d9;'); const lineLabel = createEl('right:25%; top:35%; color:#c9d1d9;'); katex.render('Real\ Numbers', lineLabel, {throwOnError: false}); const funcLabel = createEl('left:50%; top:20%; font-size:4em; color:#F59E0B;'); katex.render('X', funcLabel, {throwOnError: false}); const formula = createEl('left:40%; top:75%; color:#c9d1d9;'); katex.render('X: \Omega \to \mathbb{R}', formula, {throwOnError: false}); const highlight = createEl('left:15%; top:30%; width:300px; height:300px; border:4px solid #EF4444; border-radius:50%; opacity:0;'); const insightText = createEl('left:15%; top:70%; color:#EF4444; font-size:1.5em;'); insightText.textContent = 'Randomness is HERE'; tl.addLabel('experiment-space'); tl.to(expBubble, {opacity: 1, duration: 1}); tl.to(icons, {opacity: 1, duration: 1}); tl.addLabel('number-line', '+=1'); tl.to(lineContainer, {opacity: 1, duration: 1}); tl.to(lineLabel, {opacity: 1, duration: 1}); tl.addLabel('mapping-arrows', '+=1'); const arrow = createEl('left:40%; top:45%; font-size:2em; color:#22C55E;'); arrow.innerHTML = '⟶'; tl.to(arrow, {opacity: 1, duration: 1}); tl.addLabel('formal-label', '+=1'); tl.to(funcLabel, {opacity: 1, duration: 1}); tl.to(formula, {opacity: 1, duration: 1}); tl.addLabel('key-insight', '+=1'); tl.to(highlight, {opacity: 1, duration: 1, scale: 1.1}); tl.to(insightText, {opacity: 1, duration: 1}); tl.to([lineContainer, lineLabel, arrow], {opacity: 0.3, duration: 1});

// ── DO NOT auto-play. The teacher controls all playback via postMessage. ──
// The classroom's lockstep engine seeks to each step and tweens between
// them, so the timeline must stay paused at t=0 until commanded otherwise.
tl.pause();
tl.seek(0);
</script>
</body>
</html>
