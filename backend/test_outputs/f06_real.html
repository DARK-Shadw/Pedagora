<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A die rolls repeatedly. After each roll, a histogram bar inc</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#canvas-container {
    width: 100%; height: 100%; position: relative;
}
svg { width: 100%; height: 100%; }
canvas { width: 100%; height: 100%; }
.katex { font-size: 1.4em; }
</style>
</head>
<body>
<div id="canvas-container">

</div>
<script>
// ── GSAP Master Timeline ──
const tl = gsap.timeline({ paused: true });

// ── Animation API (available immediately) ──
window.animationAPI = {
    timeline: tl,
    seekToStep(label) { tl.seek(label); tl.pause(); },
    play() { tl.play(); },
    pause() { tl.pause(); },
    getSteps() { return Object.keys(tl.labels); },
    getCurrentStep() {
        const t = tl.time();
        let current = '';
        for (const [name, time] of Object.entries(tl.labels)) {
            if (time <= t) current = name;
        }
        return current;
    },
    onStepChange(cb) { this._cb = cb; },
    _cb: null,
};

// ── Step change notifier ──
let _lastStep = '';
function _notifyStepChange() {
    const s = window.animationAPI.getCurrentStep();
    if (s !== _lastStep) {
        _lastStep = s;
        if (window.animationAPI._cb) window.animationAPI._cb(s);
        window.parent.postMessage({ event: 'stepChanged', label: s }, '*');
    }
    requestAnimationFrame(_notifyStepChange);
}
_notifyStepChange();

// ── Listen for parent commands ──
window.addEventListener('message', (e) => {
    const { action, label } = e.data || {};
    if (!action) return;
    const _d = tl.duration ? tl.duration() : 0;
    const _t = tl.time ? tl.time() : 0;
    const _n = Object.keys(tl.labels || {}).length;
    console.log(`[AnimFrame] ${action} ${label||''} dur=${_d.toFixed(1)} t=${_t.toFixed(1)} labels=${_n}`);
    if (action === 'seekToStep') window.animationAPI.seekToStep(label);
    else if (action === 'play') window.animationAPI.play();
    else if (action === 'pause') window.animationAPI.pause();
});

// ══════════════════════════════════════════════════════════
// ── ANIMATION CODE (generated by Claude) ──
// ══════════════════════════════════════════════════════════
const c = document.getElementById('canvas-container'); const svg = d3.select(c).append('svg').attr('width', '100%').attr('height', '100%').style('position', 'absolute').style('opacity', 0); const title = document.createElement('div'); title.style.cssText = 'position:absolute; top:5%; left:50%; transform:translateX(-50%); color:#c9d1d9; font-size:2em; opacity:0;'; c.appendChild(title); katex.render('PMF \text{ of a Fair Die}', title, {throwOnError: false}); const counter = document.createElement('div'); counter.style.cssText = 'position:absolute; top:15%; left:50%; transform:translateX(-50%); color:#22C55E; font-size:1.5em; opacity:0;'; c.appendChild(counter); const data = [0, 0, 0, 0, 0, 0]; const xScale = d3.scaleBand().domain([1, 2, 3, 4, 5, 6]).range([200, 800]).padding(0.2); const yScale = d3.scaleLinear().domain([0, 1]).range([500, 200]); const bars = svg.selectAll('rect').data(data).enter().append('rect').attr('x', (d, i) => xScale(i + 1)).attr('y', 500).attr('width', xScale.bandwidth()).attr('height', 0).attr('fill', '#3B82F6'); const labels = svg.selectAll('text').data(data).enter().append('text').attr('x', (d, i) => xScale(i + 1) + xScale.bandwidth() / 2).attr('y', 520).attr('text-anchor', 'middle').attr('fill', '#c9d1d9').style('opacity', 0); tl.addLabel('ten-rolls'); tl.to(svg, {opacity: 1, duration: 1}).to(bars, {height: (d, i) => 500 - yScale(Math.random() * 0.3), y: (d, i) => yScale(Math.random() * 0.3), duration: 2}); tl.addLabel('hundred-rolls', '+=1'); tl.to(bars, {height: (d, i) => 500 - yScale(0.16), y: (d, i) => yScale(0.16), duration: 3, stagger: 0.1}); tl.addLabel('thousand-rolls', '+=1'); tl.to(bars, {height: (d, i) => 500 - yScale(0.166), y: (d, i) => yScale(0.166), duration: 3}); tl.addLabel('pmf-label', '+=1'); tl.to(title, {opacity: 1, duration: 1}).to(labels, {opacity: 1, duration: 1}); labels.each(function(d, i) { katex.render('\frac{1}{6}', this, {throwOnError: false}); }); tl.addLabel('mass-metaphor', '+=1'); tl.to(counter, {opacity: 1, duration: 1}).fromTo(counter, {innerHTML: 0}, {innerHTML: 1, duration: 3, snap: {innerHTML: 0.01}, onUpdate: function() { counter.innerHTML = 'Total Mass = ' + this.targets()[0].innerHTML; }});

// ── DO NOT auto-play. The teacher controls all playback via postMessage. ──
// The classroom's lockstep engine seeks to each step and tweens between
// them, so the timeline must stay paused at t=0 until commanded otherwise.
tl.pause();
tl.seek(0);
</script>
</body>
</html>
